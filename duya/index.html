}

:root[data-theme="dark"]{
  --bg:#0f1512; --surface:#161e1a; --sunk:#1d2722; --ink:#e3ebe5; --muted:#93a39a; --line:#2c3832;
  --felt:#1f5c3d; --felt-ink:#e6f3ea; --rail:#a8714a; --p1:#5aa6c4; --p2:#e07a5c; --gold:#e0b440;
  --ok:#5cb47f; --warn:#e0a83a; --bad:#e2695a; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.65 var(--body);margin:0}
.wrap{max-width:1240px;margin:0 auto;padding-inline:16px;padding-block:0 48px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0}
.mast{background:var(--felt);color:var(--felt-ink);border-bottom:6px solid var(--rail)}
.mast .wrap{padding-block:22px 18px;display:grid;gap:12px}
.mast h1{font-size:clamp(24px,4vw,34px);font-weight:900;letter-spacing:.02em}
.mast .sub{opacity:.85;font-size:14px}
.score{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;background:rgba(0,0,0,.18);border-radius:6px;padding:8px 14px;max-width:560px}
.score .n{font:600 26px/1 var(--mono);font-variant-numeric:tabular-nums}
.score .nm{font-weight:600}
.score .l{display:flex;justify-content:space-between;gap:10px}.score .r{display:flex;justify-content:space-between;gap:10px;flex-direction:row-reverse}
.score .mid{font:12px var(--mono);opacity:.8;text-align:center}
.tabs{display:flex;gap:6px;margin-block:18px 10px;flex-wrap:wrap}
.tabs button,.chipbtn{font:inherit;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:6px 14px;border-radius:999px;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.strip{display:grid;grid-template-columns:repeat(auto-fill,minmax(46px,1fr));gap:6px;margin-block:8px 16px}
.rk{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:4px 0 5px;text-align:center;cursor:pointer;font:600 13px var(--mono);color:var(--ink);position:relative}
.rk small{display:block;font:11px var(--body);color:var(--muted)}
.rk.w1{box-shadow:inset 0 -4px 0 var(--p1)}.rk.w2{box-shadow:inset 0 -4px 0 var(--p2)}
.rk.on{outline:2px solid var(--ink)}
.rk.cl::after{content:"";position:absolute;top:4px;right:5px;width:7px;height:7px;border-radius:50%;background:var(--gold)}
.rk.none{opacity:.45;cursor:default}
.filters{display:flex;flex-wrap:wrap;gap:12px;align-items:center;font-size:14px;color:var(--muted);margin-block:4px 12px}
.filters select{font:inherit;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:3px 6px}
.cols{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:20px;align-items:start}

.head{display:grid;gap:8px;margin-bottom:14px}

.meta{display:flex;flex-wrap:wrap;gap:8px;font-size:13px}
.pill{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:1px 10px;font-size:12.5px;border:1px solid var(--line);background:var(--sunk);white-space:nowrap;max-width:100%}
.meta .pill{white-space:normal;border-radius:10px}

.pill.c-高{color:var(--ok);border-color:var(--ok)}.pill.c-中{color:var(--warn);border-color:var(--warn)}.pill.c-低,.pill.c-分歧{color:var(--bad);border-color:var(--bad)}

.learn{margin:0;padding-left:20px}

.side{position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px);display:grid;gap:10px}

.tablebox{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px}
.tablebox svg{width:100%;height:auto;display:block;max-width:100%}
.stepinfo{font-size:14px;display:grid;gap:4px}
.stepinfo .t{font:12.5px var(--mono);color:var(--muted)}
input[type=range]{width:100%;accent-color:var(--felt)}
.legend{display:flex;flex-wrap:wrap;gap:6px;font-size:12px;color:var(--muted)}
.ball{display:inline-block;width:14px;height:14px;border-radius:50%;vertical-align:-2px;border:1px solid rgba(0,0,0,.35)}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:13.5px}

th{background:var(--sunk);font-weight:600}
.md{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px 18px;max-width:80ch;min-width:0;overflow-wrap:anywhere}

.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:16px;align-items:start}
.sect{display:grid;gap:10px;margin-bottom:22px}.sect h2{font-size:20px}
.doclist{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}.chipbtn[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.empty{color:var(--muted);font-size:14px;padding:12px;border:1px dashed var(--line);border-radius:8px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

5", "袋": "", "类型": "进攻", "意图": "打进5号，白球回来一点点，给6号留个小角度，好推两库去8号。", "杆法": "蹬杆——用击打的力把白球带回来，白球回来很慢（薛珍麒看出是蹬杆）；秦利文：直接往回拉；党金虎：直接定这儿；佟璐：定着/中高杆推都行。", "力量": "小力", "评价": "好球", "共识": "高", "各主播": {"秦利文": "直接往回拉吧，往这拉。", "薛珍麒": "一点点，用击打的力蹬回来，不要纯拉，纯拉容易手软；母球回来很慢就是蹬杆；留个小角度推两库。", "柯秉逸": "（在介绍皮头型号。）", "杨帆": "", "党金虎": "这儿拉，直接定这儿得了。", "佟璐": "大金来了，这球定着就行不用多走，定着中高杆推也行。"}, "分歧": "拉回来（秦）vs 定住（党、佟）——都是小动，差别不大。", "K球": "", "心态手感": "", "关键词": ["蹬杆", "击打的力", "别纯拉", "小角度"]}, {"序": 5, "谁打": "郑肖淮", "打几号": "6", "袋": "", "类型": "进攻", "意图": "打进6号，选手想低杆拉一库弹起来给8号留角度（佟璐、薛珍麒判断）；主播多觉得定杆/中高杆推一库就够。", "杆法": "想打低杆拉一库，结果滑杆（吃杆）了——薛珍麒、柯秉逸、党金虎、佟璐都看出来。", "力量": "", "评价": "失误但运气好：6号还是进了，白球停的不是想要的位置，差点丢大金（柯秉逸：差点没大金；党金虎：very lucky；薛珍麒：不满意但问题不大）", "共识": "高", "各主播": {"秦利文": "我说往回拉，你非得往那儿定（结果和他想的不一样）。", "薛珍麒": "留小角度推两库、横过去、拉回来都行，看他留哪里；结果跟他想的不一样，不满意但问题不大；是滑杆了吧，他想拉低杆。", "柯秉逸": "哇，竟然滑杆还进了，还好有进，差点没大金；滑杆没大金会哭。", "杨帆": "", "党金虎": "拉回来合理，我的话往这边拉一下；哦这是低杆钉（吃杆了），皮头干了；已经very lucky；关键时刻真不能这么吃杆。", "佟璐": "定着就行不用多走；中高杆推一库、中低杆、中高杆左塞抓两库都行；他想低杆拉一库留这个角，结果白球停这框里了。"}, "分歧": "主播普遍觉得定住/推一库就够，选手非要拉一库留角度，结果滑杆。", "K球": "", "心态手感": "党金虎：'这是紧吗？紧'（怀疑关键时刻手紧了）", "关键词": ["滑杆", "吃杆", "低杆拉一库", "运气"]}, {"序": 6, "谁打": "郑肖淮", "打几号": "8", "袋": "", "类型": "进攻", "意图": "滑杆后白球位置只能抓两库：推杆带左塞，一库到长库再两库回来，把白球送到9号附近（秦利文、薛珍麒、佟璐三人同一思路）。", "杆法": "推杆左塞两库", "力量": "", "评价": "好球（秦利文：整整好出圈，真高手；佟璐：嘎嘎上线）", "共识": "高", "各主播": {"秦利文": "定这儿的话就来个两库：一推一库到这儿，再点左塞两库到这儿；整整好出圈，控制得整整好好，真高手。", "薛珍麒": "这球得推，推到这儿来，给点左塞；（回头评上一杆）我感觉是吃杆了。", "柯秉逸": "还好有进，算有点运气；滑杆没犯规。", "杨帆": "（在讨论滑杆算不算犯规，说不算。）", "党金虎": "皮头吃杆没劲啊。", "佟璐": "这白球只能抓两库了，带左塞奔下边来，嘎嘎上线，大金一枚；得亏黑八是直的，不然大金丢了得气死。"}, "分歧": "", "K球": "", "心态手感": "", "关键词": ["推杆", "左塞", "两库", "补救"]}, {"序": 7, "谁打": "郑肖淮", "打几号": "9", "袋": "", "类型": "进攻", "意图": "收9号拿大金。", "杆法": "", "力量": "", "评价": "好球", "共识": "高", "各主播": {"秦利文": "搞笑（指滑杆有惊无险）；没犯规，没越过障碍球就不算。", "薛珍麒": "这大金真大啊。", "柯秉逸": "捡回一个大金，有运气；其实等于捡了15分：滑杆要是白球飞出去，犯规1分再送对手4分，再加丢的10分。", "杨帆": "", "党金虎": "恭喜大金，break and run；从坐姿上看也知道谁比较嚣张。", "佟璐": "大金一枚。"}, "分歧": "", "K球": "", "心态手感": "", "关键词": ["大金", "break and run , "杆法": "中杆", "力量": "中小力", "区": [0.48, 0.138], "半径": 0.089, "路径": [], "实停": null, "对比": {"袋对": null, "类型对": true, "白球落区": null, "距离差cm": null, "实际类型": "进攻", "实际袋": "", "实际停点": null, "下一杆把握": {"预判停点": 0.0, "实际停点": null}}, "偏差": "一样", "理由": "袋和类型对上，白球停点没有记录（这杆后比分牌合并了两杆/本局结束）"}}], "卡片": {"局": 11, "谁开球": "郑肖淮", "开球": "郑肖淮开球（赢家开球）。开球有球进（佟璐：'开球有球下，没有失机'；柯秉逸：'开球太牛了，下次要跟他学开球'）。第一杆时台上没有1号和6号，两颗是不是都开球进的待确认。开完郑肖淮接着打，但2号没有直接进球线。", "本局怎么赢": "赵汝亮 普胜 +4（44:21 → 44:25）。接手一杆清台，比分牌只加4分，佟璐也说'这不是金，是普胜'。", "本局概要": "郑肖淮开球好但2号没线路，他没防守，拼了翻底袋，翻薄一点点没进，运气是2号贴库、没漏明球。赵汝亮想了很久（这杆近3分钟），没按薛、佟、秦、党预判的去防守，用低杆把贴库2号强攻进了，白球拉过9号拿到3号，然后小力走位一路顺，5号低杆右塞发力甩四库回到7号，一杆清到9号，普胜+4。", "经典": true, "经典理由": "翻袋失手后的难局面：2号贴库、进球点难，四位主播都倾向防守，赵汝亮判断能进就强攻并打进，之后既有小力定位又有大力四库走位，'什么时候该赌进攻、怎么攻'全在这一局里。", "杆": [{"序": 1, "谁打": "郑肖淮", "打几号": "2", "袋": "底袋（柯、党、薛说翻底袋；秦利文建议翻中）", "类型": "翻袋", "意图": "开完2号没直接线路，他选择拼翻袋（底袋）而不是防守；柯秉逸：手感正热、防也不好防，干脆拼。", "杆法": "轻轻翻（薛珍麒）；党金虎说要下反塞；佟璐认为一库不够翻、得两库翻——一库还是两库待确认。", "力量": "小力（薛珍麒：轻轻翻）", "评价": "可惜/运气：翻薄了一点点没进，但2号贴库了，赵汝亮也没好球（柯、薛、佟都说运气不错、没漏）", "共识": "分歧", "各主播": {"秦利文": "翻底袋没法耍，翻中还说得过去；能解净就往净解，不好解就打这往这跑（偏防守）。", "薛珍麒": "可以拼一下：翻中袋白球低杆往这走，翻底袋白球高杆往这走；轻轻翻，翻薄了一点点，运气还可以不漏。", "柯秉逸": "干脆直接拼翻袋，现在手感正热，防也不好防；差一点点可惜，不然又大金；没翻进但二号贴库，对方也打不了，运气蛮不错。", "杨帆": "要我打就打第一个一库，没必要拼（翻袋），打点正常的（转写不清，大意是不赌）。", "党金虎": "翻中袋肯定没了，翻底袋能进；要下反塞；翻到这了，没有了。", "佟璐": "翻中没有，三种选择：翻底、直接往底袋干、白球回黑八后边防守，钓鱼（防守）我肯定不钓；他选两库翻了吧？一库不够翻；小亮这球也不好勾，要勾必须两库。"}, "分歧": "拼翻底袋（柯、薛、佟、党）vs 防守/翻中（秦、杨）；一库翻还是两库翻（佟璐 vs 其他）。", "K球": "", "心态手感": "柯秉逸：现在手感正热，所以拼。", "关键词": ["翻袋", "底袋", "拼", "贴库", "没漏"]}, {"序": 2, "谁打": "赵汝亮", "打几号": "2", "袋": "", "类型": "进攻", "意图": "2号贴库很难进，多数主播预判他要防守（薄打2号、白球两库去7号后面，或爆勾），他想了近3分钟选择强攻：低杆打进2号，白球拉回来越过9号去打3号。", "杆法": "低杆/中低杆拉回来（柯秉逸：低杆、拉过9号；薛珍麒：低杆横台；佟璐：要小低点的杆法、低杆尖厉；秦利文担心中低杆这条路线拔不好容易摔袋）", "力量": "中力（佟璐：杆法还小劲，待确认）", "评价": "好球（柯秉逸：太犀利了；秦利文：二号有下这球基本上就包进了）", "共识": "分歧", "各主播": {"秦利文": "这儿弹呗，两库过来弹到7号后面更牛逼（防守）；二号有下这球基本包进；中低杆这样拔不好容易摔袋；气氛有点紧张，打快打慢都正常。", "薛珍麒": "只能让二号到这里、白球下去沾上（防守）；这球应该不打，爆勾；低杆横台也可以；打薄了一点点。", "柯秉逸": "看能不能打二号，打到脚（薄）二号往这弹白球下来；二号能一下就会进攻，不然保守防守；低杆啦，应该拉过9号，可以拉过9号，太犀利了。", "杨帆": "防守方有失误你一定要抓住；这也不能上库；拿塞找；这时候是分关键，千万别走中袋。", "党金虎": "这球就薄薄了，吃了脚应该能跑（防守思路）。", "佟璐": "打二号薄皮、白球两库过来找七停七号后边就这么回事，进球点太难；结果直接干了二号；这球什么杆法比较难，要小低点的杆法，低杆尖厉。"}, "分歧": "防守（薛、佟、秦、党）vs 进攻（柯倾向、选手实际）；秦利文对低杆路线有顾虑（怕摔袋）。", "K球": "", "心态手感": "秦利文：'突然气氛感觉有点紧张'（想了很久）；杨帆：'这时候是分关键'。", "关键词": ["贴库", "强攻", "低杆", "拉过9号", "攻防选择"]}, {"序": 3, "谁打": "赵汝亮", "打几号": "3", "袋": "中袋（秦利文说他'非要叫中袋'，也可能指4号，待确认）", "类型": "进攻", "意图": "打进3号，白球留4号。", "杆法": "低杆戳一下（薛珍麒：低戳，看力量）", "力量": "", "评价": "好球（薛珍麒：挺好）", "共识": "分歧", "各主播": {"秦利文": "不能叫底袋吗？非要叫中袋，中袋那么细，叫底袋就完了；咱自己心里有数。", "薛珍麒": "低戳，看力量，挺好；要不直接到这边来也行。", "柯秉逸": "（在聊吃的。）", "杨帆": "千万不要走中袋，走底袋把力打顺，走直拉过来；走中袋容易打厚。", "党金虎": "（卖衣服。）", "佟璐": "回评上一杆：白球走到这一下变慢了，再碰三，轻轻弹起来到这；应该是低杆尖厉。"}, "分歧": "袋口：秦利文、杨帆都说该叫底袋别叫中袋（中袋细、容易打厚），选手选了中袋（待确认）。", "K球": "", "心态手感": "", "关键词": ["中袋", "底袋", "低杆戳", "袋口选择"]}, {"序": 4, "谁打": "赵汝亮", "打几号": "4", "袋": "", "类型": "进攻", "意图": "有点直，往回拉一点点留5号，劲不用大。", "杆法": "小拉/点一下（薛珍麒：中低横台或中高往前蹬两选，有点直就拉回去一点点；党金虎：一拉回一点点）", "力量": "小力（党金虎：劲儿不用太大）", "评价": "一般偏好（佟璐：力量稍微大了一点，得掰这边来）", "共识": "高", "各主播": {"秦利文": "别往中袋叫了，叫底袋；拉到这就行，别拉太多了不好够，轻轻点一点点。", "薛珍麒": "两个选择：中低横台 / 中高往前蹬；这有点直，往这边拉回去一点点，点一下就行。", "柯秉逸": "", "杨帆": "吞一点点（转写不清）。", "党金虎": "一拉回一点点就好了，劲儿不用太大。", "佟璐": "这球不叫中袋吗？叫这走太远啊；力量稍微大了一点，得掰这边来。"}, "分歧": "", "K球": "", "心态手感": "", "关键词": ["近直", "小拉", "中低横台", "小力"]}, {"序": 5, "谁打": "赵汝亮", "打几号": "5", "袋": "", "类型": "进攻", "意图": "打进5号后白球发力走三四库，绕回来打7号（6号已不在台上）。", "杆法": "低杆/中低杆右塞甩四库（秦利文：中低杆右塞啪到这、甩了四库；薛珍麒：吃第一条线三库、高一点四库，他走了四库）", "力量": "大力（党金虎：这个球完全可以发力，其他交给球台）", "评价": "好球（秦利文：清台了；薛珍麒：拼了一点点）", "共识": "高", "各主播": {"秦利文": "轻轻点一点然后打起跑三四库；中低杆右塞啪到这；低杆右塞甩了四库。", "薛珍麒": "点一下然后走四库/三库：吃这儿三库、高一点四库，他就四库了，拼了一点点。", "柯秉逸": "用毕生功力画线（打趣）。", "杨帆": "得吃到三库，对、是四库，千万别吃（别处），停这儿。", "党金虎": "角度刚好跑，进球线、白球中心点定好，这时候发力就好了，其他交给球台；完全可以发力。", "佟璐": ""}, "分歧": "", "K球": "", "心态手感": "", "关键词": ["低杆右塞", "四库", "发力", "大走位"]}, {"序": 6, "谁打": "赵汝亮", "打几号": "7", "袋": "", "类型": "进攻", "意图": "打进7号，小低杆点住或推进留8号。", "杆法": "小低杆点住 / 推进（薛珍麒）", "力量": "小力", "评价": "好球", "共识": "中（话少）", "各主播": {"秦利文": "", "薛珍麒": "小低杆能点住，我 不插白球整在这'，疑似洗袋），两处只能有一处+1，待确认。", "本局概要": "郑肖淮开球进1、2但3号打不到，做了一杆薄防守，没防死（薛珍麒：还是滑出来了；秦利文本来主张直接往里干拼大金；佟璐提了个大胆方案：发力把3号打到5号那半边、白球到另一边防守还能走4，'他们不敢想'）。赵汝亮把3号翻进去（柯秉逸：翻得太准了）却白球贴死在别的球上（运气差一点点），被迫解4号；柯秉逸、佟璐看着像三库解到位、解得挺好，薛珍麒说解薄漏了，结果4号确实漏给了郑肖淮。郑肖淮中低杆点左塞进4后在5号那杆换了人（没进还是犯规主播没说清，待确认）。赵汝亮推一库进5、低杆拉一库进6留中袋、7、8、9一杆清完，但因为中间换过人只算普胜4分。杨帆看完说赵现在急需打两根大金把比分咬回来。", "经典": false, "经典理由": "", "杆": [{"序": 1, "谁打": "郑肖淮", "打几号": "3", "袋": "", "类型": "防守", "意图": "3号被挡住进不了，只能打到半颗；薄薄地碰3号让它走到这边、白球留在原地做防守。柯秉逸看着是要碰到7号才刚好防住，差了一点。", "杆法": "轻轻推一下给点右塞搓一下（薛珍麒）；下点左塞薄一点（党金虎）；秦利文主张一个左塞直接往里干；佟璐主张发力打3号到5号那边", "力量": "小力（薛珍麒：轻轻防一个）；佟璐的方案是发点力", "评价": "一般：没防死，薛珍麒'还是滑出来了'，柯秉逸'差了一点'，给了赵汝亮翻袋的机会", "共识": "分歧", "各主播": {"秦利文": "这球能打着，一个左塞直接塞里头能不能行；以我多年经验这球还真要往里干，拼大金", "薛珍麒": "没下，就得防一个；能打到半颗吗；轻轻推一下给点右塞搓一下，让3号往这儿走；结果还是滑出来了", "柯秉逸": "该不会直接翻袋吧，防一颗吧，这应该是要防一颗了；敲到7号就刚好防到了，差了一点", "杨帆": "不够啊，不够这么一打不就防了吗", "党金虎": "肯定没有（打不进），薄薄的让3号往这儿走就非常好；下点左塞稍微打薄一点就防住了", "佟璐": "不下，防守了；他敢不敢发点力：3号打到5号那半边，白球到这边也能防、还能走4；他们不敢想"}, "分歧": "秦利文要进攻拼大金；薛珍麒、党金虎、柯秉逸、杨帆都说打不进只能薄防（右塞/左塞说法不一）；佟璐单独提了发力把3号打远、白球另一边防守的大胆方案。", "K球": "", "心态手感": "", "关键词": ["薄防", "打半颗", "左塞/右塞", "没防死", "拼大金", "敢不敢使劲"]}, {"序": 2, "谁打": "赵汝亮", "打几号": "3", "袋": "", "类型": "翻袋", "意图": "3号底袋没下、中袋不好打，柯秉逸都觉得只能再防一杆；赵选了翻袋，高杆推，别踢到9号。", "杆法": "翻袋 + 高杆推（薛珍麒：高杆推哦；杨帆：高杆，白球下来）", "力量": "", "评价": "进了（柯秉逸：翻得太准了）但运气差：白球'交通事故'刚好贴死在别的球上（秦利文：没搞好；薛珍麒：运气差一点点；柯秉逸：运气好也运气不好；佟璐：挪上了，真背）", "共识": "高（都认为翻得准、白球停位出事故）", "各主播": {"秦利文": "这球有下的，只是有些许难度；底袋没下中袋不好打，能不能往这翻；翻进来了但白球属于交通事故，没搞好", "薛珍麒": "不好防又不好弄，白球能不能出到这来；高杆推，别踢到9号；完了，刚好沾上去，运气差一点点", "柯秉逸": "角度也不太好，不知道能不能往这打，白球下来可能只能跑到这，看有没有机会防得到；哇这个球翻得太准了；好像看不到了，有点倒霉，运气好也可以说运气不好", "杨帆": "这么防也是这样；高杆，白球下来", "党金虎": "这球直接往这打就行；进了进了；看不见了", "佟璐": "这球咋整我真不知道，把白的往这一沉得了，别洗袋；进了，诶，挪上了，真背呀"}, "分歧": "柯秉逸本来觉得只能再防一杆，赵选择翻袋进攻。", "K球": "", "心态手感": "", "关键词": ["翻袋", "高杆推", "翻得准", "白球贴死", "运气差"]}, {"序": 3, "谁打": "赵汝亮", "打几号": "4", "袋": "", "类型": "解球", "意图": "白球贴死只能解4号；薛珍麒：稍微扎一点点加右塞，母球别乱跑，最好停到7号后面；佟璐：这球好解、标准线路，往回挪一颗球位置中高杆推、力量别大甚至能进。", "杆法": "扎一点点、右塞（薛珍麒）；中高杆推、小力（佟璐）；柯秉逸：一库就好，看着像解了三库还来了个小弧线", "力量": "小力（母球不要乱跑；佟 ue": [1.079, 0.502], "9": [0.62, 0.326]}}, {"谁打": "赵汝亮", "结果": "第19局结束", "比分后": "61:43", "开始": "20:25:36", "秒": 89, "台上剩前": [], "台上剩后": [2, 3, 4, 5, 6, 7, 8, 9], "序": 129, "掌声": null}], "卡片": {"局": 19, "谁开球": "郑肖淮（第18局赢家；开完是他在跳球）", "开球": "开球进了1号和8号（比分牌：这局开始台上剩2、3、4、5、6、7、9），但白球看不见2号要跳球（秦利文：小淮这个冲球的运气也不好，准备要跳了；薛珍麒：两个人冲球运气都没有很好；佟璐：一号进了没有失机，二号球回不来了，拿起你的小跳棍）", "本局怎么赢": "赵汝亮 普胜 +4（61:39 → 61:43）；之前郑肖淮解球犯规 赵汝亮+1（61:38 → 61:39）", "本局概要": "最拉锯的一局，换人5次。郑肖淮开球进1、8但被遮，跳球差一点跳进（柯秉逸）；赵汝亮薄切进2后局面没法清台，两人各防一杆（郑放弃可以进攻的3号选防守——柯秉逸、佟璐、秦利文都支持防、薛珍麒想进攻，但没贴死），赵解球解薄了半颗，郑直接3传9传厚了又把赵防住，赵薄打一杆，郑再解一杆，最后赵把3号跳进（这段比分牌收起，按六路解说顺序推断）。4号打不了，赵把白球藏到9号后面、顺带把6号打开，防得很硬；郑两三库带左塞解球打偏没碰到（薛珍麒说塞给多了，佟璐说塞没用、是杆头高了半颗皮头，柯秉逸说解错颗了），犯规送自由球并+1；赵自由球4→9一杆收，普胜+4。中间赵的球杆后把拧不下来耽误两分多钟，柯秉逸说按理计时不该停、裁判和对手都很大气。规则线索：犯规对手+1（38→39）再次验证；自由球后清5颗=普胜4；党金虎两次说“第二十局中途休息”、佟璐说“还有一局中场暂停，小亮开球”，说明全场40局、打完20局中场，且赢家开球；柯秉逸提到前10局郑肖淮有三个大金一个黄金九（开球进9）、赵汝亮一个大金一个小金。六路都有声音。", "经典": true, "经典理由": "多种难点交织：开球被遮只能跳球、连续防守和解球来回（5次换人）、被逼急了跳球进3号、把白球藏在9号后面的硬防守逼出对手犯规、再用自由球清台。是“打不了就防、防要防死、防死了等对手犯规再清”的完整样板。", "杆": [{"序": 1, "谁打": "郑肖淮", "打几号": "开球", "袋": "", "类型": "开球", "意图": "开球冲散，进1号、8号", "杆法": "", "力量": "", "评价": "运气不好：进两颗但白球被挡看不到2号", "共识": "高", "各主播": {"秦利文": "小淮这个冲球的运气也不好，准备要跳了", "薛珍麒": "两个人冲球运气都没有很好", "柯秉逸": "", "杨帆": "", "党金虎": "", "佟璐": "一号球进了没有失机，二号球能不能回来？回不来了，拿起你的小跳棍"}, "分歧": "", "K球": "", "心态手感": "", "关键词": ["开球", "被遮"]}, {"序": 2, "谁打": "郑肖淮", "打几号": "2", "袋": "", "类型": "跳球", "意图": "跳过挡球打2号，能跳进最好（党金虎：你要跳进；柯秉逸：最完美是跳完白球塞过来这里、2号进）", "杆法": "跳杆", "力量": "", "评价": "没进但差一点跳进（柯秉逸：快想要跳进啊），没犯规；赵汝亮打2号也只够到一点点、可能要扎杆（薛珍麒：效果真的很好）", "共识": "高", "各主播": {"秦利文": "准备要跳了；这球打二，白球回来到这", "薛珍麒": "跳一个，哎呀效果很好；这球可能要扎了，打得到一点点就可以扎一点点", "柯秉逸": "萧淮要跳球，最完美就是跳完白球塞过来这里、二号下来；喔喔喔差点跳进啊；接下来可以再来个防守", "杨帆": "是想跳到后面、低杆跳还是想跳进？能打着能打着", "党金虎": "这球直接跳了，你要跳进", "佟璐": "拿起你的小跳棍，反正你也跳不着；哎呀呀呀呀（差点）"}, "分歧": "", "K球": "", "心态手感": "", "关键词": ["跳球", "遮球", "差点跳进"]}, {"序": 3, "谁打": "赵汝亮", "打几号": "2", "袋": "", "类型": "进攻", "意图": "薄切把2号进，考验出杆质量，白球一库两库跑到另一边，看能不能接着打3传9（秦利文、杨帆、柯秉逸都提到3传9；佟璐：打二这么一推不用K，推回来拿三找九）", "杆法": "薄切（秦利文：一薄  "球": {"9": [0.428, 1.293], "7": [0.893, 0.122], "cue": [0.437, 0.098]}}, {"谁打": "赵汝亮", "结果": "进9", "比分后": "66:63", "开始": "21:13:44", "秒": 7, "台上剩前": [9], "台上剩后": [], "序": 176, "掌声": {"时刻": "21:13:51", "持续秒": 4.9, "几路听到": 4, "强度": "热烈"}, "球": {"9": [0.429, 1.295], "cue": [1.078, 1.197]}}, {"谁打": "赵汝亮", "结果": "第24局结束", "比分后": "66:67", "开始": "21:13:51", "秒": 102, "台上剩前": [], "台上剩后": [2, 3, 4, 5, 6, 7, 8, 9], "序": 177, "掌声": null}], "卡片": {"局": 24, "谁开球": "赵汝亮（薛珍麒：看冲球，这会小亮冲球好起来了；按上局赢家开球推断）", "开球": "开球进了1、8号（比分牌推断：第1杆前台上只剩2~7和9），1号进哪个袋主播没说；球型极好，薛珍麒/柯秉逸齐喊大金来了，佟璐：so easy、怎么想失误都失误不了、没有一个难的连接球；柯秉逸事后：這個開球開得這麼好；开完赵汝亮打", "本局怎么赢": "赵汝亮 普胜 +4（63→67，反超为66:67）。中间两次犯规：赵汝亮解4号没碰到→郑肖淮+1（65→66）；郑肖淮自由球打4号白球洗袋→赵汝亮+1（62→63）。赵汝亮自己开球但中途换了人，所以清完只算普胜不是大金", "本局概要": "赵汝亮开球进1、8，整台只有一颗问题球3号。打2号顺路K3时力量下大了（六位主播都喊太大力），3号跑到打不进的位置只能防一杆；郑肖淮把3号翻中袋翻进（翻袋兼防守），4号能进但选择防守（秦利文：防一杆得分率高、容易多得一分）；赵汝亮解球没碰到犯规，郑肖淮拿自由球打4号边库球想偷点袋角反而白球洗袋犯规；赵汝亮自由球进4、5和6两颗一起进、7、9，普胜反超66:67。主播齐说两人手紧，秦利文怪晚上天气潮、胶边变硬。", "经典": false, "经典理由": "不算经典：大好局面被一杆K球的力量打乱，之后两边连着失误（解球犯规、自由球洗袋），赢得靠对手送分加运气。但教学价值高：顺路K球的力量控制、翻袋兼防守、能进也选防（规则上犯规给1分）、比分咬紧时压力下的失误样本", "杆": [{"序": 1, "谁打": "赵汝亮", "打几号": "1", "袋": "", "类型": "开球", "意图": "冲球", "杆法": "", "力量": "", "评价": "好球：进1、8，球型全是简单连接球，大金机会", "共识": "高", "各主播": {"秦利文": "", "薛珍麒": "看冲球，这会小亮冲球好起来了，就看有没有面；来面了，这个大金来了", "柯秉逸": "欸大金來了啦，又來了，這個真的來了；（事后）這個開球開得這麼好", "杨帆": "", "党金虎": "差三分，65比62，现在第24局，总共打40局", "佟璐": "哎呦这so easy啊，怎么想失误都失误不了，没有一个难的连接球；二号小低杆叫三、三号小低杆叫四、四号小低杆叫五、一推过来留个角、一蹬过来叫七、七号低杆一库或中杆一蹬叫九"}, "分歧": "", "K球": "", "心态手感": "", "关键词": ["开球", "进1、8", "球型好", "大金机会"]}, {"序": 2, "谁打": "赵汝亮", "打几号": "2", "袋": "", "类型": "K球", "意图": "打进2号，白球躲不开3号（闪不过），就顺路轻轻K一下3号把它K到能打中袋的位置、白球留原位（柯秉逸）；秦利文想法不同：得带点力把3号K厚一点、让它弹一库起来；佟璐：二号小低杆一堵，躲不开3就把3往这踢一下、白球停着；薛珍麒：底杆能闪过来最好，闪不过就中杆往前顶让3弹起来一点、白球就在这", "杆法": "小低杆（佟璐：二号小低杆一堵）；中杆顶/小底杆点一点/高蹬（薛珍麒）；薛珍麒事后判断他下的是中高杆、敲了半颗", "力量": "该小力控制（柯秉逸：力道控制一下；佟璐：白球停着），实际发了大力（柯秉逸：太大力了；秦利文：怎么能发那么大力；佟璐：低杆劲大了）", "评价": "失误：2号进了，但K3力量过大，3号跑到打不进的位置，大金机会没了", "共识": "高（都认为力量大了）；失误原因有分歧", "各主播": {"秦利文": "这球主要是三号怎么办，反而得带点力顶三让它弹一库起来，K的三号厚一点、必须得弹一库；线都画好了从这弹到这，怎么能发那么大力；越晚湿度越大胶边偏硬，他判断了所有但没判断天气", "薛珍麒": "这球就看二走三，别的都没问题；底杆闪不过就中杆顶让它弹起来一点、白球留这；白球敲半颗，敲的面不对，跟他自己想的完全不一样，他想往中袋敲没想敲底袋，下的是中高杆", "柯秉逸": "閃不過就只能K一下三號，三號把它K過來打中袋，力道控制一下，白球留在原位；太大力了，剛剛說要把力量控制好，怎麼會這麼粗力，真的可惜了", "杨帆": "这球使这么大劲干什么玩意儿", "党金虎": "小亮手一不高兴，脸像要流泪似的；不是紧张，是判断性失误、画形错误，他认为的想法和击打出来完全是两个概念", "佟璐": "二要是躲不开3就把3往这踢一下子白球停着；低杆劲大了兄弟，真没见过这台球，自己还念叨这么大劲呢；这球他手感也太差了，正常90%不会出现这种情况"}, "分歧": "K的方式：柯秉逸/佟璐要轻K、白球留原位；秦利文要K厚一点弹一库起来。失误原因：秦利文归到天气潮胶边变硬，党金虎说判断失误画形错误，薛珍麒说下成中高杆敲半颗、面不对，佟璐说手感太差", "K球": "顺路K（被迫，白球闪不过3号）；问题球3号；方式：小低杆轻碰3号想把它K到中袋附近、白球留原位；结果：力量过大，3号跑到打不进的位置，白球也没停住，整局大金泡汤", "心态手感": "党金虎：小亮手一不高兴，脸像要流泪似的；佟璐：手感也太差了", "关键词": ["顺路K", "问题球3号", "力量过大", "小低杆", "大金泡汤"]}, {"序": 3, "谁打": "赵汝亮", "打几号": "3", "袋": "", "类型": "防守", "意图": "3号刚好打不进（柯秉逸：剛剛好不能打，再大力一點還可以再拼一桿），只能防一杆（薛珍麒：这球只能防了）；把3号往右下角方向踢、白球藏住（柯秉逸）", "杆法": "柯秉逸：右下角踢下來剛好，用力摸一桿（防一杆）", "力量": "佟璐：劲也太小了", "评价": "一般：防守力量偏小，3号留了个翻中袋给对手（佟璐：翻中够不够，五号好像有点挡）；柯秉逸说运气不错白球又敲了一下（球），不然郑肖淮直接就能打", "共识": "中", "各主播": {"秦利文": "（在讲晚上天气潮、胶边变硬，没评这杆）", "薛珍麒": "还有机会，这球只能防了，防守吧，可惜啊，挺可惜的", "柯秉逸": "剛剛好不能打，再大力一點還可以再拼一桿；摸一桿，右下角踢下來剛好；運氣不錯又敲了一下，剛剛如果沒敲的話應該就直接能打了", "杨帆": "", "党金虎": "", "佟璐": "这球弄好了别太大力，弄好了这五号有下；劲也太小了，翻中够不够，翻中五号好像有点挡，这球低杆往这滑了"}, "分歧": "", "K球": "", "心态手感": "", "关键词": ["防守", "力量小", "留翻袋", "运气"]}, {"序": 4, "谁打": "郑肖淮", "打几号": "3", "袋": "中袋", "类型": "翻袋", "意图": "3号翻中袋，攻防两用：翻进继续进攻，翻不进3号和白球也让对手很难解（柯秉逸：沒進對手也痛苦；党金虎：虎哥画的线路是最合理的防守线路）", "杆法": "薛珍麒：给了很多右塞，子球本来是吃那儿的，慢慢慢慢坠下去了", "力量": "", "评价": "翻进了（比分牌证明）；柯秉逸：這個球打得真的很美，但他感觉没进反而更好一点，因为这防守防得很死很难解", "共识": "高（都看出攻防两用）", "各主播": {"秦利文": "", "薛珍麒": "防一杆啊，给把3号翻进去了，因为他给了很多右塞，子球慢慢慢慢坠下去了", "柯秉逸": "防禦桿三號往這裡翻；進了翻進了，這個球打得真的很美；沒進對手也痛苦，進了自己還可以繼續進攻，但我感覺還是沒進好一點，因為解球很難解", "杨帆": "进去好就说，进去不行（转写含糊）", "党金虎": "别看了兄弟进了，我也感觉要进；虎哥刚才那个线路是最合理的防守线路；继续防一个", "佟璐": "翻进了；这球也不进攻了吧，白球往这落"}, "分歧": "柯秉逸觉得没进反而更好（防得死）", "K球": "", "心态手感": "", "关键词": ["翻袋", "中袋", "右塞", "攻防两用"]}, {"序": 5, "谁打": "郑肖淮", "打几号": "4", "袋": "", "类型": "防守", "意图": "4号能进但白球位置不好，选择防守：秦利文说这球他、郑、赵都包进，但防一杆得分率更高、容易多得一分（犯规+1）；薛珍麒：小低杆拉回来，或吃库弹起来沾一下让4号往那边跑", "杆法": "小低杆拉回来（薛珍麒）", 留在底库、对手不好打（柯秉逸：没翻到他也是可以防御，这球没翻好二号也会留在下面）", "杆法": "两库翻底袋，白球两库找3（佟璐：二号往这边翻，白的两库找三）", "力量": "", "评价": "没翻进，换人（比分牌），但2号留在底库、形成防守，主播认可（柯秉逸：这样也有点道理，蛮厉害这颗球；薛珍麒：想法非常好；佟璐：他真敢干）", "共识": "分歧", "各主播": {"秦利文": "这球敢不敢拼？直接上来翻个中袋还是防一杆，正在思考；两库翻底袋；白球不藏三号后边了吗", "薛珍麒": "这时候差三分我觉得不会去拼，刚才那么早都不拼；看能不能轻轻把它打到这边、母球粘在这里；不可能去翻袋吧；他想两库翻这个袋，想法非常好", "柯秉逸": "三号很配合，翻底袋；卡住了只能翻；这个不能藏3，角度不对；翻底袋，有点拼哦，但没翻到也可以防御，这样也有点道理，这球没翻好二号也会留在下面，厉害", "杨帆": "这不是激进吗？他这个是回报大于风险；你要是领先十分人家磕着你那时候难度高；他老爱这么等，就爱打这时候", "党金虎": "这是肖淮的招牌动作", "佟璐": "这球保也没有，要进只能拼翻；我觉得该下右塞、二号一弹起来一防一杆得了，这球不敢拼，一拼就没了，肯定是防；研究半天传五了吧？我的妈，他真敢干，二号往这边翻，白的两库找三"}, "分歧": "薛珍麒、佟璐都预判他会防守（粘住/推杆左塞藏三号后边），他选了翻袋；柯秉逸和杨帆认为翻不进也等于防守、回报大于风险；秦利文先猜翻中袋，实际两库翻底袋", "K球": "", "心态手感": "佟璐：胆真大；杨帆：他就爱打这时候；党金虎：招牌动作", "关键词": ["两库翻袋", "攻守兼备", "敢拼", "差3分"]}, {"序": 3, "谁打": "赵汝亮", "打几号": "2", "袋": "", "类型": "进攻", "意图": "2号在底库不太好整但有球可借，小低杆发力借球打进（佟璐：二号有借下，小低杆往这一抓；薛珍麒：这边借发力借）；主播另一派建议防一杆（秦利文、党金虎：高杆一库藏八后边）", "杆法": "小低杆借球（佟璐）；薛珍麒：这边借、发力借，低杆多一点", "力量": "发力（薛珍麒）", "评价": "进了2号（比分牌），但3号的角度不好叫（秦利文：推进这球走个这角就不好叫了），接不上只能防", "共识": "分歧（攻还是防）", "各主播": {"秦利文": "敢不敢传呀；我建议打二号往这儿防一杆，低杆敢不敢往这里尝？风险有点大；防好了是好球，防不好容易洗袋；推进这球走个这角就不好叫了", "薛珍麒": "这球可以这样起来，效果挺好，往下解一点低杆多一点；轻轻一翻贴一下再滑下来定这也行；这边借，发力借；这球要进攻了；他们到这阶段只会越打越保守", "柯秉逸": "应该接这边，2号接过去白球来这，6号接近不好打，要传球吗？2号接6号下好像可以；防一杆打这好像太好防", "杨帆": "二号被走远；要我打这时候加点塞；这时候太好解了；再给大点", "党金虎": "这球高杆一库藏八后边，二号翻下去；这是第二面运气；郑肖淮连进两次亚军，不能又打亚军了", "佟璐": "二号不太好整，但二号有借下，借下还是比较好打，小低杆往这一抓应该可以打；小淮今天解球失误太多了"}, "分歧": "秦利文、党金虎、佟璐先想防（藏八后边/小高杆左塞贴黑八），薛珍麒、佟璐看出可以借球进攻，柯秉逸想传6；赵汝亮选了借球进攻", "K球": "", "心态手感": "薛珍麒：这个阶段只会越打越保守、越打越谨慎", "关键词": ["借球", "小低杆", "发力", "攻防选择"]}, {"序": 4, "谁打": "赵汝亮", "打几号": "3", "袋": "", "类型": "防守", "意图": "3号叫不到，把白球贴死在6号后边做斯诺克（柯秉逸：他想刁一点，黏在六号后面完全黏死；佟璐：往六号后边放）", "杆法": "秦利文：这球高杆一库；杨帆：这时候加点塞", "力量": "柯秉逸：用力了，差了一点", "评价": "藏上了，很贴（佟璐：胆真大呀，还真摞上了），但柯秉逸说用力了差一点，躲另一边更简单更稳；佟璐、杨帆觉得往6号后边放有风险（容易被解开）", "共识": "中", "各主播": {"秦利文": "这球高杆一库", "薛珍麒": "这个球借这边要小心，太保守", "柯秉逸": "防一杆打这好像太好防，白球停在这；哇他想刁一点躲进去；刚才躲那个比较简单一定防得到，但他可能想黏在六号后面完全黏死多拿一分；一库的话刚好可以把四号踢开，但那是我们准度不够才想踢开，他们准度够；用力了差了一点", "杨帆": "那边没贴库吗；咱们把8号后面了嘛；你放6号后面容易被打开",  "类型": "跳球", "意图": "1号被挡看不见，直接跳球把1号打进（佟璐：1号奔底的爱跳，这球跳也没毛病）", "杆法": "跳球（秦利文：跳球出杆出得也太直了；佟璐：真跳啊）", "力量": "", "评价": "跳进了，全场惊呼（党金虎：那个真帅、太硬了；柯秉逸：太帅了）；但白球落点没叫上2号，小金机会没了（柯秉逸：可惜了，至少把这个金给灭了）", "共识": "高", "各主播": {"秦利文": "这怎么没跳啊？卧槽，这什么手艺啊，这球这样跳啊，跳进还能走位啊；跳球出杆出得也太直了", "薛珍麒": "跳也不好跳；这台球给他整进去了，真的，这球给他弄进去了", "柯秉逸": "我在那边说要打克拉克（待确认），他直接把它跳进，太帅了；但是不能打（2号），可惜了，至少把这个金给灭了", "杨帆": "", "党金虎": "他给跳进了，大师兄在外面说了一句：这个东西怎么都跳进了，你这太欺负人了；刚刚那个跳进真帅、太硬了", "佟璐": "真跳啊，跳完你容易后悔，但这球跳也没毛病；1号奔底的爱跳，但容易出现这种效果：跳个6的包边，6号又跑了；这球跳准呢，这硬啊"}, "分歧": "秦利文一开始觉得这球不该跳/没想到会跳；佟璐提醒跳完容易后悔（容易碰到6号把球型打乱）", "K球": "", "心态手感": "敢打，手硬（佟璐：这硬啊）", "关键词": ["跳球", "进1", "灭金", "2号没位置"]}, {"序": 3, "谁打": "赵汝亮", "打几号": "2", "袋": "", "类型": "解球", "意图": "2号看不见，吃一库或两库勾到2号薄边，白球回来躲住，别漏球（秦利文：两库解这球，白球会这样回来；柯秉逸：一库K这里白球回去，或两库把白球定住）", "杆法": "两库解（秦利文、柯秉逸）；解薄一点（薛珍麒：不要解那么厚）；强烈左塞刮2号边再绕三库回来（佟璐，理想画法）", "力量": "轻轻的（党金虎：白球自己啪一探，轻轻的）", "评价": "解太薄了，还好碰到库了没犯规（薛珍麒）；柯秉逸：没解准，但运气还行；留给郑肖淮一个能打的2号（佟璐：小白扫一下白球就跑了）", "共识": "中", "各主播": {"秦利文": "两库解这球，白球会这样回来、贴高边；这球挺硬", "薛珍麒": "把2号往这儿解，弹起来没关系，白球直接下去，解薄一点，不要解那么厚；解太薄了一点，还好吃库了", "柯秉逸": "可以这样一库K这里、白球回去，或者两库把白球定住；没解准，但你的运气还行，运气终于来了", "杨帆": "搁这边勾还是那边勾？我肯定搁这边勾，白球容易撞2号；这球不好防", "党金虎": "跳薄一会儿，自己往那边勾一下，白球自己啪一探，轻轻的", "佟璐": "强烈的左塞刮2号边，进去以后一库两库三库绕黑八后边回来，还能叫上3；他防守了，那小白扫一下白球就跑了，我画的都是理想状态"}, "分歧": "杨帆、柯秉逸在一库勾和两库解之间有不同选法；佟璐画的是强塞三库回来的理想线路，选手打的是薄解", "K球": "", "心态手感": "", "关键词": ["解球", "两库", "解薄", "没漏", "换人"]}, {"序": 4, "谁打": "郑肖淮", "打几号": "2", "袋": "", "类型": "进攻", "意图": "2号硬球，大力打进，白球一库两库跑去找3号（秦利文：白球一库两库看能不能往这边跑；佟璐：正打，白球这么跑，让3号到袋口）", "杆法": "大力正打（佟璐：这球它使那么大劲啊）；柯秉逸另一方案：加一点右塞K到这里、白球推回去、把2号留原位", "力量": "大力（佟璐：那么大劲）", "评价": "进了（秦利文：太吓人了，我还以为洗袋；可以可以），但3号没接上，下一杆换人（杨帆：低杆放不上吗，软低杆不会打呀）", "共识": "中", "各主播": {"秦利文": "小淮咋打？打2这球白球一库两库看能不能往这边跑；太吓人了，我还以为洗袋，可以可以", "薛珍麒": "这么硬吗？打得到啊，一下吧", "柯秉逸": "这颗球也可以打这里加一点右塞K到这里、白球往这里跑、2号留原位；他好像想把2号勾走、打整颗球、母球推回去；差一点点，这样已经很帅了", "杨帆": "这球不就下去了吗？好球；这一推不就死了吗；放不上吗？低杆放不上吗？软低杆不会打呀", "党金虎": "直接勾一杆解薄皮；这个球只能是走这一条线路；两人比分太接近了，状态全部持平", "佟璐": "这2号基本不动，然后3号到袋口，正打白的是这么跑的；但这个发力2号肯定会往前跑；下了，又给机会了；分离角是奔这来的，这球它使那么大劲啊"}, "分歧": "柯秉逸倾向先做防守（右塞K球把2号留原位），选手选大 号往这儿翻然后高杆吸库；小淮啊这球为什么一直进攻？防守不丢人，翻袋这球很难；就剩一二十分钟了打这么激进干什么？你现在需要的是机会，珍惜每一次上手", "薛珍麒": "没出低杆，紧张；他有可能要去翻，直接翻底袋，肖淮到这个点他敢打；漏了，选择挺冒险，上手两次没处理好，有点可惜", "柯秉逸": "没拉到啦这样就完了，要防一杆了，防也不好防，先打一个简单的防；兄弟那个翻底袋很准我看他翻好几次了；拼得有点大，他可能想白球就让它贴库了，看会不会变得不好打", "杨帆": "走紧了，这就是手帮忙硬；这就是你敢翻袋，我算你是什么高手，别闹了阿淮，这就是个不能翻的；哎呦我的妈，停这贴库，好的", "党金虎": "这球还正好，直接翻净完了白球往回拉；行吗老乡，连弓带手防一杆；漂亮，好像让我喊出来了", "佟璐": "这球是防守了，一库两库三库四库五库沉底，白球画点小弧线往上走，库翻中是扯淡，稳妥打法肯定是五库防守；咋玩翻底了？脑子乱；翻进给你点赞，但翻进概率四成到五成，戴勇翻也不敢说一进一，防守最合理，要算概率，站那儿想半天一定要算我是翻还是防"}, "分歧": "柯秉逸、党金虎能理解翻（翻底很准、翻完白球贴库也算半个防守）；秦利文、杨帆、佟璐、薛珍麒认为该防守、翻是冒险/脑子乱", "K球": "", "心态手感": "手紧、脑子乱、太激进（秦利文、薛珍麒、佟璐、杨帆）；时间只剩一二十分钟还打这么激进（秦利文）", "关键词": ["翻底袋", "冒险", "该防不防", "算概率", "白球贴库"]}, {"序": 13, "谁打": "赵汝亮", "打几号": "9", "袋": "", "类型": "进攻", "意图": "9号离袋很近但白球贴库，推进去就领先7分（柯秉逸：这颗打进你的胜率就高很多）", "杆法": "推杆（秦利文：球推的真准）", "力量": "", "评价": "进了，普胜 +4，91:98（秦利文：真牛逼；佟璐：准准；杨帆：这杆是必须拿血的）", "共识": "高", "各主播": {"秦利文": "谨慎谨慎再谨慎，冷静冷静再冷静，即使手不听使唤大脑也要告诉自己坚定；球推的真准真牛逼；领先七分，我这会看了都慌", "薛珍麒": "好球啊，现在每一盘球压力都很大；还剩五盘球/六局球，还有不到20分钟", "柯秉逸": "9号离洞很近没错，但白球贴库，压力非常大，这颗打进胜率就高很多；我觉得小亮顶得住压力；剩九分钟了啦（后又说13分钟还不一定）；两个人都已经有点疲惫了", "杨帆": "13分钟，开球磨掉1分钟；这杆进了只要普胜下杆就来这了；领先7分，这杆是必须拿血的", "党金虎": "太点没劲（转写含糊）；这比分谁输谁赢一点都不好说，太近了，就是一杆球两杆球的事情", "佟璐": "翻进只有四五成，防守最合理；好，准准；小亮压抑挺长时间了，这回要拿了冠军我感觉他还得哭"}, "分歧": "", "K球": "", "心态手感": "压力极大但顶住（柯秉逸）；两人都疲惫（柯秉逸）", "关键词": ["9号", "贴库", "推杆", "领先7分"]}], "本局学到的": ["没位置就老老实实藏：推杆一粘把白球留在球后面，重点是白球落点不是目标球（柯秉逸：重点就是母球；佟璐：一推一粘就行）", "9号翻袋角度好的时候不要K9：K不到就把自己的上手断了，翻袋包进（秦利文、薛珍麒、柯秉逸）；党金虎的「压力大必须踢」是少数派", "最后一杆翻还是防要算概率：翻底袋四五成、防守能等对手失误，时间不多更该珍惜每次上手（佟璐：要算概率；秦利文：防守不丢人）", "直球离库近只能低杆猛拉，有多大劲使多大劲，拉出弧线回来（郑肖淮3号那杆是本局好球）", "跳球打被藏的球时先想别碰9号、别把9号K出来给对手留简单球（柯秉逸、佟璐）", "能打的球别选防守：赵汝亮2号能打却防守反而漏了，杨帆：这防守还不如往里打完；佟璐：节奏有点快，该先擦擦巧粉定定神", "柯秉逸：现在每一局都要当成决胜局打；赵汝亮不好打的8号不硬打、先防（党金虎：不好打咱们就不打）"]}}, {"局": 35, "步": [{"谁打": "赵汝亮", "结果": "进6", "比分后": "91:98", "开始": "22:53:16", "秒": 86, "台上剩前": [3, 4, 5, 6, 7, 8, 9], "台上剩后": [3, 4, 5, 7, 8, 9], "序": 275, "掌声": null}, {"谁打": "赵汝亮", "结果": "换人", "比分后": "91:98", "开始": "22:54:42", "秒": 53, "台上剩前": [3, 4, 5, 7, 8, 9], "台上剩后": [3, 4, 5, 7, 8, 9], "序": 276, "掌声": null}, {"谁打": "郑肖淮", "结果": "进3", "比分后": "91:98", "开始": "22:55:35", "秒": 47, "台上剩前": [3, 4, 5, 7, 8, 9], "台上剩后": [4, 5, 7, 8, 9], "序": 277, "掌声": null}, {"谁打": "郑肖淮", "结果": "进4", "比分后": "91:98", "开始": "22:56:22", "秒": 39, "台上剩前": [4, 5, 7, 8, 9], "台上剩后": [5, 7, 8, 9], "序": 278, "掌声": null}, {"谁打": "郑肖淮", "结果": "进5", "比分后": "91:98", "开始": "22:57:01", "秒": 27, "台上剩前": [5, 7, 8, 9], "台上剩后": [7, 8, 9], "序": 279, "掌声": null}, {"谁打": "郑肖淮", "结果": "进7", "比分后": "91:98", "开始": "22:57:28", "秒": 31, "台上剩前": [7, 8, 9], "台上剩后": [8, 9], "序": 280, "掌声": null}, {"谁打": "郑肖淮", "结果": "进8", "比分后": "91:98", "开始": "22:57:59", "秒": 18, "台上剩前": [8, 9], "台上剩后": [9], "序": 281, "掌声": null}, {"谁打": "郑肖淮", "结果": "第35局结束", "比分后": "95:98", "开始": "22:58:17", "秒": 90, "台上剩前": [9], "台上剩后": [2, 3, 4, 5, 6, 7, 8, 9], "序": 282, "掌声": null}], "卡片": {"局": 35, "谁开球": "赵汝亮（上局赢家开球；比分牌证实开局台上少了1、2）", "开球": "开球进了1号和2号（佟璐：开球有球下，2号进去不失机；党金虎：这3号还真有），但3号没有直接进袋的位置，只有翻底袋角度（佟璐：3号还是没有位置，敢翻底吗；党金虎：翻袋下球的概率太大了，刚好在点位上）", "本局怎么赢": "郑肖淮 普胜 +4（91→95，95:98 落后 3 分）。赵汝亮开球进两颗后选防守，3号意外传6进了反而把自己卡住，解球给了机会，郑肖淮从3号打到9号清台", "本局概要": "赵汝亮领先7分、时间只剩十几分钟，3号没位置，他不翻袋选防守（领先有领先的打法），结果3号把6号传进了，必须继续打却看不到3号，两库解球解薄了，郑肖淮上手。郑肖淮中袋大力进3想顶8没顶到，4、5、7、8一路小心控力推两库走位，手紧但没出错，9号打进把分差追到3分。主播都说这局要是郑肖淮输了基本就结束了，赢了才有决胜局。", "经典": true, "经典理由": "领先方在时间压力下的防守选择被运气反噬（传6进袋等于自己把自己堵死），落后方必须赢的一局在手紧的情况下靠轻推两库和保守走位完成清台；主播对「领先该防还是该翻」和每一杆控力都有争论，是决胜阶段心态与攻防选择的典型案例。", "杆": [{"序": 1, "谁打": "赵汝亮", "打几号": "1", "袋": "", "类型": "开球", "意图": "冲球", "杆法": "", "力量": "", "评价": "进了1、2，但3号没有直接线路（柯秉逸：3号一样在那）", "共识": "高", "各主播": {"秦利文": "", "薛珍麒": "看2号3号，哎呀没面了", "柯秉逸": "这2号又是中，3号一样在那", "杨帆": "", "党金虎": "这3号还真有，3号来了兄弟们", "佟璐": "开球有球下，2号进去不失机，但是3号还是没有位置，敢翻底吗"}, "分歧": "", "K球": "", "心态手感": "", "关键词": ["开球", "进1、2", "3号没位置"]}, {"序": 2, "谁打": "赵汝亮", "打几号": "3", "袋": "", "类型": "防守", "意图": "3号只有翻底袋角度，领先7分、时间不多，不赌翻袋，把3号轻轻打走藏起来、白球一库带点右塞回来防守（薛珍麒：领先没必要翻，一定不要攻一定是防；柯秉逸：把3号打来这里，白球一库下一点右塞过来）", "杆法": "小力防守，白球一库右塞（柯秉逸、秦利文：打3传6白球一个右塞）", "力量": "小力（薛珍麒：轻轻的防、轻轻放）", "评价": "运气反噬：3号把6号传进了，不算失误但必须继续打，而3号又看不见（柯秉逸：这传进真的不好，6号不小心进了；薛珍麒：他不是想传进去，他想防守了）", "共识": "分歧", "各主播": {"秦利文": "打3传6，白球一个右塞；对就这么打，防守，我跟他鼓掌", "薛珍麒": "这球往里面翻吗？领先没必要翻，还有十几分钟慢慢打，领先有领先的打法，每一分都很关键，这球一定不要攻一定是防；轻轻放，传进去了，他不是想传进去，他想防守了", "柯秉逸": "你这个打个防守，把3号打来这里，白球一库下一点右塞过来；这传进，不进比较好，这竟然传进了，这个传进真的不好，6号不小心进了", "杨帆": "必须翻，不拿血量？一个大金不就带油了吗；打3号把3号放这白球放这？那为什么不直接给他翻；这球怎么溜进也挺背啊", "党金虎": "翻袋翻袋翻袋，这个翻袋下球的概率太大了，刚好在点位上，这球就值得这么一翻；你看老肖搁凳坐着多长时间了", "佟璐": "敢翻底吗？翻跟刚才小淮那个球一样是犯错误的，但我要是到了这个情况没准会翻；时间不够的话应该可以翻一下；防也对，防更消磨时间；看小白的表情应该是时间不太富裕"}, "分歧": "薛珍麒、柯秉逸、秦利文支持防守（领先慢慢打）；党金虎、杨帆主张翻底袋（概率大、能直接拿分）；佟璐觉得翻是犯错误但时间不够也可以翻", "K球": "", "心态手感": "领先方磨时间的心态（佟璐、薛珍麒）", "关键词": ["领先防守", "传6进袋", "运气反噬", "翻还是防"]}, {"序": 3, "谁打": "赵汝亮", "打几号": "3", "袋": "", "类型": "解球", "意图": "3号被挡，低杆两库解到3号、把3号解薄，白球尽量回到5号附近（柯秉逸：解两库，解到白球回来5号这里；薛珍麒：下点低杆解到这儿来）。秦利文反对跳球，主张从这挤", "杆法": "低杆两库解（薛珍麒、柯秉逸、党金虎：得拉长一点下低杆）；佟璐：低杆左塞容易打不着；柯秉逸一开始建议跳硬杆", "力量": "", "评价": "解薄了，碰到了没犯规，但3号留给郑肖淮能打（薛珍麒：解薄了，看运气；柯秉逸：怎么这么大意啊，不过这个效果挺好的；佟璐：还有机会啊）", "共识": "中", "各主播": {"秦利文": "这球跳啊？我的意思是这球不要跳，最好是从这挤；你现在领先7分不算多", "薛珍麒": "这球得下点低杆解，解到这儿来；解薄了，哎呦看白球看运气；这个角度看小淮能不能顶一下他", "柯秉逸": "跳一杆了，跳得尽量硬杆不容易飞出去；他解两库，两库方向的机率很高，看能不能解得非常精准回来5号这里；怎么这么大意啊？不过效果挺好的", "杨帆": "先拦一下，他先拦一下；他一上手时间都消耗了5分钟", "党金虎": "直接往这儿借，这球得拉长一点下低杆，这球这样行", "佟璐": "低杆左塞，这样容易打不着；还有机会啊，这3号应该洗不了袋"}, "分歧": "跳还是解（柯秉逸先说跳，秦利文说别跳），选手选两库解", "K球": "", "心态手感": "柯秉逸：怎么这么大意啊", "关键词": ["两库解", "低杆", "解薄", "给机会"]}, {"序": 4, "谁打": "郑肖淮", "打几号": "3", "袋": "中袋", "类型": "进攻", "意图": "3号中袋打进，白球发力过去顶一下8号（8号位置不好），把球型打开，必须进攻因为时间不多（秦利文：这杆3号打进白球顶一下8，这盘球赢了；薛珍麒：能顶的话就打了，因为时间不多了）", "杆法": "中袋大力（柯秉逸：打中袋这么用力会不会很大）；低杆（柯秉逸：顶8感觉要打一点低杆）", "力量": "大力", "评价": "进了，没顶到8，也没碰7，白球位置还可以（秦利文：没顶8呀；佟璐：点不错，还擦球呢说明时间还够）", "共识": "高", "各主播": {"秦利文": "小淮这杆3号打进、白球顶一下8，这盘球赢了，基本上这盘打完最多再打两盘；顶8，没顶8呀这球", "薛珍麒": "看能不能顶一下他，能顶就打了，因为时间不多了，每一杆都很关键；还有十二三分钟；看运气了，球还不一定谁赢", "柯秉逸": "中袋下了，然后看可不可以敲8，敲8感觉要打一点低杆；会不会敲7？还是刚好走两步；打中袋这么用力会不会很大", "杨帆": "", "党金虎": "这球只要打进的话就有机会", "佟璐": "这球也有可能撞7，撞上7也没事，这袋不透的，刮着7就刮了，刮不着就穿过去；哎呦我去，点不错，还擦球呢，说明时间还够"}, "分歧": "", "K球": "想顺路顶8把8号打开，没顶到（结果不影响）", "心态手感": "", "关键词": ["中袋", "大力", "顶8", "进3"]}, {"序": 5, "谁打": " "结果": "进6、7", "比分后": "96:98", "开始": "23:04:26", "秒": 83, "台上剩前": [6, 7, 8, 9], "台上剩后": [8, 9], "序": 289, "掌声": null}], "卡片": {"局": 36, "谁开球": "郑肖淮（上一局赢家开球：第35局郑肖淮 91→95；薛珍麒 22:59:31 “看冲球吧”，开完 1 号已不在、郑肖淮继续打）", "开球": "约 22:59:35 开球，1 号进了（比分牌 22:59:47 台上剩 2~9），但 2 号没有进攻线路（薛珍麒：这球不可能往里倒；佟璐：翻袋好像都不够，就得防；柯秉逸：传九太难），郑肖淮接着打", "本局怎么赢": "郑肖淮 普胜 +4（96→100）。本局里赵汝亮解球没碰到 2 号犯规，郑肖淮先 +1（95→96），再从自由球 2 号一杆清到 9 号。最终 100:98", "本局概要": "决胜局：开局 95:98 郑肖淮落后 3 分、比赛只剩约 7 分钟（22:59:47 秦利文：就剩七分钟了）。郑肖淮开球进 1 后 2 号没线路，选择低杆往回退把白球贴在 9 号旁边防守（六路都认可：防到对手犯规就赢了）。赵汝亮解 2 号很难，用扎杆，扎过头没碰到 2 号犯规（柯秉逸：这个没解到真的被绝杀了），郑肖淮 +1 变 96:98 并拿自由球。之后郑肖淮从 2 号一路打到 9 号：2、3 轻推，4 走小了一点，5 用一库反塞，6 低杆拉回叫 7 底袋（偏直），7 中杆往回拉一点（8 又偏直），8 低杆拉回拉多一点但 9 号稳，最后一颗 9 号故意等时间（喝水、等读秒）约 23:06:55 打进，两人握手（约 23:07:00）。比赛因时间到在这局结束，郑肖淮 100:98 夺冠（秦利文：两分两百万），赵汝亮亚军；23:07:06 主持人宣布冠军“江左麒麟”郑肖淮。", "经典": true, "经典理由": "整场决赛的决胜局：落后 3 分、剩 7 分钟，一杆防守逼出对手扎杆解球犯规，然后在手紧、走位偏直的情况下顶住压力一杆清台反超 2 分夺冠；六位主播对“该防不该攻”高度一致，对赵汝亮“怎么解”分歧明显（扎杆 / 两库 / 大力蒙 / 架杆），是一局讲清“关键球防守选择 + 解球方式选择 + 时间规则利用”的样本。", "杆": [{"序": 1, "谁打": "郑肖淮", "打几号": "2", "袋": "", "类型": "防守", "意图": "2 号没线路、翻袋不够、传九太难，又只剩 7 分钟落后 3 分，所以不赌进攻：打准 2 号，白球小低杆往回退一点点贴到 9 号旁边，让赵汝亮看不到 2 号；防到对手犯规拿自由球这局就有赢面", "杆法": "小低杆往回退一点点、来 9 号这边（柯秉逸）；低杆横过来卡着（薛珍麒）；低杆贴九（佟璐）；白球直接往九上靠（党金虎）", "力量": "小（柯秉逸：往回退一点点，不要想做得很死）", "评价": "好球，防得真硬（秦利文：防那杆防了真硬；柯秉逸：好球好球，压力全给到小亮了；党金虎：好球；佟璐：这球背了（指赵汝亮））", "共识": "高", "各主播": {"秦利文": "就剩七分钟了，这球别进攻了，防一杆；能翻袋就翻、打个大金就包赢，不保险就尽量防一杆；小亮这球还真不好解", "薛珍麒": "七分多钟，肖淮得进攻，但先防一杆再进攻；不可能往里倒，直接低杆横过来卡着防一杆，拿个自由球这局就有赢面；不能耗时间，多防几杆就完蛋；不敢拼大金、不敢翻袋；防住、这边解不到就行", "柯秉逸": "2 号过了，传九太难；防硬杆也行，球型这么好，只要防到对手犯规你就赢了；最大重点是绝对不能敲到 7 号，敲到 7 就直接漏了；2 号打直、母球往直的退一点点来 9 号这边，不要想掉得很死，2 号一定要打准；好球好球", "杨帆": "首先 K 一下（做斯诺克），K 上拿自由球一杆一杆打就没了；主要看他敢不敢做这个事，容易挨骂，不是一般人有胆量做（转写含糊）", "党金虎": "打了七分钟三分差距；防一盘肯定来得及，但这盘你得赢；要攻就翻薄一点、借三都能进；要么就防一盘，白球直接往九上靠；好球", "佟璐": "翻袋好像都不够，就得防；7 分 20 没停表，这球得防，低杆贴九，2 号往这边来；别翻进去；这球背了"}, "分歧": "党金虎提过“翻薄一点进攻”、秦利文说“能翻就翻”，但薛珍麒、佟璐、柯秉逸都说翻袋不够/不敢，最终一致认为该防；杨帆强调做斯诺克需要胆量、怕挨骂", "K球": "", "心态手感": "佟璐：紧张（跟咱没关系）；全体主播都说自己紧张", "关键词": ["决胜局", "防守", "低杆回退", "贴9号", "别碰7号", "时间紧"]}, {"序": 2, "谁打": "赵汝亮", "打几号": "2", "袋": "", "类型": "解球", "意图": "白球贴在 9 号旁、看不到 2 号，必须碰到 2 号不犯规；主播给的线路：两库带小低杆（柯）、大力解蒙（党）、架杆直接解（杨）、下点低杆解（薛）；赵汝亮选的是扎杆", "杆法": "扎杆（赵汝亮实际打法，薛珍麒/柯秉逸/党金虎/佟璐都说他扎了）；柯秉逸：左边两库带点小低杆；党金虎：大力解、蒙；杨帆：拿架杆", "力量": "佟璐：不能发太大的力（背的话勾弯都能洗袋）；党金虎：这时候就得大力解", "评价": "失误：扎过头没碰到 2 号，犯规，郑肖淮 +1（95:98→96:98）并拿自由球（薛珍麒：完了完了出事了，这球没解中真的太可惜了；柯秉逸：扎杆扎过头了，这个没解到真的被绝杀了；党金虎：这时候不要打扎杆，我就说了；佟璐：扎糊了）", "共识": "分歧", "各主播": {"秦利文": "到这能解中，要么就得从这扎；这球有可能就是一分之差，一分就是两百万；搞不住就跌了", "薛珍麒": "往这里解、下点低杆解，不好解；扎跳也不好扎也不好跳；它要扎了，扎到这转弯勾中？完了完了出事了，没解中太可惜了，他已经过去了、扎多了一点", "柯秉逸": "不好解；手搭杆还是左边两库带小低杆，说简单也不简单；这颗非常非常关键：解到可能就赢了，没解到直接输；解到又变防守他也没时间了；扎杆看得心跳加速；扎过头了，被绝杀了", "杨帆": "这有啥不好解的，拿架杆面多大呀；决赛这么多人看着有心理压力；这时候必须得解着；得给自己留两分钟", "党金虎": "扎也不能啊，扎过头往这扎包漏的；这时候就得大力解、蒙，不存在勾，勾直接漏了；没解着，这时候不要打扎杆兄弟，我就说了", "佟璐": "这球背了，勾弯都能洗袋，所以不能发太大的力；运气好扫上 2 号能把 2 或 3 带进；完了扎糊了，才领先三分"}, "分歧": "解法四种说法：柯秉逸两库小低杆、党金虎大力蒙、杨帆架杆直接解、薛珍麒下低杆解；党金虎和柯秉逸都反对扎杆（扎过头包漏），赵汝亮偏偏扎了", "K球": "", "心态手感": "薛珍麒：我也紧张了；柯秉逸：心跳加速；杨帆：决赛压力，运动员会有心理（压力）", "关键词": ["解球", "扎杆", "扎过头", "犯规", "自由球", "被绝杀"]}, {"序": 3, "谁打": "郑肖淮", "打几号": "2", "袋": "", "类型": "进攻", "意图": "自由球摆好打 2 号，轻轻一推把白球留到 3 号有角度的地方（后面全是简单球，没有贴库球）", "杆法": "轻推（薛珍麒、佟璐）；白球贴库上走（秦利文）", "力量": "小（佟璐：轻轻的一推）", "评价": "好球（佟璐）；柯秉逸：球型很好，毫无库边球，稳稳拿下", "共识": "高", "各主播": {"秦利文": "打二白球得贴库、贴库上走，打三一推；这台球太吓人了", "薛珍麒": "球型难度不高了，轻轻推，推到这儿就行", "柯秉逸": "这盘稳稳拿下，毫无库边球；3 号坐 4 号角度好一点，白球上来一点点，4 号也可以吃两库；郑肖淮应该没有太大问题", "杨帆": "他现在有信心打没（转写含糊）", "党金虎": "还有四分钟，每个球 40~45 秒，7 颗球 280 秒再加延时，三分钟打完就赢了", "佟璐": "这球直接往根上留，留这来；好球，轻轻的打到这里，轻轻一推"}, "分歧": "", "K球": "", "心态手感": "", "关键词": ["自由球", "轻推", "简单球型"]}, {"序": 4, "谁打": "郑肖淮", "打几号": "3", "袋": "", "类型": "进攻", "意图": "轻推 3 号，白球留到 4 号；柯秉逸说最完美的位置难做、不要硬做，但郑肖淮硬做到了", "杆法": "轻推（薛珍麒、佟璐）；带点塞（秦利文）", "力量": "小", "评价": "进了；柯秉逸：胆子很大，这个完美了，这盘更没悬念；佟璐觉得留了她不想要的角（哎呀他还留这个角呢，好了）", "共识": "中", "各主播": {"秦利文": "这样来吧，带点塞，这球一扣到这", "薛珍麒": "轻轻推推到这边就行；刚好四分钟打完这盘，只要肖淮手不紧，这时候考验心态", "柯秉逸": "不要被时间影响，慢慢打 2 分钟都够，放轻松；最完美是这里但不要硬做、失误率会高，来这里就好；他还想硬做好一点；哇胆子很大，这个完美了", "杨帆": "四分钟，这几个球正常打得完（转写含糊）", "党金虎": "再加延时三分钟，打完就赢了；老肖你打这么快的话，说实话还得打一盘；这就是虎哥说的大心脏，几点都不晃", "佟璐": "轻轻一推推到这里，留点角度；不要留这个角啊，哎呀他还留这个角呢；好了，现在可以完全利用时间了"}, "分歧": "柯秉逸认为不该硬做完美位置但他做到了、叫完美；佟璐认为留的角不是她想要的", "K球": "", "心态手感": "党金虎：大心脏几点都不晃；柯秉逸：抗压看这个时候", "关键词": ["轻推", "硬做位置", "胆子大"]}, {"序": 5, "谁打": "郑肖淮", "打几号": "4", "袋": "", "类型": "进攻", "意图": "打 4 号白球走到 5 号，想走到位但手紧打轻了", "杆法": "", "力量": "轻了一点（薛珍麒、柯秉逸）", "评价": "进了但走位小了一点（薛珍麒：轻了一点，手紧的一部分，这球可能要吃到这了；柯秉逸：轻了一点点但还行；佟璐：角度咋走的大哥呀，走小了），5 号要吃库反塞", "共识": "高", "各主播": {"秦利文": "", "薛珍麒": "轻了一点，这也是手紧的一部分，这球可能要吃到这了", "柯秉逸": "轻了一点点但还行啦；越关键的时候就感觉差了一点，心里也会怪怪的；剩三分半应该没问题，他应该故意慢慢打了，打完下一盘就没机会让人家打了", "杨帆": "现在有一点玩都不行，更玩就容易倒不进（转写含糊）", "党金虎": "", "佟璐": "40 秒出杆时间不够用，你就 30 秒出杆，36 乘 5 三分钟；角度咋走的大哥呀，走小了"}, "分歧": "", "K球": "", "心态手感": "手紧（薛珍麒）；柯秉逸：越关键越差一点，心里怪怪的", "关键词": ["手紧", "走小", "打轻"]}, {"序": 6, "谁打": "郑肖淮", "打几号": "5", "袋": "", "类型": "进攻", "意图": "4 走小了，5 号用一库反塞弹起来走到 6 号，并想让 6 能叫 7 的中袋", "杆法": "一库一扣弹起来、来点左塞/上反塞（秦利文）；反塞起来（薛珍麒）；反塞了，用这根线（佟璐）", "力量": "", "评价": "进了，走到了 6 号；但 6 叫 7 中袋不好叫（见下一杆）", "共识": "高", "各主播": {"秦利文": "直接一扣，用一库一扣弹起来，来点左塞、上反塞；这球压力挺大，七号球必须得打进，打进就赢", "薛珍麒": "反塞起来；挺紧，不要停，停了就不好弄了；谁输谁赢都没有败者", "柯秉逸": "这跟我们一开始预想的差不多，只是没打到 40 局，真的就差两分；完全能体会他们现在手紧", "杨帆": "现在有一点玩都不行（转写含糊）", "党金虎": "兄弟你就慢慢打，不用着急", "佟璐": "反塞了啊，他用这根线，看 6 号能不能走 7 号中袋"}, "分歧": "", "K球": "", "心态手感": "薛珍麒：挺紧", "关键词": ["一库", "反塞", "弹起来"]}, {"序": 7, "谁打": "郑肖淮", "打几号": "6", "袋": "", "类型": "进攻", "意图": "6 叫 7：低杆拉回来，看能叫 7 号中袋还是底袋；主播多数觉得中袋不好叫、老实叫底袋就好，走直就赢了", "杆法": "低杆拉回来（秦利文、薛珍麒、佟璐）；退回来加点塞（柯秉逸）；直接往回转（党金虎）", "力量": "", "评价": "进了，7 号叫到底袋但偏直（柯秉逸：刚刚是有点太直；佟璐：走不了中袋了，太直了，低杆直来直去的好）；柯秉逸：这个球很敢打；党金虎：胆真大，好球稳稳的", "共识": "中", "各主播": {"秦利文": "六号叫住七，一直就低杆拉回来到这，七号打进就赢；我是不敢看了", "薛珍麒": "关键就看 7 号，7 号只要走直；这球拉回来就行，给塞吃到这来；看他走中袋还是底袋，走底袋走直就赢下了", "柯秉逸": "他这个很敢打；这样能叫中袋吗好像不太好叫，打底袋了吧；退回来加点塞来这里，但我感觉叫底袋就好了，退回去角度太差；进就是赢，不进基本输了", "杨帆": "就看这个能不能打，叫远一点、只要不叫中（转写含糊）", "党金虎": "胆真大；这球直接往回转，叫中袋；叫底袋现在有压力啊；好球，稳稳的，稳稳打", "佟璐": "看 6 号能不能走 7 号中袋，走不了就得走底袋；走不了中袋了，这就是太直了，低杆直来直去的好；7 号压力太大了，打到最后又是 7 号"}, "分歧": "党金虎想叫 7 号中袋，柯秉逸、佟璐觉得中袋不好叫、叫底袋就好；薛珍麒两种都行只要走直", "K球": "", "心态手感": "柯秉逸、党金虎：很敢打、胆真大；佟璐：7 号压力太大", "关键词": ["低杆拉回", "叫底袋", "偏直", "敢打"]}, {"序": 8, "谁打": "郑肖淮", "打几号": "7", "袋": "底袋（主播说叫的底袋）", "类型": "进攻", "意图": "7 号偏直，进就是赢不进就输；白球往回拉一两颗球叫 8 号；正常该低杆拉回，但手紧不敢打低杆，用中杆往回拉一点", "杆法": "中杆的感觉（柯秉逸：当下低杆有点不敢打，就先打这种中杆）；往回拉一点点、一两颗球（佟璐）；佟璐另给：往右蹬一点也能蹬", "力量": "柯秉逸：哇还打这个力（力量不小）", "评价": "进了，但 8 号又留得有点直（柯秉逸：这太直诶，7 号其实稍微低杆多一点的话更好）", "共识": "高", "各主播": {"秦利文": "七号必须打进，打进就赢；我受不了了兄弟们", "薛珍麒": "这个球有点直；哎呀紧张，就看这个 7 了；肖淮基本功还是很好的", "柯秉逸": "进就是赢，不进一定输；7 号有悬念；哇还打这个力；这太直诶，刚刚 7 号稍微低杆多一点的话（更好），当下低杆有点不敢打，就先打中杆的感觉", "杨帆": "就看这个能不能打；打完了你还没到十万呢（转写含糊）", "党金虎": "裁判现在都紧张、都在深呼吸；牛逼老肖", "佟璐": "7 号太关键了；往回拉了一点点，往回拉两颗球一颗球；正常应该低杆拉回来，但现在手有点不太好使，往这边蹬也能蹬"}, "分歧": "柯秉逸、佟璐都说该多一点低杆，选手打成中杆往回拉一点，8 号又直了", "K球": "", "心态手感": "手紧、低杆不敢打（柯秉逸）；手有点不好使（佟璐）；党金虎：裁判都紧张了", "关键词": ["中杆", "不敢打低杆", "又留直", "关键球"]}, {"序": 9, "谁打": "郑肖淮", "打几号": "8", "袋": "", "类型": "进攻", "意图": "8 号又有点直，直接低杆拉回去留 9 号（薛珍麒：也可以蹬一点偷一点或退两库，但这时候很紧、还有一分多钟，直接低杆拉回去也行）。约 23:06:05 打进", "杆法": "低杆拉回（薛珍麒、柯秉逸、佟璐）；佟璐另给：往这边蹬也能蹬", "力量": "柯秉逸：应该要打慢一点点；薛珍麒：拉多了一点点", "评价": "进了，拉多了一点点但 9 号稳（薛珍麒：拉多了一点点，冠军球；柯秉逸：哇好球；佟璐：还敢拉回去，硬啊；秦利文：牛逼啊）", "共识": "高", "各主播": {"秦利文": "直接给这两颗打进得了，等的时间太长了；打完这颗这球就结束了；牛逼啊", "薛珍麒": "要不蹬一点偷一点、退两库也行，但很紧、还有一分多钟，直接低杆拉回去也行；拉多了一点点；冠军球", "柯秉逸": "还有一点直，最完美就是母球拉回来原位，小淮应该要打慢一点点吧；哇好球", "杨帆": "擦白球、肯定在擦白球（意思是让他擦球磨时间）", "党金虎": "老肖不要着急，慢慢悠悠打；停停停，擦白球、擦白球（磨时间）", "佟璐": "正常低杆拉回来，但手有点不太好使，往这边蹬也能蹬；还敢拉回去，硬啊"}, "分歧": "杨帆、党金虎这时候都在喊“擦白球”磨时间；秦利文觉得直接打进得了、等太长了", "K球": "", "心态手感": "佟璐：还敢拉回去，硬啊（手紧还敢打低杆）", "关键词": ["低杆拉回", "拉多一点", "冠军球", "磨时间"]}, {"序": 10, "谁打": "郑肖淮", "打几号": "9", "袋": "", "类型": "进攻", "意图": "9 号简单球，进了普胜 +4 反超（96→100）。郑肖淮先不打：喝水、降心率、等读秒，把剩余时间耗完，不给赵汝亮再开一局的机会；约 23:06:55 打进，随即握手", "杆法": "", "力量": "", "评价": "进了，100:98 夺冠（秦利文：两分两百万，这球干的真硬；薛珍麒：冠军球、没有败者；柯秉逸：球！直接握手了；党金虎：握手了握手了）", "共识": "高", "各主播": {"秦利文": "这台球牛逼啊；两分两百万，两百万两分；这球干的真硬，真牛逼", "薛珍麒": "冠军球；差一步没满（时间）；没有败者，打到这个份上没有败者；恭喜郑肖淮，也替小亮惋惜", "柯秉逸": "剩 10 秒喊个延时（转写“岩石”，疑为延时）才会打吧；他喊了吗？听到 10 秒然后赶快打下去；球！直接握手了；这两个抗压性都非常好", "杨帆": "恭喜肖淮，这种太可惜了（指小亮那杆没解着）", "党金虎": "这球打完还多长时间？官方没给时间；磨一下兄弟；恭喜老肖；握手了握手了", "佟璐": "喝上水了，现在就是在降心率；小表情有点紧张；时间不够了；恭喜郑肖淮，自己握拳头了"}, "分歧": "", "K球": "", "心态手感": "佟璐：喝水降

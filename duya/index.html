走三库:袋角→进袋 (没走三库:袋角→进袋) | 没走三库:袋角→进袋 (没走三库:袋角→进袋) | 没走三库:袋角→进袋 (没走三库:袋角→进袋) | 没走三库:袋角→进袋 (没走三库:袋角→进袋) |\n\n示意图：物理/图/修正表_角五法_独牙台.png\n\n"}, {"题": "经典局复刻：说明", "文": "# 复刻/ 说明：独牙决赛每局球形入库 + 经典局在工作台物理里 1:1 复刻\n\n日期：2026-10-05。做的人：复刻帮手。只读了别人的目录（分析/球位、分析/卡片、分析/逐杆.json、predict/、工作台），没改任何别人的文件。\n\n## 一句话结果\n\n- **球形库**：有球位文件的 29 局（第 5~33 局）全部入库，`球形库/第N局.json`，每杆出杆前球位 + 谁打 + 比分 + 结果 + 六位主播要点。\n- **经典局复刻**：卡片标\"经典\"且球位齐的 15 局（6、7、11、17、19、20、21、22、23、25、26、28、29、31、32），共 133 杆（另有 5 杆主控没认出球位，不算）。\n  **按杆复刻率 85%**（113/133）；只看有白球停点可比的 107 杆，A/B/C 合格 87 杆 = **81%**（A 62、B 6、C 19）；白球停点差中位数 **5.4 cm**。\n  **整局每杆都复刻出来的：第 7、11、26、31 局**（4/15）。南哥先要的第 6、7、11、17、19 局：48 杆复刻 44 杆 = 92%。\n- 复刻不出 7 杆、不合格 13 杆，每杆原因见下面清单和 `经典/汇总.md`。\n- 工作台载入：不用改代码，一条 `ln -s` 把 `工作台/video_racks/duya_g*` 链到工作台的 `docs/video_racks/` 下，复盘面板里就多出 29 个\"视频局\"，见 `工作台载入说明.md`。\n\n## 文件\n\n| 文件 | 内容 |\n|---|---|\n| `球形库/第N局.json` | 资产：每杆 出杆前球位（x 台宽 0~1.27、y 台长 0~2.54，和工作台一致）、谁打、开始/结束时刻、比分前后、台上剩球、目标球、结果/进球/犯规、白球停点（=下一杆白球位置）、主播要点（类型/袋/意图/杆法/力量/评价/共识/K球/分歧/关键词）、经典局再带复刻判定和反推杆法 |\n| `经典/第N局.json` | 每杆：出杆前球位、反推的出杆参数（phi 方向、speed 杆速、a 塞、b 高低、跳球 theta）、引擎打完各球停点、白球路线、逐球对照表（比赛停点 vs 引擎停点、差 cm）、白球等级、其他球一致性、整杆等级、判定、原因、同档多解、前 6 名备选 |\n| `经典/第N局_对照图.png` | 每局一张逐杆拼图：淡=出杆前，实心=比赛下一杆真实球位，虚线圈=引擎停点，黄虚线=引擎白球路线，红线=差>8cm；标题颜色=判定 |\n| `经典/汇总.md` / `汇总.json` | 复刻率按杆/按局/按类型/按选手 + 复刻不出/不合格清单 |\n| `经典/第6局_qiaoshi12.json`、`第7局_qiaoshi12.json` | 换乔氏台实测参数跑的对照（见\"球台参数\"） |\n| `工作台/video_racks/duya_gNN/` | 工作台复盘面板能直接读的格式（rack.json + 检查图），见 `工作台载入说明.md` |\n| `工作台补丁/` | 可选小补丁（九球 🏆 标记），不装也能用 |\n| `replicate.py` | 反推复刻主程序；`data.py` 数据对齐（拷自 predict/，改了几处）；`build_rack.py` 生成资产；`draw_game.py` 拼图；`summarize.py` 汇总 |\n| `cache/第N局/序X_default.json` | 每杆结果缓存（断了可续跑，改了代码要删对应缓存） |\n| `logs/` | 运行日志 |\n\n## 怎么跑\n\n```\ncd ~/pool-live-rec/复刻\nPY=~/Documents/Codex/2026-09-27/new-chat/work/pool-env/bin/python\nPYTHONUTF8=1 nice -n 10 $PY replicate.py --games 6,7 --budget 150        # 反推复刻（每杆最多 150 秒，一局 2~10 分钟）\nPYTHONUTF8=1 nice -n 10 $PY replicate.py --games 6 --only 10 --force     # 只重跑某一杆\nPYTHONUTF8=1 nice -n 10 $PY replicate.py --games 6 --phys qiaoshi12      # 换球台参数（结果另存 第6局_qiaoshi12.json）\nPYTHONUTF8=1 python3 build_rack.py            # 球形库 + 工作台格式（全部局；可跟局号）\nPYTHONUTF8=1 ~/pool-live-rec/pose-env/bin/python draw_game.py 6 7      # 拼图\nPYTHONUTF8=1 python3 summarize.py             # 汇总\n```\n数据对齐按 `局+开始时刻` 对账（逐杆.json 重新对齐后序号会变，和预判帮手一样）。\n\n## 方法（大白话）\n\n1. **拿什么当题**：出杆前球位（分析/球位）、这杆结果（分析/逐杆：进了谁、换人、犯规加分）、答案 = 比赛里**下一杆**的全部球位（白球停哪、其他球动没动）、主播卡片（反推类型的先验：防守/解球/跳球/扎杆）。\n   - 比分牌在进 9 后直接跳下一局，逐杆把最后一杆记成\"第N局结束\"，我按\"台上只剩 9 + 有白球\"识别成进 9 那杆。\n   - 犯规杆（对手加 1 分）：下一杆对手自由球，白球停点不能比，只比其他球；按\"没先碰到目标球\"复刻（洗袋另算）。\n   - 补球：没认出来的球按预判帮手的办法从相邻杆抄（白球不抄——抄来的白球是下一杆的，直接判复刻不出）。两处人工改号：第 7 局序 15 的 1 号（预判帮手核过）、**第 17 局序 99 的 1/9 认反**（我对着检查图核过，标\"1\"那颗带白条是 9）。\n2. **物理**：工作台 `clearance.core.simulate`（和工作台\"击球\"同一套，import 不改），默认台参数。起点球位互相压进几毫米/贴库太近的，按复刻 v2 的办法各让开一点（记在 `球位微调mm`）。\n3. **反推网格**（照搬 `dev/replicate_v2/solver.py` 的思路，加了防守/解球/跳球）：\n   - 进攻：候选袋（几何可进的 + 其他切角<85° 的袋 + 传球自己搭假想球 + 翻袋）× 杆速 22 档 × 高低杆 5 档，不加塞；到不了 B 再放开塞 ±0.2/±0.4；还进不了再扫出球方向 ±3~8°。每个格子用 `solve_aim`（复刻 v2 修过 bug 的版本）定方向，碰到了没进再微调方向 ±0.25~1.5°。\n   - 防守/没进的进攻：厚薄 35 档（切角 −85°~85°）× 杆速 13 档（0.3~5.2）× 高低杆 3 档。\n   - 解球：镜像法 1~3 库线路 × 方向 ±5° × 杆速 6 档；没有就全方向每 3° 扫。跳球：引擎跳球，抬杆角 25/35/45/55° × 方向 ±3° × 杆速 6 档。\n   - 再围着最好的 3 个解细扫两轮（方向 ±1.5°、杆速 ±15%、高低 ±0.15、塞 ±0.2，第二轮步长缩到 0.4 倍）。每杆 300~9000 次模拟，1~70 秒。\n   - **挑解的标准**：先要碰对球、进对球；再按\"白球差 + 实际动了的球的终点差 + 不该动却被撞动的位移 + 错进袋罚 0.5 米\"的总和挑最小的。一开始按整杆等级挑，结果会偏向\"白球停对了但该动的球没动\"的假解（第 6 局序 6 那杆 2 号被打到底库弹回来藏在 6 号后面，走了 1.4 米），改成总误差后才对。\n4. **评级**（docs/replicate_v2 的线，不放宽）：白球停点差 A≤10cm / B≤20 / C≤35 / 否则 F；其他球：实际动了>3cm 的终点要在 8cm 内，实际没动的引擎不能撞动>3cm；1 颗不一致且不严重=基本一致降 1 档，否则降 2 档。F=不合格。最后一杆进 9 没有下一杆球位，只能验进袋（\"只验进袋\"）。\n5. **多解**：每杆记录\"同档多解\"（同等级、白球差不超过最好+5cm 的杆法类别）。58% 左右的杆有两种以上杆法都对得上——这和复刻 v2 一样，**对得上 ≠ 杆法一定是他那样**，主播说的杆法记在旁边供对照。\n\n## 复刻率\n\n见 `经典/汇总.md`（按局表、按类型、按选手、清单）。要点：\n\n- 进攻进球 107 杆 91%；防守 12 杆 67%；没进的进攻 7 杆 57%；解球 4 杆 3 杆；跳球 2 杆 1 杆。\n- 赵汝亮 66 杆 88%，郑肖淮 67 杆 82%（郑的扎杆、跳球、K 球多）。\n- 球台参数：换乔氏台实测参数（滚动 0.0073、库弹 0.93）再跑第 6、7 局：第 6 局 6/8→7/8（K7 那杆从白球差 36cm 变成 C），第 7 局 10/10→9/10。互有胜负，没有明显更好，所以主结果用默认台。\"独牙比赛台\"参数（任务清单第 15 项）还没人测出来，测出来后 `--phys` 加一档重跑即可。\n\n## 复刻不出 / 不合格的杆（20 杆）和原因\n\n| 类别 | 杆 | 原因 |\n|---|---|---|\n| 扎杆弧线（引擎做不了） | 6-7（郑解球扎杆传进 6）、20-136（郑扎杆/传 9，主播两种说法） | 引擎没有扎杆，列为复刻不出 |\n| 出杆前白球没认出来 | 21-143、28-209 | 球位文件里这杆的白球是抄下一杆的，不能用 |\n| 目标球没认出来 | 32-250（6 号缺） | 球位文件缺 6 号 |\n| 引擎里进不了同一颗球 | 22-152（置信 0.38）、22-154（8 号是抄来的，切角 77°） | 第 22 局球位质量差（4 杆完全没球位，剩下的置信低），多半是球位错 |\n| K 球/碰多颗球的杆（白球对、被 K 的球差，或反过来） | 6-10（5K7：7 对、白球差 36cm 差 1cm 不到 C）、17-98（1 传 6 定杆后白球回来又碰 9）、21-140（4 敲 5 半颗）、23-162、25-179、29-218（低杆刹车碰 3） | 碰第二颗球后结果对碰球厚薄极敏感，格子再细也难同时对上两颗球；也可能球位有 1~2cm 误差 |\n| 防守/没进的进攻，几颗球都动了 | 19-118（跳球没进，2、7 都动）、20-130（传 9 没进）、20-135（强塞找 9，白球差 40cm）、28-205、28-207、28-208（犯规推杆）、32-243（两库翻底袋带防守） | 多球位移同时对上 8cm 的要求很严；强塞走位引擎塞的效果和真台有差 |\n\n每一杆的\"引擎最接近的打法\"（白球差多少、哪颗球对不上）都在 `经典/汇总.md` 清单和 `经典/第N局.json` 里。\n\n## 哪里还不行 / 诚实的话\n\n1. 球位数据本身有 1~2cm 误差，薄球和 K 球对这个很敏感；第 22 局球位质量差，复刻率 50% 不是物理问题。\n2. \"复刻成功\"里 26 杆是\"只验进袋/犯规杆\"（没有下一杆停点可比），它们只证明进袋对、没证明停点对。\n3. 多解：对得上的杆法常有好几种，我挑的是误差最小的那种，不等于他真那么打；主播说的杆法在卡片要点里，可以对着看（比如 6-11 主播说大力高杆/顿杆，引擎挑的是大力低杆——停点都对得上，杆法本身视频定不了）。\n4. 扎杆、跳球（引擎跳球只做了第一版，19-118 没对上）做不了或不准。\n5. 默认台参数，不是独牙比赛台；库边多的走位（吃两库以上）误差会放大。\n6. 第 33~36 局的球位还没出完（第 33 局是部分文件、34~36 还没有），出来后 `replicate.py --games 33-36` + `build_rack.py` 就能补上；第 33 局卡片 JSON 之前有格式错，现在能读。\n"}, {"题": "经典局复刻：工作台载入说明", "文": "# 在工作台里打开独牙决赛某一局、逐杆播放\n\n工作台（http://127.0.0.1:8767）的\"复盘\"面板本来就能列出 `docs/video_racks/<key>/rack.json` 这种\"视频局\"（以前复刻南哥/楚秉杰视频用的格式）。\n我把每一局都做成了同样的格式，放在 **`~/pool-live-rec/复刻/工作台/video_racks/duya_gNN/`**（NN=局号两位），每局一个文件夹：\n\n- `rack.json`：每杆 before（出杆前球位）/ after（比赛里下一杆的真实球位）/ potted / target / who / notes（主播要点）/ score（比分）/ foul；\n  经典局还带 `replica`（反推出的杆法 phi/speed/a/b、引擎打完的各球停点 after、白球路线 path、白球差 errCm、判定 grade）。\n- `fNN_before.jpg` / `fNN_after.jpg`：主控的检查图（出杆前 / 下一杆前的画面），面板里会显示。\n\n已经用工作台自己的 `coach_server.video_racks()` / `video_rack_detail()` 读过一遍，字段都对得上，**不用改任何工作台代码**。\n\n## 载入（一条命令，不改代码，只是把数据文件夹链进去）\n\n```\nln -s ~/pool-live-rec/复刻/工作台/video_racks/duya_g* ~/Documents/Codex/2026-09-27/new-chat/outputs/台球分镜台/docs/video_racks/\n```\n（我没有自己执行：须知里说工作台目录只读。链接是数据不是代码；想撤掉就 `rm` 那些 `duya_g*` 链接。不想用链接就 `cp -r`。）\n\ncoach_server 每次请求 `/api/coach/racks` 都会重新扫目录，**不用重启 8767**。\n\n## 怎么看\n\n1. 打开 http://127.0.0.1:8767/ ，点\"复盘\"（按钮 id=reviewOpen，面板里\"局\"下拉框），下拉框第二组是\"视频局\"，名字像 `视频 10-04 18:36 对赵汝亮（独牙第6局·经典）`。\n2. 选一局 → 下面是逐杆列表：`第3杆 · 郑肖淮 2号→右中袋 · 中小力中杆 ✓`。点一杆：\n   - \"打之前\"：台面摆成出杆前球位，杆法框里填的是反推出来的 phi/speed/a/b（经典局有）；\n   - \"打之后\"：摆成比赛里下一杆的真实球位；\n   - 台面上 红点=比赛真实白球停点，绿虚线=反推杆法的白球路线；右侧卡片有主播要点、检查图、白球差多少厘米。\n   - \"重打这杆\"：进沙盘按反推杆法真打一遍（和我离线跑的是同一套物理，结果一致）。\n3. 直接跳到某杆：`http://127.0.0.1:8767/index.html?review=v_duya_g06&shot=3`（review=v_ + 文件夹名，shot=本局第几杆，从 1 数、不含开球）。\n\n## 可选补丁\n\n`工作台补丁/coach_server_九球胜负.patch`：视频局的\"🏆\"判断写死了黑八，九球该看 9 号。不装也能看，只是最后一杆没有 🏆 标。装法见补丁文件开头（要重启 coach 进程，先征得同意）。\n\n## 重新生成\n\n```\ncd ~/pool-live-rec/复刻\nPYTHONUTF8=1 python3 build_rack.py            # 全部有球位的局（球形库 + 工作台格式）\nPYTHONUTF8=1 python3 build_rack.py 6 7       # 只做某几局\n```\n经典局先跑 `replicate.py`，再跑 `build_rack.py` 才会带 replica。\n"}, {"题": "出杆动作：郑肖淮vs赵汝亮_对比", "文": "# 郑肖淮 vs 赵汝亮 动作对比（第5~12局近景）\n\n- 郑肖淮分析了 4 杆，其中整杆可信 2 杆；赵汝亮分析了 6 杆，整杆可信 1 杆。下表只用可信的杆算，数值是中位数（括号里是最小~最大，n=杆数）。\n- 可信 = 击球时刻靠白球离开定出来 + 骨骼没乱跳（头部晃动<60mm）+ 后手位移有效（后拉>20mm）。不可信的杆在 汇总表.md 里有标注，原因写在可信度一栏。\n- 郑肖淮穿橙黄衫、赵汝亮穿黑衫，每杆都用球衣颜色核对过身份。\n\n| 指标 | 郑肖淮 | 赵汝亮 |\n|---|---|---|\n| 热身杆数 | 16 (14~19, n=2) | 2.00 (2.00~2.00, n=1) |\n| 后拉长度_mm | 72 (30~113, n=2) | 23 (23~23, n=1) |\n| 后拉用时_s | 0.12 (0.08~0.15, n=2) | 0.05 (0.05~0.05, n=1) |\n| 击球前停顿_s | 0.14 (0.00~0.28, n=2) | 0.00 (0.00~0.00, n=1) |\n| 加速到击球_s | 0.07 (0.03~0.10, n=2) | 0.07 (0.07~0.07, n=1) |\n| 出杆用时_s | 0.21 (0.03~0.38, n=2) | 0.07 (0.07~0.07, n=1) |\n| 送杆长度_mm | 62 (29~96, n=2) | 117 (117~117, n=1) |\n| 最大杆速_m_s | 1.17 (0.53~1.80, n=2) | 4.02 (4.02~4.02, n=1) |\n| 头部晃动_mm | 16 (8~24, n=2) | 53 (53~53, n=1) |\n| 肩晃动_mm | 18 (8~28, n=2) | 56 (56~56, n=1) |\n| 头离杆高度_mm | 124 (27~220, n=2) | 121 (121~121, n=1) |\n| 头离杆高度_球径 | 2.16 (0.47~3.85, n=2) | 2.12 (2.12~2.12, n=1) |\n| 手腕摆幅_deg | — | — |\n| 前臂摆幅_deg | 37 (2~72, n=2) | 155 (155~155, n=1) |\n| 握点到杆头_mm | 177 (177~177, n=1) | 337 (337~337, n=1) |\n| 手架到杆头_mm | 220 (11~430, n=2) | 331 (331~331, n=1) |\n| 手架类型 | {'开放式V字': 2} | {'凤眼(拇指食指圈住)': 1} |\n| 握杆松紧 | {'?': 1, '松/张开': 1} | {'握紧': 1} |\n\n## 怎么读\n\n- 后拉长度/送杆长度：毫米，按白球直径换算；两人机位不同、俯仰角不同，沿杆方向有透视压缩，同一个人不同杆之间也只能粗比。\n- 击球前停顿：后拉到底之后、开始向前加速之前，后手几乎不动的时间。\n- 头部晃动：从后拉到停杆，鼻子最大偏移；小于 10mm 基本就是没动。\n- 头离杆高度：下巴到杆线的垂直距离（画面里），0.5 个球径以内算贴杆很低。\n"}], "最终": "100:98"}</script>
<script>
const D = JSON.parse(document.getElementById('data').textContent || 'null') || {局: [], 局表: [], 开球表: [], 汇总: '', 动作: [], 建议: '', 规则: ''};
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const BALL = {cue:'#f7f5ee','1':'#f2c21b','2':'#1f5fbf','3':'#d8352a','4':'#d77fb6','5':'#ee7a1f','6':'#18774a','7':'#7a2d23','8':'#141414','9':'#f2c21b'};
const P1 = '郑肖淮', P2 = '赵汝亮';
const NAMES = ['秦利文','薛珍麒','柯秉逸','杨帆','党金虎','佟璐'];
let cur = null;

function md(t){
  return esc(t).split('\n').map(l => {
    if (/^#\s/.test(l)) return '<h3>' + l.slice(2) + '</h3>';
    if (/^##+\s/.test(l)) return '<h4>' + l.replace(/^#+\s/, '') + '</h4>';
    if (/^\s*[-*]\s/.test(l)) return '<div>· ' + l.replace(/^\s*[-*]\s/, '') + '</div>';
    if (/^\|/.test(l)) return '<div style="font-family:var(--mono);font-size:12.5px;white-space:pre-wrap">' + l + '</div>';
    return l.trim() ? '<p style="margin:4px 0">' + l + '</p>' : '';
  }).join('').replace(/\*\*(.+?)\*\*/g, '<b>$1</b>');
}
function table(rows){
  if (!rows || !rows.length) return '<div class="empty">还没有数据（相应分析做完后重新生成报告就会出现）</div>';
  const ks = Object.keys(rows[0]);
  return '<table><thead><tr>' + ks.map(k => '<th>' + esc(k) + '</th>').join('') + '</tr></thead><tbody>' +
    rows.map(r => '<tr>' + ks.map(k => '<td>' + esc(r[k]) + '</td>').join('') + '</tr>').join('') + '</tbody></table>';
}
function winner(r){ const t = (r.卡片 && r.卡片.本局怎么赢) || ''; return t.startsWith(P1) ? 1 : t.startsWith(P2) ? 2 : 0 }
function wtype(r){ const t = (r.卡片 && r.卡片.本局怎么赢) || ''; const m = t.match(/\+\s*(\d+)/); const v = m ? +m[1] : 0; return v >= 10 ? '大金' : v >= 7 ? '小金' : v >= 4 ? '普胜' : (/大金/.test(t) ? '大金' : /普胜/.test(t) ? '普胜' : '') }

function score(){
  let last = null;
  for (const r of D.局) for (const s of r.步) if (/^\d+:\d+$/.test(s.比分后 || '')) last = s.比分后;
  if (D.最终) last = D.最终;
  const [a, b] = (last || '–:–').split(':');
  const done = D.局.filter(r => r.卡片).length;
  $('score').innerHTML = `<div class="l"><span class="nm">${P1}</span><span class="n">${a}</span></div><div class="mid">${D.最终 ? '终局 · 郑肖淮夺冠' : '已分析 ' + done + ' 局'}<br>打到第 ${Math.max(...D.局.map(r => r.局))} 局（时间到）</div><div class="r"><span class="nm">${P2}</span><span class="n">${b}</span></div>`;
}
function strip(){
  const have = new Map(D.局.map(r => [r.局, r]));
  let h = '';
  for (let n = 1; n <= 40; n++) {
    const r = have.get(n);
    if (!r) { h += `<div class="rk none" aria-disabled="true">${n}<small>&nbsp;</small></div>`; continue }
    const w = winner(r), cl = r.卡片 && r.卡片.经典;
    h += `<button class="rk ${w ? 'w' + w : ''} ${cl ? 'cl' : ''}" data-n="${n}" title="第${n}局">${n}<small>${wtype(r) || (r.卡片 ? '' : '整理中')}</small></button>`;
  }
  $('strip').innerHTML = h;
  $('strip').querySelectorAll('button').forEach(b => b.onclick = () => show(+b.dataset.n));
}
function filtered(){
  const onlyC = $('f-classic').checked;
  return D.局.filter(r => !onlyC || (r.卡片 && r.卡片.经典));
}
function show(n){
  const r = D.局.find(x => x.局 === n); if (!r) return; cur = r;
  try { localStorage.setItem('rk', n) } catch (e) {}
  document.querySelectorAll('.rk').forEach(b => b.classList.toggle('on', +b.dataset.n === n));
  const c = r.卡片;
  if (!c) {
    $('rhead').innerHTML = `<h2>第 ${n} 局</h2><div class="empty">这一局的逐杆卡片还在整理，先看右边的台面和比分牌记录。</div>`;
    $('shots').innerHTML = '';
  } else {
    $('rhead').innerHTML = `<h2>第 ${n} 局</h2>
      <div class="meta"><span class="pill">开球 ${esc(c.谁开球)}</span><span class="pill ${winner(r)===1?'p1':winner(r)===2?'p2':''}">${esc(c.本局怎么赢)}</span>${c.经典 ? '<span class="pill gold">经典局</span>' : ''}</div>
      <div class="summary"><div>${esc(c.本局概要)}</div>${c.经典 ? `<div class="classic">${esc(c.经典理由)}</div>` : ''}
      ${(c.本局学到的||[]).length ? '<div><b>本局学到的</b><ul class="learn">' + c.本局学到的.map(x => '<li>' + esc(x) + '</li>').join('') + '</ul></div>' : ''}</div>`;
    const fp = $('f-player').value, ft = $('f-type').value, fs = $('f-split').checked;
    const list = (c.杆 || []).filter(s => (!fp || s.谁打 === fp) && (!ft || (s.类型 || '').includes(ft) || (ft === 'K球' && s.K球)) && (!fs || s.共识 === '分歧' || (s.分歧 || '').length > 2));
    $('shots').innerHTML = list.length ? list.map(s => {
      const qs = NAMES.map(k => s.各主播 && s.各主播[k] ? `<div><b>${k}</b><span>${esc(s.各主播[k])}</span></div>` : '').join('');
      const row = (k, v) => v ? `<dt>${k}</dt><dd>${esc(v)}</dd>` : '';
      return `<article class="shot"><div class="top"><span class="no">#${s.序}</span><span class="who" style="color:var(${s.谁打===P1?'--p1':'--p2'})">${esc(s.谁打)}</span>
        ${s.打几号 ? `<span class="pill"><span class="ball" style="background:${BALL[String(s.打几号)]||'#999'}"></span>${esc(s.打几号)} 号${s.袋 ? ' · ' + esc(s.袋) : ''}</span>` : ''}
        <span class="pill">${esc(s.类型)}</span>${s.共识 ? `<span class="pill c-${esc(s.共识)}">共识 ${esc(s.共识)}</span>` : ''}</div>
        <dl>${row('意图', s.意图)}${row('杆法', s.杆法)}${row('力量', s.力量)}${row('评价', s.评价)}${row('分歧', s.分歧)}${row('K球', s.K球)}${row('心态', s.心态手感)}</dl>
        ${qs ? `<details><summary>六位主播怎么说</summary><div class="qs">${qs}</div></details>` : ''}</article>`;
    }).join('') : '<div class="empty">这一局没有符合筛选条件的杆。</div>';
  }
  const st = $('step'); st.max = Math.max(0, r.步.length - 1); st.value = 0; drawStep();
}
function drawStep(){
  const r = cur; if (!r) return;
  const s = r.步[+$('step').value] || {};
  // 台面：0~127 × 0~254（厘米），y 向下画成台长（顶端 = 台长 2.54 米那头）
  let g = `<rect x="-12" y="-12" width="151" height="278" rx="7" fill="var(--rail)"/><rect x="0" y="0" width="127" height="254" fill="var(--felt)"/>`;
  for (const [x, y] of [[0,0],[127,0],[0,127],[127,127],[0,254],[127,254]]) g += `<circle cx="${x}" cy="${y}" r="5.2" fill="#0b0b0b"/>`;
  for (let k = 1; k < 8; k++) if (k !== 4) for (const x of [-7, 134]) g += `<circle cx="${x}" cy="${k*31.75}" r="1" fill="#efe6cf"/>`;
  for (let k = 1; k < 4; k++) for (const y of [-7, 261]) g += `<circle cx="${k*31.75}" cy="${y}" r="1" fill="#efe6cf"/>`;
  if (s.球) for (const [k, v] of Object.entries(s.球)) {
    const x = v[0]*100, y = 254 - v[1]*100;
    g += `<circle cx="${x}" cy="${y}" r="2.86" fill="${BALL[k]||'#999'}" stroke="#000" stroke-width=".35"/>`;
    if (k === '9') g += `<rect x="${x-2.86}" y="${y-1}" width="5.72" height="2" fill="#f7f5ee"/>`;
    if (k !== 'cue') g += `<text x="${x}" y="${y+1.1}" font-size="3" text-anchor="middle" fill="${['2','3','6','7','8'].includes(k)?'#fff':'#111'}" font-family="sans-serif">${k}</text>`;
  } else g += `<text x="63.5" y="127" font-size="7" text-anchor="middle" fill="var(--felt-ink)" font-family="sans-serif">这一步还没认出球位</text>`;
  const P = s.预判;
  if (P && $('f-pred').checked) {
    const X = v => v[0]*100, Y = v => 254 - v[1]*100;
    if (P.区) g += `<circle cx="${X(P.区)}" cy="${Y(P.区)}" r="${Math.min(40,(P.半径||.1)*100)}" fill="rgba(127,240,255,.12)" stroke="#7ff0ff" stroke-width=".6" stroke-dasharray="2 1.5"/>`;
    if (P.路径 && P.路径.length > 1) g += `<polyline points="${P.路径.map(v => X(v)+','+Y(v)).join(' ')}" fill="none" stroke="#7ff0ff" stroke-width=".7" opacity=".9"/>`;
    if (P.实停) g += `<g transform="translate(${X(P.实停)},${Y(P.实停)})"><circle r="3.4" fill="none" stroke="#ffd84a" stroke-width=".8"/><path d="M-2,-2L2,2M2,-2L-2,2" stroke="#ffd84a" stroke-width=".6"/></g>`;
  }
  $('tbl').innerHTML = g;
  const ap = s.掌声 ? `<span class="pill gold">现场掌声 ${esc(s.掌声.强度)} ${esc(s.掌声.持续秒)}秒</span>` : '';
  const pr = P ? `<div style="border-top:1px solid var(--line);padding-top:6px"><b>出杆前预判：</b>${esc(P.类型||'')} · 打 ${esc(P.目标球||'')} 号进${esc(P.袋||'')} · ${esc(P.杆法||'')} ${esc(P.力量||'')}<br>
      <b>对答案：</b><span class="pill ${P.偏差==='一样'?'c-高':P.偏差==='合理'?'c-中':'c-分歧'}">${esc(P.偏差||'')}</span> ${esc(P.理由||'')}</div>` : '';
  $('stepinfo').innerHTML = `<div class="t">第 ${r.局} 局 · 第 ${+$('step').value + 1}/${r.步.length} 步 · ${esc(s.开始)} · 比分牌第 ${s.序} 条</div>
    <div><b style="color:var(${s.谁打===P1?'--p1':'--p2'})">${esc(s.谁打)}</b> 出杆前 → ${esc(s.结果)}　比分 ${esc(s.比分后)} ${ap}</div>${pr}`;
}
function legend(){ $('legend').innerHTML = Object.entries(BALL).map(([k, c]) => `<span><span class="ball" style="background:${c}"></span> ${k === 'cue' ? '白球' : k}</span>`).join('') + '<span>· 金点 = 经典局</span><span>· 局号下方色条 = 赢家（蓝郑 红赵）</span>' }

function tab(name){
  for (const t of ['racks','docs','stats','rules']) { $('tab-' + t).setAttribute('aria-selected', t === name); $('v-' + t).hidden = t !== name }
}
['racks','docs','stats','rules'].forEach(t => $('tab-' + t).onclick = () => tab(t));
function docs(){
  const L = D.文档 || [];
  if (!L.length) { $('doclist').innerHTML = ''; $('doc').innerHTML = '<div class="empty">专题和总结还在写，写好后重新生成报告就会出现在这里。</div>'; return }
  $('doclist').innerHTML = L.map((d, i) => `<button class="chipbtn" data-i="${i}">${esc(d.题)}</button>`).join('');
  const open = i => { $('doc').innerHTML = md(L[i].文); $('doclist').querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', +b.dataset.i === i)) };
  $('doclist').querySelectorAll('button').forEach(b => b.onclick = () => open(+b.dataset.i));
  open(0);
}
$('f-pred').onchange = drawStep;
['f-classic','f-player','f-type','f-split'].forEach(id => $(id).onchange = () => { if ($('f-classic').checked && cur && !(cur.卡片 && cur.卡片.经典)) { const r = filtered()[0]; if (r) return show(r.局) } show(cur ? cur.局 : D.局[0].局) });
$('step').oninput = drawStep;

score(); strip(); legend(); docs();
$('sum').innerHTML = md(D.汇总 || '');
$('breaks').innerHTML = table(D.开球表); $('racktbl').innerHTML = table(D.局表); $('pose').innerHTML = table(D.动作);
$('sugg').innerHTML = (D.建议图||[]).map(u => `<figure style="margin:0 0 12px"><img src="${encodeURI(u)}" alt="${esc(u)}" style="width:100%;border-radius:6px;border:1px solid var(--line)"><figcaption style="font-size:12.5px;color:var(--muted)">${esc(u.replace('建议图/',''))}</figcaption></figure>`).join('') + (D.建议 ? md(D.建议) : '<div class="empty">建议图还在做，做好后重新生成报告就会出现在这里。</div>');
$('rules').innerHTML = md(D.规则 || '');
let first = D.局.find(r => r.卡片 && r.卡片.经典) || D.局[0];
try { const k = +localStorage.getItem('rk'); if (k && D.局.find(r => r.局 === k)) first = D.局.find(r => r.局 === k) } catch (e) {}
if (first) show(first.局);
</script>

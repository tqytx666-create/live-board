 "站位": "双脚被球台挡住/出画，量不了", "白球离开_t": "2040.067", "击球_t": "2039.75", "杆检到率": "0.3", "前手检到率": "0.8", "后手检到率": "0.78", "像素比例_mm_px": "0.812", "可信度": "整杆可信;击球时刻靠白球离开(可信);后手指少"}], "建议": "# 给选手的建议清单（第 5~12 局）\n\n怎么挑的：先从六位主播的卡片里找\"走位不理想 / 力量过大 / 走多了 / 失误\"这类评价的杆（共 18 杆候选），把选手那杆按球位反推出杆法，再让九球教练副本给出备选打法，两边都在**真人误差的物理引擎世界里各打 24 次**对比。只有满足下面任一条才算建议：\n- 把握更高：进球率高出 ≥15 个百分点（24 次里多进 3 次以上，不是抽样噪声），下一杆把握不降、犯规不增；\n- 走位更好：进球率不差，下一杆把握（白球停点打下一颗最好袋的把握）高出 ≥0.10。\n\"把握从 95% 到 100%\"这种在误差内的，一律不算（序 1、28、29、61、62 都因此被刷掉）。\n不为挑刺而挑：18 杆候选最后只留 2 条。图在 `建议图/`，黄色虚线=选手实际线路（按球位反推），青色实线=建议线路，青圈=建议白球停点（6 成落在圈里）。\n\n## 1. 第 5 局 序 2 赵汝亮 打 6 号（左下角袋）\n- 实际怎么打：下低杆（薛珍麒：下的低杆走多了，有点小运气；柯秉逸：太低杆了），白球多走一库停到 8 号旁边，给 7 号留的角度大了。\n- 建议怎么打：中杆中力顶住，不下低杆，白球一库停在 6 号下方台中，给 7 号留一个小角度。\n- 理由：这张台滑（柯秉逸、佟璐都说高低杆都偏低），低杆的停位最难控；党金虎\"中低杆黏一下也行\"、佟璐\"直接中高杆推、控力停回来\"说的就是这条线。\n- 引擎验证（24 次真人误差复打）：建议线路进球 100%、不洗袋、下一杆把握 0.97；选手那杆按反推复打：进球 79%、洗袋 21%、下一杆把握 0.28。注意：反推出来的\"选手杆法\"只是最像的解释（低杆左塞大力），实际他没洗袋，真实数字比引擎复打的要好；但\"低杆走多、角度留大\"是主播和引擎一致的结论。\n- 图：`建议图/序002_第5局_赵汝亮_6号.png`\n\n## 2. 第 6 局 序 11 郑肖淮 打 7 号（右下角袋）\n- 实际怎么打：薄球发大力三库（党金虎：这么大一劲儿；佟璐：力量有点咸了；柯秉逸：太大力了），进了（秦利文：太准），白球跑到中袋旁边。\n- 建议怎么打：中杆中小力（杆速约 1.0），一库停到 8 号附近，不用发力。\n- 理由：秦利文当时就建议\"推两库带点左塞轻打\"，柯秉逸\"中杆就好\"。薄球本身就靠准度，再叠大力，方向误差放大，进球把握掉得厉害；轻打一库到 8 号旁边，8、9 都是顺的。\n- 引擎验证（24 次）：建议进球 100%、下一杆把握 0.97；选手那杆（反推：中高杆右塞中大力）复打进球 58%、下一杆把握 0.96——走位两边差不多，差的是进球把握。\n- 图：`建议图/序011_第6局_郑肖淮_7号.png`\n\n## 看过但没采纳的\n- 序 10 郑肖淮打 5 顺势 K 7：引擎说不 K、低杆回来下一杆把握能从 0.19 到 0.69，但主播说 7 号本来就没袋（所以才 K），引擎看到的那条 7 号进袋线很可能是球位误差，不敢建议。\n- 序 57 郑肖淮一库勾 3 号（主播：解太正了，漏了）：引擎建议两库勾薄，对手把握能降到 0.78、犯规 4%，但选手那杆引擎复打 100% 犯规——反推的解球线路不可信，没法公平比，不列。\n- 序 6 赵汝亮防 2 号（杨帆赛后说没防好）、序 47 郑肖淮翻袋 2 号：引擎找不到明显更好的防守线路，不列。\n- 序 59、61、62 赵汝亮\"走多了/劲大了\"：引擎复打两边进球率、下一杆把握都在 0.95 以上，差别在误差内，不列。\n", "建议图": ["建议图/序002_第5局_赵汝亮_6号.png", "建议图/序011_第6局_郑肖淮_7号.png"], "规则": "# 独牙九球规则（分析今晚决赛用）\n\n整理：2026-10-04。来源：①之前九球项目整理的规则（docs/nine_ball/rules_九球.md，独牙部分出自独牙联赛规则的网页转载）②今晚决赛比分牌实测（秦利文直播间 18:32 起前 30 分钟）。\n\n## 基本打法（中式九球，在中式台球桌上）\n- 只用 1~9 号球。每杆白球必须先碰台面上号码最小的球，碰到以后任何球进袋都算；9 号进袋赢这一局。\n- 进球就接着打，没进或犯规就换人。犯规后对手拿自由球（全台任意摆白球）。\n- 独牙特别规定：自由球那一杆不能直接把 9 号打进（台上还有别的球时进 9 无效、放回、算犯规）；没有推球；可以主动打防守。\n- 摆球：1 号在置球点（菱形最前），2 号在菱形最后，9 号在中间。\n\n## 计分（比分牌实测已对上）\n| 赢法 | 分数 | 实测例子 |\n|---|---|---|\n| 大金：开球进球后一杆清台；或台上 9 颗球全在时一杆清台 | 10 分 | 第5局后赵汝亮 4→14；第9局后郑肖淮 24→34 |\n| 小金：台上只剩 1 号+9 号或不足 9 颗时一杆清台 | 7 分 | 第7局后赵汝亮 14→21 |\n| 普胜：其余赢法（含开球进 9、中途传 9） | 4 分 | 第6局后郑肖淮 15→19；第8局后 20→24 |\n| 犯规 | 对手 +1 分 | 第8局中郑肖淮 19→20 |\n\n## 比分牌怎么读（每杆数据的主要来源）\n- 左右两个大数字 = 两人总分；中间\"5（40）\"= 现在第 5 局 / 全场 40 局（按总分定胜负，待解说核实）。\n- 黄色小箭头 ◀ / ▶ 指向现在该谁打。\n- 下面一排小球 = 台面上还剩哪几颗（1 黄、2 蓝、3 红、4 粉、5 橙、6 绿、7 棕、8 黑、9 黄白花）。哪颗消失了就是刚进了哪颗，可以逐杆读出进球顺序。\n\n## 待核实\n- \"（40）\"到底是全场 40 局还是抢 40（目前比分已过 30，更像 40 局）。\n- 三次连续犯规怎么判；开球怎么轮换（目前看像赢家开球还是轮流开，要逐局记）。\n\n## 实测发现（第5~12局，比分牌+六路解说）\n- 第7局：郑肖淮开球没进，赵汝亮后来 9 颗球都在时一杆清台 → 只算小金 7 分（薛珍麒：\"这球小金没跑\"）。看来\"9 颗齐时清台=大金\"不对，大金只算开球方开球后直接清台。\n- 第8局：郑肖淮开球进 1、6 号后一杆清台 → 只算普胜 4 分；佟璐解说：\"是个普胜，因为从二号打的，没有一\"。\n- 但第9局：郑肖淮开球进 1、7 号后一杆清台 → 大金 10 分；第10局开球进 1 号后清台 → 大金。与第8局矛盾，待核实（可能和 1 号进哪个袋、开球是否犯规、或比分牌读数有关）。\n- 开球进 1 号非常普遍：第5~12局 9 次开球里 7 次 1 号开球进袋。\n\n## 计分规则理顺（第5~12局全部对上，2026-10-04 21:00）\n- 上一局赢家开下一局。\n- 大金 10：开球方开球后自己一杆清台（第5、9、10局）。\n- 小金 7：开球方开球一颗没进（9 颗都在），对方接手一杆清台（第7局）。\n- 普胜 4：其他赢法，包括\"开球方开球进了球但没接上，对方接手清台\"（第8、11局，佟璐：\"不是金，是普胜\"）、来回防守后清台（第6、12局）。\n- 之前\"第8局郑肖淮开球\"是推错了：其实是赵汝亮（第7局赢家）开球进 1、6 后没接上。\n\n## 补充（第13~15局，21:10）\n- K9 / 传 9 进 = 普胜 4 分（第13局比分牌证实）。\n- 大金、小金都要求自己把 1 号打进：对手开球洗袋后，自由球从 2 号清台只算普胜（第15局）；第8局同理（赵汝亮开球进 1、6 但白球洗袋犯规 +1，郑肖淮自由球清台 = 普胜）。\n- 开球轮换：第6~13局符合\"上一局赢家开球\"，但薛珍麒说第15局（第14局赵汝亮赢）仍是郑肖淮开球 → 待核实（等画面认出开球的人）。\n- 第14局结束赵汝亮 +5 = 普胜 4 + 第15局郑肖淮开球洗袋犯规 1（比分牌在开球后才读到），待确认。\n\n## 第27~32局核实（23:20）\n- 计分公式完全验证：第29局末主播播报官方统计\"两人各三大金一小金、普胜 10 对 11、犯规 3 对 5\"，按 大金10/小金7/普胜4/犯规1 算正好 80:86，与比分牌一致。\n- 开球轮换：上一局赢家开球；开球犯规（洗袋等）后，对方可选\"重开\"（重新摆球、改由对方开）——第30局四位主播都提到\"开球洗袋，重开\"，这也解释了第15局\"赵汝亮赢第14局、却是郑肖淮开第15局\"。\n- 全场 40 局，约 4 个半小时时限，中间有几次 10 分钟暂停（第20、30局后）。\n- 待确认：\"2号过线了\"（第28局薛珍麒）——开球后是否有球要过线的规定。\n", "文档": [{"题": "高手同频模型", "文": "# 高手同频模型（独牙九球 200 万决赛 郑肖淮 100:98 赵汝亮，六位主播互相佐证）\n\n整理：2026-10-05。来源：`分析/卡片/第5~36局.json`（六路解说逐杆归纳）、`专题/失误规律.md`、`专题/K球专题.md`、`专题/开球专题.md`、`predict/预判错题本.md`、`分析/统计汇总.md`。第 1~4 局没录到。\n六位主播：秦利文、薛珍麒、柯秉逸、杨帆、党金虎、佟璐。下文\"几位支持\"按卡片里真说了话的人数算，没说话的不算反对。\n出处写法：第 N 局第 M 杆 = 卡片里的\"序\"。\n\n说在前面：这六位看一杆球，先看\"白球去哪、下一颗有没有\"，再看\"进不进\"。进球他们默认职业选手都能进；他们吵的、画线的、叫好的，九成是走位、攻防选择和力量。所以这份模型的重心也在这三样。\n\n---\n\n## 一、开球后接手（开完球第一杆怎么办）\n\n**高手一致认为：**\n1. **开球好不好看\"有没有失机\"，不看进几颗**（佟璐第 7、17、22、25、31 局反复用这个词；薛珍麒第 17 局\"开完漏或不漏差挺远\"；柯秉逸第 17 局\"有 Push 很好，没有就必须解球\"）。失机三件套：白球不洗袋、2 号能看见、2 号能接上。本场 32 次开球有球进 28 次，但开完能直接进攻的只有一半（开球专题）。\n2. **开完 2 号被挡，选择顺序是：能解净就解 → 解不净/怕出不去就跳 → 2 号太薄就防**。解：第 12 局第 1 杆赵汝亮（佟璐\"不敢跳怕出不去只能勾\"）、第 16 局第 2 杆；跳：第 19 局第 2 杆郑肖淮、第 30 局第 2 杆郑肖淮（六位都说\"跳进就大金\"）、第 33 局第 2 杆赵汝亮（清台中途被挡的跳球另有第 31 局第 4 杆、第 34 局第 10 杆）；防：第 28 局第 2 杆、第 34 局第 2 杆、第 36 局第 1 杆。\n3. **开完 2 号没线路、又不想纯防时，先问三件事：翻袋概率、能不能防死、对手准度**（柯秉逸第 11 局第 1 杆：\"手感正热、防也不好防，干脆拼\"）。分数和时间也算进去：领先、时间紧、决胜局一律防（第 28、35、36 局，见第八节）。\n4. **\"接手第一杆\"是全场最容易丢的球**：同一人连续打的第 1 杆丢 5/46（11%），之后的只丢 4%；按球号 2 号丢 14%（失误规律专题）。原因是 2 号位置是开球随机给的，后面的球是自己走出来的。\n5. **对手开球不进送 9 颗球（小金面）时，第一杆只求打进加把白球带回，2 号角度宁可留小**（第 31 局第 2~3 杆：郑肖淮 1 号进了但 2 号角度留大，引出发力闪 7 号、走位出事；柯秉逸\"这个没进就算了还要小金\"）。杨帆第 15 局：\"高手对抗这种球绝对不允许打没。\"\n\n**常见分歧：**\n- 开完 2 号难、不是纯防就是拼的局面，拼什么：第 20 局第 2 杆，秦利文建议传 9、薛珍麒\"六成传九\"、柯秉逸\"直接打或翻袋带防\"、杨帆\"直接进就大金\"——四个人四种，赵汝亮选传 9 打薄了。第 23 局第 2 杆，秦利文\"底袋薄一个右塞\"、佟璐\"软左塞搓\"、党金虎\"翻底\"、杨帆\"防也不好防只能拼\"——赵汝亮没进。**结论：开球后 2 号这种\"随机难球\"，高手之间没有共识打法，所以更该防。**\n- 开球力量：柯秉逸说赵汝亮\"力道小了点\"、郑肖淮\"比较大力\"（第 28 局）；杨帆说\"这开球没有低杆，球都跑了\"是缺点（第 28 局）。郑肖淮大力的代价是空枪 3 次、洗袋 1 次（第 7、15、17、33 局）。\n\n**本场正例：** 第 29 局第 2 杆，赵汝亮开完 2 号极薄只有中袋，佟璐、柯秉逸都说\"只能防一杆\"，他用很小的力低杆刹车把 2 号薄进中袋、白球顺势顶开 3 号——六位齐叫完美，之后大金反超。\n**本场反例：** 第 27 局第 2 杆，郑肖淮开球进 1 后 2 号薄球，袋口有阴影，佟璐、秦利文、党金虎都说该高杆轻推（目标球慢，晃着也能进），他下低杆发满力，球在袋口弹出来，白丢一个大金。\n\n---\n\n## 二、问题球 / 黏球（贴库、没袋、被自己球挡）\n\n**高手一致认为：**\n1. **提前两杆就开始安排，不等走到跟前**。第 6 局第 5 杆：7 号没袋，郑肖淮打 3 号时就把白球停住不上库，留 5 号 K7 的角度，秦利文：\"高手思路都一样。\"第 22 局第 3~5 杆：赵汝亮 3 号低杆一库、4 号低杆、5 号推杆带反塞，全是在给 6 号 K8 摆角度（柯秉逸全程画线\"K8 的角度跑出来一点\"，杨帆也看出来\"那这就是 K8\"）。第 29 局第 3 杆：赵汝亮打 3 用右塞把白球送到\"拿 5 踢 7\"的位置（佟璐、柯秉逸、党金虎三人事前就说要去这个方位）。\n2. **能传就传，比 K 稳**。第 17 局第 3 杆：自由球，6 号挡着 3 号去底袋的袋口，党金虎、佟璐最初想 1 号 K3，柯秉逸、薛珍麒、秦利文、杨帆倾向 1 传 6，郑肖淮选传 6，之后六位都认可（薛珍麒\"传六比 K 三稳当\"；柯秉逸\"K3 倒霉一点弹一库起来会把自己防住\"；佟璐\"等于把三号底袋的袋口放开\"；党金虎\"打得真聪明\"）。第 13 局第 6 杆：小金没希望时 5 传袋口的 9 拿 4 分（佟璐\"这儿拼啥劲呢\"、薛珍麒\"四分也四分\"）。\n3. **准度够就直接打，别 K**。第 10 局第 1 杆：2 号附近球堆挡中袋，柯秉逸、薛珍麒、佟璐、党金虎四人一致\"不用 K，K 了反而把袋封死\"，郑肖淮没 K，一路大金。第 32 局第 4 杆：柯秉逸\"一库刚好可以把 4 号踢开，但那是我们准度不够才想踢开，他们准度够\"。\n4. **问题球要早处理，选角度最好的那杆 K**。第 21 局郑肖淮第 2 杆就刮 5、第 4 杆 K5；第 33 局赵汝亮拖到第 10 杆才 K8，柯秉逸：\"6 号那杆为什么不 K？拖到 7 号 K 角度不好\"，结果只 K 成边库球。\n5. **\"近库\"比\"贴库\"更危险**：目标球离库 2~8 厘米的 18 杆丢 3 杆，真正贴库的 3 杆全进（失误规律专题）。贴库球他们有专门打法：第 22 局第 8 杆赵汝亮 8 号贴库高杆推两库发力（柯秉逸\"正常都是轻推，他还敢用力\"），第 30 局第 4 杆赵汝亮白球贴库打 2 号低杆右塞横台只求硬（薛珍麒\"打得很硬\"），第 34 局第 6 杆郑肖淮 3 号太直离库近，低杆猛拉（佟璐\"有多大劲使多大劲\"）。\n\n**常见分歧：**\n- K 还是翻袋：第 6 局第 5 杆，7 号没袋，秦利文、党金虎、柯秉逸倾向 5K7，佟璐、薛珍麒说翻中袋就够。第 34 局第 8 杆，9 号翻袋角度好，党金虎坚持\"压力太大必须踢 9\"，秦利文、薛珍麒、柯秉逸、佟璐都说\"翻袋包进，不该 K\"——郑肖淮 K 了没 K 到，断了上手。多数派：**翻袋角度好的时候不要 K。**\n- 贴库难球攻不攻：第 11 局第 2 杆 2 号贴库，薛珍麒、佟璐、秦利文、党金虎都想防，柯秉逸倾向攻，赵汝亮想了近 3 分钟低杆强攻打进（柯秉逸\"太犀利\"）。佟璐的口径：\"进球点太难就薄打两库找球防守\"；柯秉逸的口径：\"真要攻就用低杆把白球拉回大区域。\"\n\n**本场正例：** 第 29 局第 3~5 杆（赵汝亮 3 号铺路→5 踢 7 整颗→6 号不留翻袋低杆右塞两库叫直 7 号）。\n**本场反例：** 第 24 局第 2 杆，赵汝亮开球后\"so easy\"的球型只有一颗问题球 3 号，打 2 时白球闪不过只能顺路 K3，柯秉逸、佟璐要\"轻轻 K、白球留原位\"，他发了大力，3 号跑到打不进的位置，大金泡汤（党金虎\"判断性失误、画形错误\"）。\n\n---\n\n## 三、被挡要解（解球）\n\n**高手一致认为：**\n1. **第一目标是碰到不犯规、第二目标是不漏**（六位全场口径一致）。柯秉逸第 7 局第 2 杆：\"这个防守非常重要，漏球对手基本就小金了\"；党金虎第 25 局第 5 杆：\"解到了但是漏了，这样就是省一分\"；薛珍麒第 33 局第 6 杆：\"只要不漏就行，现在每一杆都非常关键\"；柯秉逸第 17 局第 2 杆算账：\"犯规 1 分加小金 7 分就是 8 分。\"\n2. **口诀：长解短好解、短解长不好解**（薛珍麒第 6 局第 3 杆）。短解长宁可扎杆/弧线碰薄一点，别赌远距离库解。\n3. **解薄不解厚、白球要藏**：第 12 局第 3 杆郑肖淮解太正漏了一盘明球（佟璐\"把三勾薄一点吃一库留顶上，白球停住\"；薛珍麒\"解太正了\"）；第 33 局第 3、6 杆赵汝亮两次解薄都没漏。\n4. **多库解球的细节**：解两库三库一定要给塞，少了多了都不行（薛珍麒第 19 局第 12 杆）；杆头高半颗皮头线路就差一截，不是塞的问题（佟璐同杆：\"把中高杆往下挪三分之一颗皮头就直接解着 4 了\"）；塞力要坚持到第二库（佟璐第 28 局第 8 杆）；先看哪条库线被挡、能不能下塞（佟璐第 17 局第 2 杆\"两库被黑 8 挡、右边有球不能下右塞，只能一库\"）。\n5. **扎杆和跳球的取舍**：近扎远不扎（薛珍麒第 22 局第 7 杆\"这球近，近扎还好，远一点就不好扎了\"）；扎杆白球留不到下一颗就改跳（柯秉逸第 31 局第 4 杆）；跳球要跳白球正中间、不带旋转、跳近一点（佟璐第 30 局第 2 杆）；跳硬杆不容易飞出去（柯秉逸第 34、35 局）；跳之前想白球落点、别碰 9 号（第 33 局第 2 杆跳进 1 却叫不上 2\"灭金\"；第 34 局第 10 杆柯秉逸、佟璐都强调别把 9 K 出来）。\n6. **防洗袋的解法**：要么发力、要么下低杆，让白球碰到目标球的瞬间就出分离角，劲小了白球顺着往袋里走（佟璐第 28 局第 3 杆）；被吊三库解球该高杆带一点左塞，下低杆解不到还跑远（佟璐第 23 局第 10 杆，郑肖淮犯规）。\n\n**常见分歧（本场最大的一个）：精细解 vs 大力解。**\n- 第 13 局第 1 杆：赵汝亮往缝里轻解半颗想顺便藏白球，解薄漏了。杨帆：\"想用指劲勾进是装高手，不如大劲一打\"，\"为啥不跳\"；党金虎：\"解完白球奔着 9 号把局面弄乱，你不要我活谁也别过\"；佟璐：\"拿跳杆就能跳\"；秦利文、薛珍麒倾向轻解做藏。\n- 第 16 局第 2 杆：柯秉逸、佟璐画\"解 2 带 4\"的精细线路（赵汝亮就是这么打的，只是打薄了）；秦利文、党金虎、杨帆：\"这时候防没意义，必须大力解，小劲勾根本不可能，大力起码有运气跟着。\"\n- 第 19 局第 6 杆：秦利文、党金虎、杨帆要赵汝亮发力解兼传 9（\"大力出奇迹\"），佟璐要纯防，赵汝亮控力解到半颗。\n- 第 36 局第 2 杆（决胜局）：赵汝亮扎杆扎过头犯规被绝杀。党金虎、柯秉逸事前事后都说扎过头包漏，该\"两库带小低杆\"或\"大力蒙\"；杨帆说拿架杆直接解；薛珍麒说下低杆解。\n- **能提炼的共识**：拿不准就别选最精细的那条路（第 13 局卡片的总结）；选\"解到也不漏、解不到也只是换人\"的方式，别选\"解不到就送自由球\"的方式（第 36 局）。\n\n**本场正例：** 第 34 局第 3 杆，郑肖淮中杆蹬两库解 2 号，秦利文\"一下解死俩\"、柯秉逸\"差一点直接 2 传 9\"、杨帆\"解的最好\"。第 6 局第 3 杆郑肖淮扎杆弧线碰到 2 号还把 6 号传进（有运气，但思路六位都认可难度）。\n**本场反例：** 郑肖淮全场解球犯规 5 次（第 19、23、28 局等，佟璐第 28 局\"小淮今天这个解球犯规犯得太多\"），赵汝亮第 36 局扎杆犯规直接丢冠军。\n\n---\n\n## 四、该攻还是该防\n\n**高手一致认为：**\n1. **早晚都得防，不如现在就防**（秦利文、柯秉逸、佟璐第 19 局第 5 杆一致；佟璐原话\"你就算不防，打完 3、4 到 5、6 早晚都得防一杆\"）。局面乱、后面有必防的球时，先防。\n2. **防守要么贴死，要么别防**（秦利文第 19 局第 6 杆\"防守没意义除非贴死\"）；防漏了比不防更糟（薛珍麒第 18 局第 7 杆\"防漏了就出问题\"；杨帆第 34 局第 4 杆\"这防守还不如往里打完\"）。\n3. **防守的重点是白球落点，不是目标球**（柯秉逸第 34 局第 2 杆\"重点不是 2 号是母球，白球一定要来这个地方\"；佟璐同杆\"一推一粘，2 号愿意上哪上哪\"）。最硬的防守是把白球藏在 9 号后面，让对手只剩一条解球线（第 19 局第 11 杆，六位齐叫好；第 36 局第 1 杆决胜防守也是贴 9 号）。\n4. **防守时\"别碰到会漏的球\"比\"做得多死\"更重要**（柯秉逸第 36 局第 1 杆反复说\"绝对不能敲到 7 号，2 号一定要打准，不要想做得很死\"）；轻轻防、别留袋口（薛珍麒第 28 局第 5~6 杆）；防守选位优先\"一定防得到\"的简单位置，刁的位置容易用力过了差一点（柯秉逸第 32 局第 4 杆；佟璐、杨帆同杆也说贴 6 号后面比藏 8 号后面危险）。\n5. **手感不好、手紧时先防，把主动权防回来**（佟璐第 25 局第 4 杆\"手感不好就不着急进攻\"，郑肖淮进 2 没叫好直接贴死 4 号，六位都说防得严实）。\n6. **分差小、对手手热时别冒险**（第 23 局第 4 杆：郑肖淮分差 8 分在 3 号上翻袋没进，佟璐\"我建议小淮要防一杆\"、杨帆\"你这不就是冲动了吗，他刚打完大金心气挺好\"）。\n7. **没把握的球直接防，不硬拼**（第 23 局第 9 杆赵汝亮 8 号低杆拉防守把郑肖淮吊到犯规，佟璐\"往里拼纯属有点傻\"、柯秉逸\"拉跟控制的真好\"、杨帆\"高级\"；第 34 局第 10 杆赵汝亮 8 号不硬打先防，党金虎\"不好打咱们就不打，聪明人干聪明事\"）。防守时机还可以更早：柯秉逸第 23 局第 8 杆\"7 号时就该防，7 比 8 好防\"。\n8. **能进也可以防，因为独牙犯规给 1 分**（秦利文第 24 局第 5 杆\"这球谁都包进，但防一杆得分率高，容易多得一分，这是他的聪明之处\"；党金虎同杆\"这球不用攻\"）。\n9. **两头都想要的杆最容易两头空**（第 18 局第 7 杆赵汝亮想进 6 又想藏白球，佟璐\"这啥防守这是\"；第 25 局第 2 杆赵汝亮打 2 又想踢 9/踢 8，柯秉逸\"分心了，应该专心打二\"，杨帆\"这毛病今天犯了四五回\"；第 32 局第 8 杆赵汝亮长考后打厚，柯秉逸\"看不懂是攻是防，压力很大\"）。先定主次。\n10. **打一颗防一颗，运气不会一直好**（杨帆第 6 局第 3 杆、第 18 局第 8 杆）。\n\n**常见分歧：**\n- \"该拼的要敢拼\"和\"保守\"的边界。支持拼的例子：第 25 局第 6 杆郑肖淮 3 号（柯秉逸觉得推杆会碰 6 该防，郑肖淮低杆加塞进攻一路清台，秦利文\"再给你上一课\"）；第 29 局第 2 杆赵汝亮薄中袋（主播都说只能防）；第 11 局第 2 杆赵汝亮贴库强攻；第 32 局第 2 杆郑肖淮两库翻底袋带防（柯秉逸、杨帆\"回报大于风险，没翻到也可以防御\"，薛珍麒、佟璐\"差 3 分不会拼、一拼就没了\"）。**提炼：拼的前提是\"打得进、走得开、不进也不漏\"三个都占；只占一个的是赌。**\n- 攻守兼备的翻袋算攻还是守：第 24 局第 4 杆郑肖淮 3 号翻中袋给很多右塞慢慢坠进，柯秉逸\"没进对手也痛苦，进了自己继续，我感觉没进反而更好因为防得更死\"；党金虎\"虎哥画的线路是最合理的防守线路\"。但翻袋本场 8 杆丢 4（失误规律），第 29 局秦利文\"都什么水平了还给人家走翻袋\"、薛珍麒\"翻袋那是我们干的事\"——**击打能力强的人应该把翻袋当保底，不当常规。**\n- 翻袋概率怎么算：佟璐第 34 局第 12 杆\"翻进只有四五成，戴勇翻也不敢说一进一，防守最合理，站那儿想半天一定要算我是翻还是防\"；柯秉逸、党金虎能理解翻（翻完白球贴库也算半个防守）。\n\n**本场正例：** 第 36 局第 1 杆决胜局，郑肖淮落后 3 分剩 7 分钟，开球进 1 后 2 号没线路，低杆退一点贴 9 号防守，六路里五路第一反应都是\"防一杆\"，柯秉逸\"球型这么好，只要防到对手犯规你就赢了\"——赵汝亮扎杆犯规，郑肖淮自由球清台夺冠。\n**本场反例：** 第 34 局第 8、12 杆，郑肖淮 5 号大力 K9 没 K 到（四位说不该 K），白球没回来后又翻底袋没进（秦利文\"防守不丢人，就剩一二十分钟打这么激进干什么\"），一局里两次该防不防。\n\n---\n\n## 五、K 球时机（详见 `专题/K球专题.md`）\n\n**高手一致认为：**\n1. **四条齐了才主动 K：问题球没袋 + 没有更稳的替代（不能传、翻袋把握不够、防守不划算）+ 顺路（在当前球的自然分离线上）+ 近（白球到问题球 0.3~0.6 米）**。全场主动 K 只有 5 杆（第 6 局 5K7、第 21 局 4K5、第 22 局 6K8、第 29 局 2K3 和 5K7），两人都很克制。\n2. **K 成不成八成看力量**：6 杆 K 里 4 杆的毛病是力量（第 22 局太轻吊球、第 24 局太大、第 29 局 5 踢 7 稍大、第 6 局力量过大），没有一杆是没撞到。党金虎第 29 局第 4 杆：\"一定要踢整颗不要勾，一勾白球就停住了\"；薛珍麒同杆：\"没办法轻 K，轻 K 白球贴库往里钻，6 号就失控\"；柯秉逸第 22 局第 6 杆：\"千万不能 K 完吊球，应该再大力一点。\"秦利文第 6 局第 6 杆的原则：\"K 准就发力，K 不准就轻 K。\"\n3. **K 之前先预判 K 完的样子**：杨帆第 6 局第 6 杆\"先预判杆法再预判 K 的位置和效果，一颗 K 一颗 K 不好半颗球就死了\"；薛珍麒第 29 局第 4 杆的\"三不\"：问题球不 K 死、不贴库、白球不贴库。第 21 局第 4 杆郑肖淮 K5 到了但和白球踢直了（党金虎\"踢直了，这球不好直了吧\"）——**K 完白球停哪也要画。**\n4. **\"顺便踢 9 / 找 9\"是全场最亏的决定：4 杆全失败，直接输 2 局**。第 12 局第 2 杆郑肖淮打 2 踢 9（9 踢薄、白球拉过头、3 打不到→解球漏→输局）；第 20 局第 7、8 杆赵汝亮 5 找 9、6 两库找 9（两次没撞进，留了包进的传 9，秦利文\"这局就这球输的\"）；第 25 局第 2 杆赵汝亮分心两头空。事后口径一致：柯秉逸\"专心打二，九的没进就算了\"，佟璐\"六走七也不难、八号还在袋口，倒不如直接打完\"，秦利文\"细节决定成败，万分之一的概率，跟运气没关系\"。**只有 9 在袋口碰到就进（第 13 局）才允许传 9。**\n5. **问题球是\"下一颗\"且位置随机（开球后 2、3 号）时，默认防守不 K**：本场两人这种局面 0 次 K。\n\n**常见分歧：**\n- K 的方式：第 24 局第 2 杆，柯秉逸、佟璐要轻 K 白球留原位，秦利文要 K 厚一点弹一库起来——两种 K 法要连力量档一起给。\n- 要不要顺路 K：第 21 局第 2 杆佟璐\"不能 K5，两库都能叫 3\"，柯秉逸觉得刮一下不错；第 28 局第 4 杆秦利文、佟璐都说该顺路蹭 4 一半，赵汝亮低杆直接走位没碰，3 号没位只能防（秦利文\"判断失误\"）；第 21 局第 6 杆佟璐事后主张顺路 K 一下 8。\n- 第 34 局第 8 杆 K9：党金虎一人要 K，其余四人不要 K（见第二节）。\n\n---\n\n## 六、走位路线选择（一库 / 两库 / 推 / 拉 / 加塞）\n\n**高手一致认为：**\n1. **先规划后面再打眼前**：先把 4 号中袋定下来再决定 3 号留什么角度（薛珍麒第 9 局第 1 杆）；2 叫 3 选底袋不选中袋，因为底袋好叫 4、走中袋得绕一遍还有 7 挡着（薛珍麒第 26 局第 2~3 杆，佟璐画的线和实际一模一样）；顺局开打前把整盘思路摆出来（薛珍麒第 10 局\"六号拉回来一点，七号推两库，这盘就打完了\"；佟璐第 24 局开局就把 2 到 9 每杆杆法画完）。\n2. **走位别走直，留一点角度**：第 7 局第 5~9 杆赵汝亮从 2 到 6 每杆主播都在喊\"别太直、留点角度\"（佟璐\"不要叫直\"、柯秉逸\"注意不要太直\"）；秦利文第 19 局第 13 杆\"高手走位尽量不走直，走直影响下一颗走位\"；第 26 局第 5~7 杆郑肖淮 5、6、7 都留一点角（佟璐\"不光不直还有一点往那边角，太得劲了\"）。走直的代价：第 17 局第 9~10 杆郑肖淮 7 号走直反角没留出来，8 号只能加塞拼分离角，白球起跳出线，9 号打丢；第 36 局第 7~8 杆手紧连着两杆走直。\n3. **但角度刚好时用定杆，白球留在一条线上而不是一个点**：第 16 局第 6 杆（薛珍麒\"只要在这条线上都挺好\"，党金虎\"为什么定杆，因为角度刚刚好\"，佟璐承认自己想的角大了）；第 8 局第 4 杆定杆点住（党金虎\"白球锁在方格里，这就叫专业\"）；近直球一律小力定杆/小低杆点住，拉一点点就够（柯秉逸第 9 局第 3 杆\"不要太大力，大力容易失误\"，杨帆\"一进一个定\"）。柯秉逸第 10 局第 3 杆的\"二分法\"：白球留在进球线的一侧就都好。\n4. **走位尽量让白球沿着下一颗的进球线方向过去，停早停晚都有球**（佟璐第 9 局第 2~3 杆，\"这就是有时候要三库四库走位的原因\"）。\n5. **库数：角度小两库误差大，能一库就一库**（秦利文第 10 局第 6 杆\"高手一般选一库\"）；**大角度白球撞库快、低杆来不及发挥，只能两库别指望一库**（薛珍麒第 29 局第 5~6 杆）；两库比一库推的落点面更大（佟璐第 5 局第 1 杆）；最后几颗简单球少吃库少变数（第 16 局第 7 杆党金虎\"这时候咱们就不吃一库\"）。失误规律专题的数据：一库最稳、两库开始飘，高杆推走位比低杆拉稳得多（纯高杆/推杆 17 杆只 1 杆走位差，含低杆的 20~40%），低杆的毛病集中在\"拉多了/拉少了\"。\n6. **推 / 拉 / 加塞的道理**：\n   - 两库靠加塞，一库靠大力（秦利文第 7 局第 10 杆）；中杆多塞两库不用高杆——高杆白球顺着走塞发挥不出来，中杆白球横着吃库塞才起作用，分离角大得多（佟璐同杆，六位叫好的一杆）。\n   - 高杆纯推不下塞、点越高越好、走中线（党金虎第 16 局第 5 杆，柯秉逸\"你永远都给他画得刚刚好\"）。\n   - 分离角上有球挡路时不要轻推：轻推分离角小会直接 K 到，要么发力闪过去要么换线路（薛珍麒第 31 局第 3 杆、第 32 局第 9 杆）；想躲球用反塞减小分离角（佟璐第 25 局第 2 杆\"下左塞一定碰住 9\"）。\n   - 想让白球回来一点用\"击打的力\"蹬回来，别纯拉，纯拉容易手软（薛珍麒第 9 局第 4 杆）。\n   - 轻推加一点反塞停住是最保险的收尾走位（第 18 局第 10 杆秦利文\"他这个保险打法，好球\"；第 31 局第 9 杆）。\n   - 台泥滑、打空转时塞要加得比平时强（佟璐第 7 局第 10 杆）；今晚球台滑，高低杆实际出来都偏低（柯秉逸第 5 局）。\n7. **力量就是白球多走一颗少走一颗**（薛珍麒第 18 局第 4 杆）：一杆多走一颗，后面两杆都得将就（第 18 局 4 号劲大→5 号薄切→6 号难球没进）；一点就能完的球别发力（第 16 局第 4 杆秦利文\"花这么大力干啥\"）；同一走位两条路线都行时决定成败的是力量不是路线（第 13 局第 3 杆郑肖淮高杆推左塞两库\"硬了\"走多四五颗，柯秉逸定性\"2 号叫 3 号没叫好\"是败笔）。\n8. **走坏了别硬来**：白球位置不理想就推杆带塞两库到大区域（第 9 局第 6 杆郑肖淮滑杆后补救，秦利文\"整整好出圈\"）；走大了用塞抓住（第 31 局第 8 杆佟璐\"右塞应该能抓住\"）；不要硬做完美位置，失误率会高（柯秉逸第 36 局第 4 杆）；角度刚好用定杆，走直了就老实低杆拉回、叫底袋别硬叫中袋（第 36 局第 7~9 杆）。\n9. **简单球用最简单的杆法，不加花**（佟璐第 26 局第 7 杆\"下别的杆法我就骂你\"；第 25 局第 7~10 杆郑肖淮 4 低杆点住、5 中低杆蹬一库、6 推一库、7 定杆；杨帆第 15 局第 6 杆\"中杆低杆高杆都得进，加原地转或强低杆才可能坏事\"）。\n10. **按今天的手感选杆法**（薛珍麒第 8 局第 7 杆\"今天下什么杆法用什么力量更有信心就选哪个\"；柯秉逸第 8 局\"推杆派今天变低杆派\"）——同一个走位有三种杆法时看习惯和当天手感，不是赌杆法。\n\n**常见分歧：**\n- 一库还是两库：第 10 局第 6 杆薛珍麒\"正常是蹬两库\"、秦利文先说两库又说高手选一库；第 15 局第 4 杆薛珍麒列三条路都行。**一般是都能到，差别在误差大小，按角度和力感选。**\n- 袋口：第 11 局第 3~4 杆秦利文、杨帆都说该叫底袋别叫中袋（中袋细、容易打厚），赵汝亮选中袋；第 22 局第 2 杆秦利文、党金虎、薛珍麒想底袋，赵汝亮打中袋走两库（柯秉逸\"基本功的展现\"）。**袋口看下一颗怎么走，不看哪个袋大。**\n- 杆法叫法：同一杆秦利文叫\"塞大点一推\"、薛珍麒叫\"中杆\"、佟璐叫\"中高杆一点右塞\"（第 26 局第 2 杆），目标一致——**教学时按目标教，杆法给选项。**\n\n**本场正例：** 第 26 局郑肖淮大金（2 叫 3 选底袋、4 叫 5 走两库让白球离 5 近、5~7 都留一点角，佟璐从 2 号起每杆画线都和实际一样）；第 7 局第 10 杆赵汝亮中杆多左塞两库把 8 叫直。\n**本场反例：** 第 13 局第 3~5 杆郑肖淮 2 号走多四五颗、4 号走小、放弃小金；第 18 局第 4~6 杆走位误差一杆传一杆。\n\n---\n\n## 七、收尾 9 号处理\n\n**高手一致认为：**\n1. **9 号在中袋附近时，8 号的走位只要不贴库、不走远，哪都行**（薛珍麒第 6 局第 8 杆），别为了完美落点多吃库。\n2. **8 叫 9 按角度选杆法，不按习惯**：对直了就低杆拉回，有角度就高杆两库（秦利文第 15 局第 6 杆）；低杆直接拉 / 高杆一库两种都行（第 30 局第 9 杆秦利文、佟璐）；最稳是轻推加少量反塞停住（第 18 局第 10 杆、第 31 局第 9 杆）。\n3. **最后一颗别大力、别加花**：党金虎第 17 局第 11 杆\"吃这么大劲干嘛，打进不就完了\"；柯秉逸同杆\"他最后一颗都很大力，顾劲都比较大\"；佟璐\"这球很容易打薄，真打薄了\"。\n4. **9 号翻袋角度好的时候不 K9**（第 34 局第 8 杆，四位主播）；**最后一杆翻还是防要算概率**（佟璐第 34 局第 12 杆\"翻底袋四五成，防守最合理\"）。\n5. **台面能打完就别半道传 9**（佟璐第 20 局）；**小金没希望、9 在袋口才果断传 9 拿 4 分**（第 13 局第 6 杆）。传 9 进也只是普胜 4 分（比分牌多次证实）。\n6. **决胜局 9 号要会用时间**：第 36 局第 10 杆郑肖淮喝水、等读秒再打进，不给对手再开一局的机会（党金虎\"你打这么快还得打一盘\"）。\n\n**常见分歧：**\n- 关键 9 号大力还是轻打：柯秉逸第 33 局第 12 杆\"这种关键 9 号他（赵汝亮）都打很大力，我们一定轻点低戳\"；郑肖淮也是最后一颗大力（第 17 局）。两位选手都习惯大力且准，主播自己会轻打。**结论：大力靠准度顶，普通选手学轻点低戳；重点是出杆坚定（秦利文第 33 局\"需要一个强大的心脏和强大的基本功\"）。**\n\n**本场正例：** 第 33 局第 12 杆赵汝亮关键 9 号大力顶住反超、挥拳释放；第 36 局第 10 杆郑肖淮等读秒再收 9。\n**本场反例：** 第 17 局第 11~12 杆两人连丢两个 9 号（郑肖淮大力打薄、赵汝亮塞加多打薄）；第 20 局赵汝亮三次找 9 全失败。\n\n---\n\n## 八、领先 / 落后 / 时间紧时的策略\n\n**高手一致认为：**\n1. **领先有领先的打法：一定不要攻一定是防，慢慢打**（薛珍麒第 35 局第 2 杆；柯秉逸、秦利文同意）。第 30 局第 7 杆秦利文\"这么关键的情况下这俩人都比较谨慎\"，赵汝亮 3、4、5、8 号全用轻推/蹬一库。\n2. **落后时也不赌：有大金诱惑也先看白球能不能走上位**（第 28 局第 2 杆：赵汝亮落后 9 分开球进 1，2 号只剩翻中袋，秦利文本想让他\"拼一枪，输输十分赢赢十分\"，他选防守，秦利文看完改口\"一个好的防守跟进攻一样，对手很难受\"；佟璐\"不立杆走不上位，立杆又怕打不准\"）。落后时真正的拼是第 29 局那种\"打得进也走得开\"的拼。\n3. **比分咬紧时两人都手紧，先坏的是决策不是准度**（失误规律专题：胶着时进球率没掉，但\"想要的太多\"的判断性失误集中在第 24、25、28、32 局）。柯秉逸第 28 局第 14 杆：\"今天这场肖淮只要打一个大金拉开就失误，小亮快追起来也会失误。\"薛珍麒第 32 局：\"这个阶段只会越打越保守。\"\n4. **官方时间出来后，每一局都当决胜局打：走路快一点，出杆不能急**（柯秉逸第 34 局第 9 杆\"现在每一局都要当成决胜局再打\"、第 35 局第 7 杆\"走路要稍微快一点点\"；杨帆\"没必要着急\"）。\n5. **要会算时间和分数规则**：落后方必须在时限内打完这局才能反超，打完太早又多一局给对手（第 36 局，杨帆赛前就说\"郑肖淮得算时间\"；党金虎\"磨一下兄弟\"）；大金 10 / 小金 7 / 普胜 4 / 犯规 1 的账要会算（柯秉逸第 9 局\"滑杆要是白球飞出去等于丢 15 分\"、第 17 局\"犯规 1 分加小金 7 分就是 8 分\"）；小金的价值：落后 10 分一个小金就追到差 3（第 31 局）。\n6. **中场休息怎么调**（柯秉逸第 20 局）：洗把脸、深呼吸、到户外换心境，别回想刚才哪杆失误，检讨留到赛后。\n\n**常见分歧：**\n- 时间不多领先方该不该翻：第 35 局第 2 杆，薛珍麒、柯秉逸、秦利文支持防（领先慢慢打、防更消磨时间），党金虎、杨帆主张翻底袋（概率大、能直接拿分），佟璐\"翻是犯错误但时间不够也可以翻\"。赵汝亮防了，结果 3 号把 6 号传进等于自己堵自己（柯秉逸\"这传进真的不好\"）——**防之前要看目标球去路会不会碰到别的球。**\n- 落后时\"急需大金\"是观众视角：杨帆第 14、21 局多次喊\"急需两根大金\"，但两位选手落后时的实际选择都是先防（第 28 局）或先拿普胜（第 21、27、30 局）。\n\n**本场正例：** 第 36 局整局（防守→对手犯规→自由球清台→等读秒）。\n**本场反例：** 第 34 局第 12 杆郑肖淮时间只剩一二十分钟还翻底袋（秦利文\"你现在需要的是机会，珍惜每一次上手\"）。\n\n---\n\n## 九、心态与手感调整\n\n**高手一致认为：**\n1. **球台和环境要提前估到**：今晚球台滑，高低杆出来都比想的偏低（柯秉逸第 5 局\"球滑手感要调\"，佟璐第 7 局\"打空转说明球特别滑\"）；晚上人多湿度大、胶边变硬要加力、库边会喷（秦利文第 24 局、佟璐和柯秉逸第 18 局第 4 杆）；画线要熟悉这张台喷不喷、吃不吃塞和每个球员杆重习惯（佟璐第 19 局第 16 杆）。\n2. **紧张的表现是走位偏轻偏直、低杆不敢打、脑子乱，不是打不进**：第 36 局第 5~8 杆郑肖淮 4 走小、6 叫 7 直、7 叫 8 直（柯秉逸\"越关键越差一点，低杆不敢打就先打中杆\"）；第 34 局第 8 杆秦利文\"手能跟上，但大脑已经有点凌乱\"；第 24 局第 7 杆郑肖淮自由球想偷袋角洗袋（薛珍麒\"平时不怎么掉的球今天都掉\"）；杨帆第 29 局第 7 杆看赵汝亮\"起杆的时候屁股都顿一下\"。\n3. **手紧时的处方**：先防把主动权要回来（佟璐第 25 局）；回到基本动作、简单球更要按标准打（第 24 局卡片总结）；手紧就用最简单的路，推两库轻轻走、一库停、不碰 9、不 K、不留贴库（第 35 局郑肖淮整局没一杆冒险）；打完要放松，不能发那种力（杨帆第 17 局第 12 杆）；擦擦巧粉定定神（佟璐第 34 局第 4 杆说赵汝亮\"信心爆棚但节奏有点快\"）；别被解说/场外影响（柯秉逸第 18 局第 8 杆）。\n4. **节奏别跟着手感走快**：柯秉逸第 32 局第 9 杆\"郑肖淮这个步伐又出现了，走路突然变快，有点危险\"；党金虎第 33 局第 12 杆\"小亮的节奏非常仔细，不是故意磨，是我们要学的\"；党金虎第 36 局\"兄弟你就慢慢打，不用着急\"。\n5. **关键球出杆要坚定**：秦利文第 33 局\"需要强大的心脏和基本功\"、第 34 局第 13 杆\"谨慎再谨慎，冷静再冷静，即使手不听使唤大脑也要告诉自己坚定\"；薛珍麒第 17 局\"打了就得坚决，没进也没办法\"；压力下七成的球也会丢，丢了别想太多。\n6. **顺的时候别飘**：佟璐第 10 局\"两连大金对手就麻了，有时候自己也麻了\"；郑肖淮领先 19 分时踢 9（第 12 局）、领先时翻袋冒险（第 23 局）都是飘。柯秉逸第 26 局自省：\"比赛里看球远一点就想防，防多了自己也麻，手感来了就要连着拿金。\"\n7. **释放和降心率**：第 33 局赵汝亮挥拳（薛珍麒\"压抑四五个小时了，不释放很快就崩\"，秦利文\"挥拳是相信自己\"）；第 36 局郑肖淮喝水降心率再打 9 号。\n\n**常见分歧：**\n- 失误归因：第 17 局第 12 杆赵汝亮丢 9，薛珍麒、秦利文、杨帆归到压力和手感，党金虎\"不是紧张，这个球不好打\"，佟璐\"塞加多了打薄\"；第 24 局郑肖淮洗袋，秦利文归天气潮，薛珍麒、柯秉逸、杨帆归手紧，党金虎\"不可能麻\"。**教学上两边都要管：技术原因（塞多了、偷袋角）先改，心态用流程压住。**\n\n**本场正例：** 第 25 局郑肖淮手感不好先防再清台；第 35 局郑肖淮必须赢的一局手紧仍无一杆冒险；第 36 局手紧还敢拉低杆（佟璐\"还敢拉回去，硬啊\"）。\n**本场反例：** 第 34 局郑肖淮上手两次没处理好、脑子乱；第 24 局两边连着解球犯规、自由球洗袋。\n\n---\n\n## 十、六位主播都同意的硬规则清单\n\n下面每条至少三位主播在不同局明确说过、没有人反对，而且本场有正反例：\n\n1. **开球看\"失机\"不看进几颗**：白球不洗袋、2 号能看见、2 号能接上，三件套齐了才叫开得好。（第 7、17、22、25、31 局）\n2. **解球第一目标碰到不犯规，第二目标不漏**；拿不准别选最精细的那条路；选\"解不到也只是换人\"的方式，别选\"解不到就送自由球\"的扎杆。（第 7、13、16、25、33、36 局）\n3. **准度够就直接打，能传就传，别 K**；K 只在\"没袋 + 没替代 + 顺路 + 近\"时做。（第 10、13、17、32 局）\n4. **顺便踢 9 / 顺便 K 的杆别打**，一杆只带一个意图；只有 9 在袋口碰到就进才传 9。（第 12、20、25 局全败；第 13 局正例）\n5. **K 球的核心是力量：踢整颗不勾，K 完想好问题球不贴库、不 K 死、白球不吊住不贴库。**（第 6、21、22、24、29 局）\n6. **走位先规划后面再打眼前：问题球提前两杆铺路，选袋看下下一颗。**（第 6、9、22、26、29 局）\n7. **走位留一点角度别走直；角度刚好就定杆、留线不留点；近直球一律小力。**（第 7、8、9、16、19、26 局）\n8. **一点就能完的球别发力；一杆多走一颗后面两杆都得将就；简单球用最简单杆法。**（第 9、13、16、18、25、26 局）\n9. **局面乱、后面有必防的球、手感不好、分差小对手手热、时间紧领先——先防；防要贴死，重点是白球落点，别碰会漏的球。**（第 19、23、25、28、34、35、36 局）\n10. **没把握的球直接防不硬拼；能进的球别选防（防漏比不防糟）。**（第 23、34 局）\n11. **最后一颗、关键球不加花不发力过头，出杆坚定。**（第 15、17、33、36 局）\n12. **手紧时放慢节奏、回到基本动作、走最简单的路；别被领先或大金冲昏头。**（第 10、24、32、34、35 局）\n13. **会算账：大金 10 / 小金 7 / 普胜 4 / 犯规 1，落后方算时限，领先方磨时间。**（第 9、17、31、36 局）\n\n---\n\n## 附：六位主播各自的\"口头禅\"（方便以后听解说时对号）\n- 秦利文：攻防转换、\"防不贴死没意义\"、\"细节决定成败\"、低杆拉回、\"大力出奇迹\"（解球）。\n- 薛珍麒：先摆整盘思路、\"留什么角度\"、\"长解短好解\"、力量就是手上的力感、\"打了就坚决\"。\n- 柯秉逸：画线最准、\"难点就是二叫三\"、\"千万不能 K 完吊球\"、\"准度够不用 K\"、\"早晚得防\"、每局当决胜局。\n- 杨帆：心理博弈、\"打一颗防一颗\"、\"运气不会一直好\"、反对指劲精细解、\"这毛病犯了四五回\"。\n- 党金虎：踢整颗不要勾、\"白球锁在方格里\"、\"K 准就发力\"、\"不好打咱们就不打\"、大心脏。\n- 佟璐：失机、杆法原理（中杆塞才发挥、反塞减小分离角、高杆推目标球慢）、\"手感不好就不着急进攻\"、\"要算概率\"、\"倒不如直接打完\"。\n"}, {"题": "两位选手清台思路", "文": "# 两位选手清台思路：郑肖淮 vs 赵汝亮（独牙九球 200 万决赛，100:98）\n\n整理：2026-10-05。来源同《高手同频模型.md》：32 张卡片（第 5~36 局）、三个专题、统计汇总、错题本。第 1~4 局没录到，所以\"全场\"都指第 5 局以后。\n数字口径：失误规律专题（第 5~32 局）200 杆进攻丢 11 杆；开球专题（第 5~36 局）；比分按卡片。\n出处：第 N 局第 M 杆 = 卡片里的\"序\"；主播名字按原话。\n\n---\n\n## 一、郑肖淮（冠军，\"江左麒麟\"）\n\n### 1. 清台思路和习惯\n- **走位爱留角度、敢走大线**：下一杆平均切角 20°（赵汝亮 14°，失误规律专题）。第 26 局第 4 杆 4 叫 5 他选两库跑而不是立杆拉回，为的是让白球离 5 号近（薛珍麒）；第 16 局第 3 杆 2 叫 3 三条线里选第三条两库把 3 叫到底袋（柯秉逸\"这样也行，对他来说没问题\"）；第 9 局第 6 杆滑杆后推杆左塞两库补救到 9 号附近（秦利文\"整整好出圈，真高手\"）。\n- **选袋先看下下一颗**：第 26 局第 2 杆 2 叫 3 选底袋不选中袋，因为底袋好叫 4、走中袋要绕还有 7 挡（薛珍麒；佟璐画线和实际一模一样）。\n- **近球小力定杆点住是他最稳的一手**：第 8 局第 4 杆定杆（党金虎\"白球锁在方格里，这就叫专业\"）、第 9 局第 3~4 杆小低杆点住/蹬杆回来（薛珍麒看出是蹬杆\"击打的力\"）、第 10 局第 2 杆定杆往前蹬一点留向下角度、第 16 局第 6 杆定杆（党金虎\"角度刚刚好\"）。\n- **杆法：低杆为主，平时推杆派**。柯秉逸第 8 局：\"推杆派的今天怎么突然变低杆派了，他低杆太有力所以平常都打推杆。\"本场常用：低杆拉回（第 16、26、31、36 局）、高杆左塞一库把下一颗叫直（第 8 局第 3 杆，佟璐\"进球线叫直了下一杆一定就是 5 号位\"）、中低杆点左塞拉回不吃库（第 16 局第 7 杆）、中低杆蹬两库（第 32 局第 9 杆，六位叫\"硬\"）。\n- **力量偏大**：薄球大力（第 6 局第 7 杆 7 号，秦利文、薛珍麒、柯秉逸、党金虎、佟璐五人都说力大了，靠准度顶住）；最后一颗大力（第 17 局第 11 杆，柯秉逸\"他最后一颗都很大力\"）；大力进 2（第 33 局第 4 杆）；杨帆第 18 局\"以我对他的了解他喜欢大力\"。好处是准（柯秉逸第 8 局\"什么力道都准，有多难都能直接清台\"），坏处是走位多走一颗（第 13 局第 3 杆走多四五颗、第 16 局第 4 杆多吃一库、第 18 局第 4 杆多走一颗）。\n- **美式背景，思路和击打都好**（薛珍麒第 17 局\"肖淮打了很多美式，思路好击打也好，比我好太多\"）；长台准（第 31 局第 2 杆 1 号长台，党金虎\"真准\"）；跳球好（第 31 局第 4 杆轻跳进 3 号；薛珍麒\"他以前跳球就不错\"）。\n\n### 2. 攻防选择倾向：进攻型，但关键局会防\n- **默认进攻、爱清台**：杨帆第 32 局\"他满脑子想清盘，他喜欢打清盘\"；党金虎第 32 局两库翻底袋带防守是\"肖淮的招牌动作\"；第 6 局第 3 杆被防死选扎杆弧线进攻（秦利文\"不打没面子，防又不会防，我也是进攻\"）；第 11 局第 1 杆开球后 2 号没线路拼翻底袋（柯秉逸\"手感正热干脆拼\"）；第 25 局第 6 杆柯秉逸觉得该防，他低杆加塞拼进一路清台。\n- **领先时容易激进**：第 12 局领先 19 分打 2 踢 9（输局）、第 23 局分差 8 分 3 号翻袋（杨帆\"冲动\"、佟璐\"不听老人言\"）、第 34 局领先形势已失还 K9 + 翻底袋（秦利文\"就剩一二十分钟打这么激进干什么\"）。\n- **但他的防守质量很高，而且决定了冠军**：第 25 局第 4 杆手感不好先防，白球小低杆贴死 4 号（秦利文\"有点小严实\"、党金虎\"只有一条路\"）；第 24 局第 5 杆能进也防，多拿 1 分（秦利文\"这是他的聪明之处\"）；第 34 局第 9 杆 6 号反塞防守（党金虎\"临危不乱\"）；第 36 局第 1 杆决胜局低杆退一点贴 9 号防守逼出犯规（秦利文\"防了真硬\"）。赛后他自己说：\"小亮整体发挥比我好，我可能就是关键球、防守的运气好一点。\"\n\n### 3. K 球风格：少 K，爱传、爱闪\n- 主动 K 只有 2 杆（第 6 局 5K7、第 21 局 4K5），顺路 2 杆（第 21 局 2 刮 5、第 32 局解球带 K）。处理问题球首选**传球**（第 13 局 5 传 9、第 17 局 1 传 6，党金虎\"打得真聪明\"）和**发力闪过**（第 31 局第 3 杆高杆发力闪 7 号，薛珍麒\"轻推分离角小会 K 到\"）。\n- 毛病：K 到以后不管白球（第 21 局第 4 杆 K5 踢直了，党金虎\"这球不好直了吧\"）；该不该 K 判断偶尔错（第 34 局 K9 四位主播说不该）。\n\n### 4. 开球\n- 力量大（柯秉逸第 9 局\"开球很出力、球跑得飞快\"、第 28 局\"肖淮比较大力\"），手架立起来冲（薛珍麒第 32 局）。15 次开球：有球进 12、1 号进 12、空枪 3（第 7、17、33 局，原因是 1 号打厚）、洗袋 1（第 15 局）、平均进 1.2 颗、开球局自己赢 6、大金 3（第 9、10、26 局）。\n- 开得好的时候球型很顺（第 9 局佟璐\"大金面没难度\"、第 26 局柯秉逸\"没有一个库边\"）；柯秉逸第 11 局\"开球太牛了，下次要跟他学开球\"。空枪两次反而把对手防死（第 7、17 局）。\n\n### 5. 失误类型和出现的情境\n按失误规律专题 + 第 33~36 局卡片：\n| 类型 | 例子 | 情境 |\n|---|---|---|\n| 远台/薄球打薄或大力 | 第 17 局 9 号（大力打薄，领先 15）、第 21 局 7 号（薄球差一点，领先 22）、第 27 局 2 号（低杆发力袋口弹出，领先 13） | 都在领先时，而且都是\"大金/小金差一杆\" |\n| 想要的太多 | 第 12 局打 2 踢 9（领先 19）、第 24 局自由球偷袋角洗袋（胶着）、第 34 局 K9（胶着） | 领先飘或胶着急 |\n| 走位误差连锁 | 第 13 局 2 号走多→4 号走小→放弃小金；第 18 局 4 号劲大→5 薄切→6 没进；第 17 局 7 走直→8 没到位→9 丢 | 力量多一点，后面一杆传一杆 |\n| 判断失误 | 第 32 局 4 号硬闪打薄（薛珍麒\"这个判断你失误了\"）、第 34 局翻底袋 | 胶着/落后、脑子乱 |\n| 解球犯规 | 第 19 局两三库左塞解打偏、第 23 局低杆解三库差一点、第 28 局反塞解塞多了；佟璐第 28 局\"小淮是五个犯规\" | 这是他最明显的短板，佟璐\"一防人家就能得分\" |\n| 器材/动作 | 第 9 局滑杆（皮头干）、第 36 局手紧低杆不敢打改中杆、第 27 局柯秉逸\"今天把动作掉了\" | 关键局 |\n\n### 6. 状态曲线（按比分 + 主播评语）\n- **第 5~10 局：热**。第 6 局扎杆解球+清台，第 8 局自由球清台（薛珍麒\"这球我也能打完\"），第 9、10 局二连大金 44:21（柯秉逸\"他现在手感正热\"；柯秉逸\"什么力道都准\"）。\n- **第 11~16 局：平稳偏保守**，拉锯。第 11 局翻袋没进，第 13 局\"几杆没调回来\"（薛珍麒）但传 9 拿分，第 14 局换人，第 15 局开球洗袋，第 16 局接手清台。\n- **第 17~18 局：出现波动**。第 17 局 9 号丢（薛珍麒\"小淮前两天打的不掉，还是有压力\"），第 18 局薛珍麒\"今天白球的力感没有很好\"，但两局都赢，61:38 领先 23。\n- **第 19~24 局：被追**。第 19 局解球犯规，第 21 局 7 号差一点大金，第 23 局冲动翻袋+解球犯规，第 24 局自由球洗袋（佟璐\"小淮这会手凉了\"，柯秉逸\"两个都紧了\"），66:67 被反超。\n- **第 25~26 局：回暖**。第 25 局先防后清，第 26 局大金 80:67（柯秉逸\"他的手感又来了\"）。\n- **第 27~30 局：低谷**。第 27 局丢大金，第 28 局解球犯规（佟璐\"小淮为什么状态这么差，昨天也特别差\"），第 30 局跳球失手（佟璐\"紧张了，力量都没用对\"），80:90 落后 10。\n- **第 31~32 局：顶住**。第 31 局小金（薛珍麒\"这球要打严谨一点\"），第 32 局中低杆蹬两库\"硬\"反超 91:90（柯秉逸提醒\"步伐变快有点危险\"）。\n- **第 33~34 局：乱**。第 33 局进 2 没接上，第 34 局 K9 失误 + 翻底袋（秦利文\"大脑有点凌乱\"），91:98。\n- **第 35~36 局：手紧但零冒险**。第 35 局必须赢的一局每杆只求能打下一颗（佟璐\"有点懵懂了，控力多难\"），第 36 局防守+清台夺冠，走位偏直但敢拉低杆（佟璐\"还敢拉回去，硬啊\"），党金虎\"大心脏，几点都不晃\"。\n\n---\n\n## 二、赵汝亮（亚军）\n\n### 1. 清台思路和习惯\n- **走位更直、更保守、小范围**：下一杆平均切角 14°。典型是第 27 局（低杆拉回、低杆左塞、中低杆左塞一路小范围走位，党金虎\"这时候走得好，我也是这样走\"）、第 15 局自由球 7 颗一杆清（每杆只用推一库、低杆一库，杨帆\"高手对抗这种球绝对不允许打没\"）、第 12 局顺球全程轻推一库（薛珍麒\"点超轻\"）。\n- **留角度靠\"顿一下、横一下\"**：第 7 局第 5 杆中低杆左塞顿住留角度（佟璐\"不要叫直\"）、第 7 局第 6 杆小低杆一横（佟璐\"好球\"）、第 21 局第 8 杆小低杆一横带小弧线（佟璐\"小亮这个打法就应该这样\"）、第 30 局第 6 杆低杆右塞打厚一点停住留角度（杨帆\"漂亮的撇杆，这个塞拿捏的\"）。\n- **会用塞走大线**：第 7 局第 10 杆中杆多左塞两库把 8 叫直（六位叫好，佟璐专门讲为什么用中杆不用高杆）、第 11 局第 5 杆低杆右塞甩四库（党金虎\"进球线和白球中心点定好，发力就好，其他交给球台\"）、第 22 局第 2 杆 2 号中袋走两库（柯秉逸\"基本功的展现\"）。\n- **击打环节最稳**：薛珍麒第 7 局\"小亮击打环节一点问题没有\"、第 29 局\"击打环节直接做就行\"；佟璐第 33 局\"击打环节第一人\"；党金虎第 29 局\"他打动球很厉害，而且是不咋下塞的那种打进\"；柯秉逸第 33 局\"关键之后的准度真的很准很稳定，越紧张表现越好\"。\n- **贴库/难球敢发力**：第 22 局第 8 杆 8 号贴库高杆推两库发力（薛珍麒\"这是真敢打\"）；第 30 局第 4 杆白球贴库 2 号低杆右塞横台（薛珍麒\"打得很硬\"）；第 29 局第 7 杆 7 号下塞发力。\n- **节奏仔细、出杆快**：党金虎第 33 局\"小亮的节奏非常仔细，不是故意磨\"；柯秉逸第 25 局\"连开球都没在运杆\"。\n\n### 2. 攻防选择倾向：务实，防守是强项，关键时也敢拼\n- **先务实**：第 6 局第 2 杆开球后 2 号没线路轻薄一下做防守（秦利文\"打得务实，合理性极高\"，党金虎\"防得太好\"）；第 28 局第 2 杆落后 9 分放弃翻中袋拼大金，选防守（秦利文看完改口\"好的防守跟进攻一样\"）；第 23 局第 9 杆 8 号不硬拼低杆防吊死对手（杨帆\"高级\"）；第 34 局第 10 杆 8 号不好打先防（党金虎\"聪明人干聪明事\"）；第 35 局第 2 杆领先防守（薛珍麒\"领先有领先的打法\"）。\n- **防守质量高**：第 19 局第 11 杆把白球藏到 9 号后面还顺手开 6 号（六位齐叫好）；第 28 局第 7 杆把 3 藏到 4 后面逼出犯规；第 32 局第 4 杆贴死 6 号后面（佟璐\"胆真大，还真摞上了\"）；第 34 局第 2 杆推杆一粘藏 6 号后（佟璐\"这谁画的线啊，画这么准\"）。\n- **关键时敢拼而且拼得准**：第 11 局第 2 杆贴库 2 号想了近 3 分钟低杆强攻（柯秉逸\"太犀利\"）；第 29 局第 2 杆薄中袋+顶 3（主播都说只能防）；第 22 局逆境扎杆+贴库发力拿大金；第 33 局第 2 杆跳进被挡的 1 号。\n- **胶着时容易两头想**：第 18 局第 7 杆进 6 又想藏白球（佟璐\"这啥防守\"）；第 25 局第 2 杆打 2 又想踢 9（柯秉逸\"分心了\"）；第 32 局第 8 杆长考后打厚（柯秉逸\"看不懂是攻是防\"）；第 34 局第 4 杆 2 号能打却防漏了（杨帆\"这防守太刺了，不如往里打完\"）。\n\n### 3. K 球风格：敢 K、K 得准，力量档不稳\n- 主动 K 3 杆（第 22 局 6K8、第 29 局 2K3、5 踢 7），被迫 1（第 24 局 2K3），顺路 2（第 19 局防守开 6、第 28 局想带 8），踢 9/找 9 三次（第 20 局两次、第 25 局）。\n- 教科书：第 29 局第 2~4 杆（小力低杆刹车顶 3；3 号右塞铺路；5 吃库踢 7 整颗）。\n- 毛病在力量：第 22 局 K8 太轻吊球（柯秉逸\"千万不能 K 完吊球\"）、第 24 局 K3 太大（六位都喊大了，党金虎\"判断性失误\"）、第 29 局踢 7 稍大（柯秉逸、佟璐\"踢大了\"）。\n- 踢 9 三次全败，输掉第 20 局（秦利文\"这局就这球输的\"；佟璐\"倒不如直接打完\"）；杨帆第 25 局\"这种毛病今天犯了四五回\"。\n\n### 4. 开球\n- 出杆快不运杆（柯秉逸第 25 局），力量偏小（柯秉逸第 28 局\"力道小了点\"），\"这开球没有低杆，球都跑了\"（杨帆第 28 局）。17 次开球：有球进 15、1 号进 14、空枪 1（第 31 局）、洗袋 2（第 8、30 局）、平均进 1.6 颗（第 5 局一次进 1、2、3、4）、开球局自己赢 9、大金 3（第 5、22、29 局）。\n- 状态起伏：第 16~19 局\"冲球运气不好\"（薛珍麒）、柯秉逸第 15 局\"小亮开完球球形都不好没什么金面\"；第 24 局起\"冲球好起来了\"（薛珍麒），党金虎第 28、29 局\"小亮的冲球现在真好\"。开完 2 号常卡在库边/袋口（柯秉逸第 34 局\"今天的开球 2 号每一盘都卡在这\"）。\n\n### 5. 失误类型和出现的情境\n| 类型 | 例子 | 情境 |\n|---|---|---|\n| 踢 9 / 找 9 | 第 20 局 5 找 9、6 两库找 9（落后 18）；第 25 局打 2 想踢 9/8（胶着） | 落后急、胶着贪 |\n| K 球力量 | 第 22 局太轻、第 24 局太大（大金泡汤）、第 29 局稍大 | 大好局面下控力 |\n| 开球后 2 号难球搏 | 第 20 局 2 号中低杆右塞传 9 打薄、第 23 局 2 号软塞搓没进 | 2 号随机难球 |\n| 翻袋打薄 | 第 18 局第 8 杆 7 号翻袋打薄留好球（柯秉逸\"该打一个防一个\"） | 走神（秦利文\"打得有点走神\"） |\n| 解球解薄漏 | 第 13 局解半颗漏（杨帆\"勾的方位不对\"）、第 14 局第 3 杆、第 16 局解 2 带 4 打薄、第 33 局两次、第 35 局 | 他爱精细解，小力精细解最容易漏 |\n| 解球犯规 | 第 17 局一库解没到、第 24 局左塞解没碰到、第 36 局扎杆扎过头（丢冠军） | 决胜局选了最不该选的扎杆（党金虎、柯秉逸事前都反对） |\n| 攻防不定 | 第 32 局 5 号打厚、第 34 局 2 号该攻选防漏 | 决胜阶段压力 |\n| 关键 9 号 | 第 17 局第 12 杆七成的 9 打薄（佟璐\"塞加多了\"） | 压力 |\n\n### 6. 状态曲线\n- **第 5~7 局：紧但准**。第 5 局大金但四杆走位都不精准（薛珍麒\"看得出来紧，真紧\"，党金虎\"没敢发力\"）；第 7 局七杆清台小金，7 号多塞两库全场叫好。\n- **第 8~10 局：被压**。第 8 局开球洗袋，第 9、10 局对手二连大金，21:44 落后 23。\n- **第 11~15 局：追分四连胜**。第 11 局贴库强攻清台，第 12 局、第 14 局、第 15 局接手清台，38:48。\n- **第 16~19 局：开球运气差、被压着打**。柯秉逸\"小亮一直没什么好机会上手，开球运气不好\"；第 17 局丢七成的 9 号（秦利文\"手感不咋好\"）；第 18 局翻袋打薄（秦利文\"走神\"）；第 19 局靠防守逼犯规赢，43:61 落后 18。\n- **第 20~21 局：急**。第 20 局三次找 9 全败，第 21 局柯秉逸\"小亮稍微有点不自然，心里没有很轻松\"。\n- **第 22~24 局：硬打追回**。第 22 局难球型大金（薛珍麒\"真敢打\"），第 23 局防守赢，第 24 局反超 67:66（柯秉逸\"小亮几乎没什么金，硬把比分又拉回来\"；党金虎第 24 局\"小亮手一不高兴，脸像要流泪似的\"）。\n- **第 25~27 局：胶着**。第 25 局分心丢 2 号，第 26 局被打大金，第 27 局接手清台 71:80。\n- **第 28~30 局：最好的阶段**。第 28 局防守赢，第 29 局薄中袋+K7 大金首次反超 86:80（佟璐\"上来一直被压着打，终于超分\"；杨帆看出他紧张\"屁股都顿一下\"），第 30 局发力传 6 蒙进后清台 90:80。\n- **第 31~32 局：开球空枪送小金，被反超**。第 32 局 5 号长考打厚（柯秉逸\"压力很大、累\"）。\n- **第 33~34 局：再反超**。第 33 局跳进 1 号、边库 8 硬打、关键 9 大力顶住挥拳（薛珍麒\"释放压抑了四五个小时的情绪\"），第 34 局防守+跳球 98:91。\n- **第 35~36 局：领先被翻**。第 35 局防守传 6 进袋把自己堵住、解薄；第 36 局扎杆犯规被绝杀（柯秉逸\"对小亮来说这真的是感觉快要赢的比赛\"）。赛后只说\"下次努力啊\"。\n\n---\n\n## 三、两人对比\n\n### 同样局面处理哪里不同\n| 局面 | 郑肖淮 | 赵汝亮 | 主播怎么看 |\n|---|---|---|---|\n| 开球后 2 号没线路 | 拼翻袋（第 11 局）、两库翻底带防（第 32 局）、决胜局防（第 36 局） | 防（第 6、28、34 局）、传 9（第 20 局）、搏（第 23 局）、极薄也拼（第 29 局） | 赵更务实，郑更敢；但决胜局郑的防守是全场最关键的一杆 |\n| 问题球 | 传（第 13、17 局）、发力闪（第 31 局）、少 K | 提前铺路后 K（第 22、29 局） | K 球专题：\"赵更爱 K、K 得也更好；郑更爱传和闪\" |\n| 贴库/直球难球 | 低杆猛拉\"有多大劲使多大劲\"（第 34 局 3 号） | 低杆右塞横台只求硬（第 30 局 2 号）、高杆推两库发力（第 22 局 8 号） | 两人都敢发力，郑靠拉、赵靠塞和推 |\n| 走位 | 留角度大、走两库到大区域、力量偏大 | 走直走小、小力顿住横一下、靠塞补角度 | 失误规律：郑 20°、赵 14°；赵前段\"紧\"走位偏小 |\n| 解球 | 两库解漂亮（第 34 局）、扎杆弧线（第 6 局），但犯规 5 次 | 精细解、解薄漏多（第 13、16、33、35 局），犯规 3 次含决胜扎杆 | 佟璐：\"小淮解球失误太多\"；杨帆：\"别装高手指劲勾\" |\n| 收尾 9 号 | 大力（第 17 局丢） | 大力（第 33 局顶住） | 柯秉逸：\"关键 9 号他们都打很大力，我们一定轻点低戳\" |\n| 领先时 | 容易飘（第 12、23、34 局） | 稳、磨时间（第 30、35 局） | 柯秉逸：\"谁领先谁失误\" |\n| 落后时 | 顶住（第 31 局小金、第 35 局零冒险） | 硬打追回（第 22~24 局）、第 20 局急 | 两人都有韧性 |\n| 跳球 | 第 30 局没进、第 31 局进 | 第 19 局进、第 33 局进、第 34 局进 | 赵本场跳得更准 |\n\n### 各自强在哪\n- **郑肖淮**：击打准（大力小力都准）、长台、低杆力量、跳球、心脏大（决胜局手紧还敢拉低杆、会等读秒）、关键防守质量高、处理问题球干净（传球）。短板：解球犯规、领先时激进、顿杆打成低杆拉多（薛珍麒第 8 局）、走位力量偏大。\n- **赵汝亮**：开球更强（进球多、开球局赢得多）、小力走位细腻、击打稳定（主播口中\"击打环节第一人\"）、防守布局硬、K 球有布局、关键球大力准、节奏仔细、韧性强（几乎没金也能硬追）。短板：K 球力量档不稳、胶着时加意图（踢 9、分心）、精细解易漏、决胜局解球方式选错。\n\n### 一句话\n两人准度一样（失误规律：郑丢 6/95、赵丢 5/105，差别在误差内）。**赢在决策和关键一杆**：郑肖淮决胜局选了\"防到对手犯规就赢\"的最稳路线，赵汝亮选了\"扎过头包漏\"的最险解法。冠军自己也说赵汝亮发挥更好。\n\n---\n\n## 四、经典局清单（卡片标\"经典\"的 19 局，每局一句为什么）\n\n| 局 | 赢家/结果 | 为什么经典 |\n|---|---|---|\n| 6 | 郑肖淮 普胜 19:14 | 被防死扎杆弧线解球还传进 6 号，之后提前两杆布局 5K7，两颗薄球一大力一小劲都进（\"这是什么棍法\"） |\n| 7 | 赵汝亮 小金 20:21 | 开局被挡解球不漏、对手翻袋进 1 却失手，七杆清台；7 号中杆多左塞两库把 8 叫直是六位齐声叫好的一杆 |\n| 11 | 赵汝亮 普胜 44:25 | 四位主播都要防的贴库 2 号，想了 3 分钟低杆强攻打进，之后小力定位+低杆右塞四库，\"什么时候该赌进攻\"的样板 |\n| 17 | 郑肖淮 普胜 57:38 | 自由球先用 1 号把挡袋口的 6 号传进（问题球处理教科书），后半段两人连丢两个 9 号展示走位误差连锁和决赛压力 |\n| 19 | 赵汝亮 普胜 61:43 | 5 次换人的拉锯局：跳球、来回防守、跳进 3 号、白球藏 9 号后面逼出犯规、自由球清台，\"打不了就防、防要防死\"的完整样板 |\n| 20 | 郑肖淮 普胜 65:43 | 反面教材：赵汝亮三次找 9 全失败把普胜送人，六位对\"传 9 还是打完\"讨论最细 |\n| 21 | 赵汝亮 普胜 65:47 | 问题球教材：郑肖淮打 2、打 4 两次顺路 K 贴库的 5 号，6 叫 7 力量没控住差一丢丢大金 |\n| 22 | 赵汝亮 大金 65:57 | 难球型大金：三杆为 6K8 铺路，K8 出意外被吊，用扎杆+贴库发力推两库硬打回来（\"还敢用力耶\"） |\n| 23 | 赵汝亮 普胜+1 65:62 | 防守赢球样板：8 号没把握一杆低杆防把对手吊到犯规；反面是郑肖淮分差 8 分冲动翻袋 |\n| 25 | 郑肖淮 普胜 70:67 | 手感发紧靠防守拿回主动：进 2 没叫好直接贴死 4 号→对手解到但漏→3 号敢拼低杆加塞→一清到底 |\n| 26 | 郑肖淮 大金 80:67 | 开球后一杆清台范本：2 叫 3 选底袋因为好叫 4、4 叫 5 走两库让白球离 5 近、5~7 都留一点角，佟璐每杆画线都和实际一样 |\n| 28 | 赵汝亮 普胜+1 80:76 | 难局面靠防守赢：落后 9 分放弃翻袋拼金改防、K4 失手补轻防、把 3 藏到 4 后逼出犯规、自由球清台 |\n| 29 | 赵汝亮 大金 80:86 | 全场最精彩一杆：极薄 2 号中袋小力刹车+顶 3；3 号右塞铺路→5 踢 7 整颗；6 号不留翻袋两库叫直；落后 4 分打出大金首次反超 |\n| 31 | 郑肖淮 小金 87:90 | 落后 10 分拿到小金机会，2 号走位出事被挡，轻跳跳进 3 号救回，5 号推一库还是蹬两库有分歧、7 号走大用右塞补救 |\n| 32 | 郑肖淮 普胜 91:90 | 一局攻防转换四次：两库翻底带防、借球进攻、贴 6 号后斯诺克、带 K 解球进 3、两次关键失误，最后从 5 号清台反超 |\n| 33 | 赵汝亮 普胜 91:94 | 决胜阶段拉锯：跳进被挡的 1 号、三次解球防守交替、8 号问题球（6 借 8、7K8、边库 8 硬打）、关键 9 号大力顶住挥拳 |\n| 34 | 赵汝亮 普胜 91:98 | 攻防转换最多：藏球防守、两库解球、防守漏球、直球猛拉、K9 失误、跳球进 6、翻底袋赌一把，\"9 号该不该 K\"\"最后一杆翻还是防\"最典型 |\n| 35 | 郑肖淮 普胜 95:98 | 领先方时间压力下防守被运气反噬（3 传 6 进袋把自己堵死），落后方必须赢的一局手紧仍无一杆冒险 |\n| 36 | 郑肖淮 普胜+1 100:98 | 决胜局：落后 3 分剩 7 分钟，一杆贴 9 号防守逼出扎杆犯规，手紧走位偏直仍一杆清台，等读秒收 9 夺冠 |\n\n不算经典但有教学价值的：第 5 局（球台滑、走位连续不精准靠准度顶）、第 8 局（自由球摆位+定杆）、第 9 局（滑杆后两库补救）、第 10 局（要不要 K 的讨论）、第 12 局（踢 9 的代价+解球要解薄）、第 13 局（走位连续不到位时果断传 9）、第 14 局（薄防守没防死、翻袋贴死）、第 15 局（自由球 7 颗平稳清）、第 16 局（解 2 带 4 vs 大力解）、第 18 局（力量多一颗后面两杆将就）、第 24 局（顺路 K 球力量+手紧失误样本）、第 27 局（袋口有阴影薄球该高杆推）、第 30 局（跳球心态+发力传球）。\n"}, {"题": "教学要点", "文": "# 教学要点（给南哥的学员用，从独牙九球决赛 郑肖淮 100:98 赵汝亮 提炼）\n\n整理：2026-10-05。来源：32 张逐杆卡片（第 5~36 局）、《高手同频模型.md》、《两位选手清台思路.md》、`专题/失误规律.md`、`专题/K球专题.md`、`专题/开球专题.md`、`predict/预判错题本.md`、`predict/建议清单.md`。\n出处：第 N 局第 M 杆 = 卡片里的\"序\"。\n排序原则：越靠前的越是\"六位主播一致 + 本场直接决定输赢 + 普通学员最容易做到\"。\n\n---\n\n## 一、20 条可以直接练、直接用的要点\n\n### 第一档：决定输赢的决策（1~6）\n\n**1. 没线路、时间紧、分差小的时候，先防一杆。防到对手犯规就是 1 分加自由球。**\n- 为什么：独牙犯规送 1 分加自由球，一杆好防守的期望值常常比五成的进攻高（秦利文第 24 局第 5 杆\"防一杆得分率高\"）。局面乱、后面有必防的球，\"早晚都得防，不如现在就防\"（秦利文、柯秉逸、佟璐第 19 局第 5 杆）。\n- 本场例子：第 36 局第 1 杆郑肖淮决胜局低杆退一点贴 9 号防守，赵汝亮扎杆犯规，郑肖淮自由球清台夺冠。反例：第 34 局第 12 杆郑肖淮翻底袋（佟璐\"翻进只有四五成，防守最合理\"）。\n- 怎么练：摆 10 个\"开球后 2 号没线路\"的球形，每个先做一杆防守（白球藏到最近的球后面，目标球打到远库），记录对手（陪练）能不能一杆解到；再做一杆进攻，比两边的得分。\n\n**2. 防守的重点是白球落点，不是目标球；\"别碰到会漏的球\"比\"做得多死\"重要。**\n- 为什么：柯秉逸第 34 局第 2 杆\"重点不是 2 号是母球，白球一定要来这个地方\"；第 36 局第 1 杆\"绝对不能敲到 7 号，2 号一定要打准，不要想做得很死\"。防漏了比不防还糟（杨帆第 34 局第 4 杆\"这防守还不如往里打完\"）。\n- 本场例子：第 19 局第 11 杆赵汝亮把白球藏到 9 号后面只剩一条解球线（六位齐叫好）；第 25 局第 4 杆郑肖淮小低杆贴死 4 号。反例：第 14 局第 1 杆郑肖淮薄防守\"滑出来\"给了翻袋；第 32 局第 4 杆赵汝亮贴 6 号后面刁的位置\"用力了差一点\"（柯秉逸：简单的那边一定防得到）。\n- 怎么练：防守练习只记白球落点：画一个 20 厘米的圈，10 杆里白球几杆停进圈；目标球去哪不计分。\n\n**3. 一杆只带一个意图：打 2 就专心打 2，\"顺便踢 9 / 顺便 K / 顺便藏\"的杆别打。**\n- 为什么：本场\"顺便踢 9\"4 杆全失败，直接输 2 局（K 球专题）。柯秉逸第 25 局第 2 杆\"专心打二，九的没进就算了\"；佟璐第 20 局\"倒不如直接打完\"；杨帆\"这种毛病今天犯了四五回\"。压力下先坏的不是准度，是\"想要的太多\"（失误规律专题第 4 条）。\n- 本场例子：第 12 局第 2 杆郑肖淮打 2 踢 9（9 踢薄、3 打不到、输局）；第 20 局第 7、8 杆赵汝亮两次找 9；第 18 局第 7 杆赵汝亮进 6 又想藏白球（佟璐\"这啥防守这是\"）。只有第 13 局第 6 杆那种 9 在袋口\"碰到就进\"才传 9。\n- 怎么练：教练在摆球时故意把 9 放在\"看着能顺手碰到\"的地方，学员每杆出杆前说出\"这杆的唯一目标是 X\"，碰了 9 不算分。\n\n**4. 解球第一目标是碰到不犯规，第二目标是不漏；拿不准就别选最精细的那条路，别在关键局扎杆。**\n- 为什么：犯规 = 送 1 分 + 自由球（柯秉逸第 17 局算账\"犯规 1 分加小金 7 分就是 8 分\"）。小力精细解最容易漏（第 13、16 局，杨帆\"别装高手指劲勾，不如大劲一打\"）；扎杆扎过头包漏（党金虎、柯秉逸第 36 局第 2 杆）。\n- 本场例子：第 36 局第 2 杆赵汝亮扎杆扎过头犯规被绝杀；第 34 局第 3 杆郑肖淮中杆蹬两库解 2 号\"一下解死俩\"（秦利文）。郑肖淮全场解球犯规 5 次是他最大的短板（佟璐第 28 局）。\n- 怎么练：薛珍麒口诀\"长解短好解、短解长不好解\"。摆 10 个被挡球形，每个只准用\"解到也不漏、解不到也只是换人\"的方式（一库、两库），记犯规次数；扎杆、跳球另开专项，距离近才扎（薛珍麒第 22 局\"近扎还好，远就不好扎\"）。\n\n**5. 领先了稳着打，手紧了先防，别飘；落后了也不赌，先要上手机会。**\n- 为什么：薛珍麒第 35 局\"领先有领先的打法，一定不要攻一定是防\"；佟璐第 25 局\"手感不好就不着急进攻\"；柯秉逸第 28 局\"今天谁领先谁失误\"。落后时真正的拼是\"打得进也走得开\"的拼（第 29 局），不是赌翻袋（秦利文第 34 局\"你现在需要的是机会，珍惜每一次上手\"）。\n- 本场例子：第 25 局郑肖淮手感不好先防再清台；第 28 局赵汝亮落后 9 分放弃翻袋拼金选防，秦利文看完改口\"好的防守跟进攻一样\"。反例：第 12 局领先 19 分踢 9、第 23 局分差 8 分冲动翻袋（杨帆\"冲动了\"）。\n- 怎么练：练习赛规定\"领先 5 分以上，没有八成把握的球必须防\"；每局结束学员自己说一句\"这局我飘了没有\"。\n\n**6. 要会算账和算时间：大金 10 / 小金 7 / 普胜 4 / 犯规 1；落后方算时限，领先方磨时间。**\n- 为什么：第 31 局一个小金就把 10 分追到 3 分；第 36 局郑肖淮喝水等读秒再收 9，不给对手再开一局（党金虎\"你打这么快还得打一盘\"）；杨帆赛前就说\"郑肖淮得算时间\"。柯秉逸第 9 局：\"滑杆要是白球飞出去等于丢 15 分。\"\n- 本场例子：第 36 局第 10 杆；第 13 局第 6 杆郑肖淮小金没希望果断 5 传 9 拿 4 分（薛珍麒\"四分也四分\"）。\n- 怎么练：每次练习赛用独牙计分和计时，学员每局开球前报一遍\"现在差几分、剩几局、这局我要什么\"。\n\n### 第二档：走位的硬功夫（7~13）\n\n**7. 先规划后面再打眼前：开打前把整盘路线摆出来，选袋看下下一颗。**\n- 为什么：薛珍麒第 9 局第 1 杆\"先把四号规划好，再看三号留什么角度\"；第 26 局第 2 杆 2 叫 3 选底袋因为底袋好叫 4、走中袋要绕还有 7 挡；佟璐第 24 局开局就把 2 到 9 每杆杆法画完。\n- 本场例子：第 26 局郑肖淮大金，佟璐从 2 号起每杆画线都和实际一样。反例：第 13 局第 3 杆 2 叫 3 没叫好被柯秉逸定为整局败笔。\n- 怎么练：开球后不许立刻趴下，先用手指从 2 号指到 9 号把每颗的袋和白球停区说一遍，教练对照主播式\"画线\"核一次再打。\n\n**8. 走位留一点角度别走直；角度刚好就定杆，白球留在\"一条线\"上不留一个点。**\n- 为什么：秦利文第 19 局第 13 杆\"高手走位尽量不走直，走直影响下一颗走位\"；走直了就只能靠加塞拼分离角，白球容易起跳出线（第 17 局第 9~10 杆）。但角度刚好时定杆最稳（薛珍麒第 16 局第 6 杆\"只要在这条线上都挺好\"）。柯秉逸\"二分法\"：白球留在进球线的一侧就都好（第 10 局第 3 杆）。\n- 本场例子：第 7 局第 5~9 杆赵汝亮从 2 到 6 每杆主播都喊\"别太直\"；第 26 局第 5~7 杆郑肖淮 5、6、7 都留一点角（佟璐\"太得劲了\"）。反例：第 36 局第 6~8 杆郑肖淮手紧连着两杆走直。\n- 怎么练：三颗球的小清台，要求每一杆停下来后白球到下一颗的切角在 10°~30° 之间，直了或大了都重摆。\n\n**9. 近球一律小力：定杆、小低杆点住、蹬一点点；一点就能完的球别发力。**\n- 为什么：柯秉逸第 9 局第 3 杆\"不要太大力，大力容易失误\"；秦利文第 16 局第 4 杆\"花这么大力干啥，一点就完了\"；薛珍麒第 18 局\"力量就是白球多走一颗少走一颗\"，多走一颗后面两杆都得将就。失误规律专题：力量\"大\"的杆 41% 走位被挑毛病，\"小\"的只有 16%。\n- 本场例子：第 8 局第 4 杆郑肖淮定杆（党金虎\"白球锁在方格里，这就叫专业\"）；第 12 局赵汝亮顺球全程\"点超轻\"。反例：第 18 局第 4 杆郑肖淮 4 号劲大多走一颗→5 薄切→6 没进。\n- 怎么练：薛珍麒第 9 局的\"击打的力蹬回来，别纯拉\"。练 20 杆近直球，白球移动不超过一颗球算合格。\n\n**10. 一库比两库稳，高杆推比低杆拉稳；但大角度只能两库，别指望一库回来。**\n- 为什么：失误规律专题：一库最稳、两库开始飘；纯高杆/推杆 17 杆只 1 杆走位差，含低杆的 20~40%，低杆的毛病集中在\"拉多了/拉少了\"。薛珍麒第 29 局第 5 杆：大角度白球撞库太快、低杆来不及发挥，必须两库。秦利文第 10 局\"角度小两库误差大，高手选一库\"。\n- 本场例子：第 15 局赵汝亮自由球 7 颗全用推一库/低杆一库平稳清完；第 16 局第 5 杆郑肖淮高杆纯推不下塞走中线（党金虎\"点越高越好\"）。反例：第 8 局第 5 杆郑肖淮顿杆打成低杆拉多了（薛珍麒\"今晚最常见的失误\"）。\n- 怎么练：同一颗球用\"高杆推一库\"和\"低杆拉一库\"各打 10 杆，量白球停点的散布，自己看哪种更稳；南哥\"中力最稳\"的口径用这个验证。\n\n**11. 两库靠加塞、一库靠大力；要走大线用中杆多塞，不用高杆。**\n- 为什么：秦利文第 7 局第 10 杆\"两库得加左塞，一库得发挺大力\"；佟璐同杆：\"高杆白球顺着走塞发挥不出来，中杆白球横着吃库塞才起作用，分离角大得多\"；台滑打空转时塞要加得比平时强（佟璐）。\n- 本场例子：第 7 局第 10 杆赵汝亮中杆多左塞两库把 8 叫直（六位叫好）；第 11 局第 5 杆低杆右塞甩四库（党金虎\"进球线和白球中心点定好就发力，其他交给球台\"）。这正是我们 AI 教练做不出来的线（错题本第 2 题）。\n- 怎么练：固定一颗 7 号有点直又远的球形，练\"中杆多左塞两库回台中\"，20 杆里白球停进台中 30 厘米圈几杆。\n\n**12. 分离角上有球挡路时别轻推（会 K 到）；想躲球用反塞减小分离角。**\n- 为什么：薛珍麒第 31 局第 3 杆、第 32 局第 9 杆\"轻推分离角会变小就会 K 到，要么发力闪过，要么换线路\"；佟璐第 25 局第 2 杆\"下反塞减小分离角，下左塞一定碰住 9\"。\n- 本场例子：第 31 局第 3 杆郑肖淮高杆发力闪 7 号（思路对，打厚了走位出事）；第 32 局第 9 杆郑肖淮中低杆蹬两库被六位叫\"硬\"。\n- 怎么练：摆一颗挡在分离角上的球，分别用轻推、发力推、反塞三种打，看白球哪种能躲开，记下来。\n\n**13. 走坏了别硬做完美位置：推杆带塞两库到大区域、走大了用塞抓住、走直了老实低杆拉回叫底袋。**\n- 为什么：柯秉逸第 36 局第 4 杆\"不要硬要做到完美位置，失误率会高\"；秦利文第 9 局第 6 杆\"推杆带左塞两库到大区域，整整好出圈\"；佟璐第 31 局第 8 杆\"走多了右塞应该能抓住\"。\n- 本场例子：第 9 局第 6 杆郑肖淮滑杆后补救；第 36 局第 7~9 杆走不了中袋就叫底袋，直了就低杆拉回。\n- 怎么练：教练故意把白球摆到\"不理想但有球\"的位置，学员只准选成功率最高的一条，不准选最漂亮的。\n\n### 第三档：问题球、K 球、特殊球（14~17）\n\n**14. 问题球提前两杆铺路；能传就传、准度够就直接打，都不行才 K；K 要早、要选角度最好的那杆。**\n- 为什么：秦利文第 6 局第 5 杆\"高手思路都一样\"（打 3 停住留 5K7 的角度）；薛珍麒第 17 局\"传六比 K 三稳当\"；柯秉逸第 10、32 局\"准度够不用 K，那是我们准度不够才想踢开\"；柯秉逸第 33 局\"6 号那杆就该 K，拖到 7 号角度不好\"。\n- 本场例子：第 29 局第 3~4 杆赵汝亮 3 号右塞铺路→5 踢 7；第 17 局第 3 杆郑肖淮 1 传 6（党金虎\"打得真聪明\"）。反例：第 34 局第 8 杆郑肖淮 K9（四位主播：翻袋包进不该 K）。\n- 怎么练：摆一颗贴库问题球，让学员先说出三个选项（传 / 直接打 / K / 翻 / 防）各自的把握，再选；K 的话要指出\"哪一杆 K、从哪个方向\"。\n\n**15. K 球的核心是力量：踢整颗不要勾，不能太轻（吊球）也不能太大（跑远）；K 之前先画问题球和白球各停哪。**\n- 为什么：K 球专题 6 杆 K 里 4 杆败在力量。党金虎第 29 局第 4 杆\"一定要踢整颗不要勾，一勾白球就停住了\"；柯秉逸第 22 局第 6 杆\"千万不能 K 完吊球\"；薛珍麒的\"三不\"：问题球不 K 死、不贴库、白球不贴库；杨帆第 6 局第 6 杆\"先预判杆法再预判 K 的位置和效果\"。\n- 本场例子：第 29 局第 2 杆赵汝亮小力刹车顶 3（全场最好的 K）；反例：第 24 局第 2 杆赵汝亮 K3 发大力大金泡汤，第 21 局第 4 杆郑肖淮 K5 踢直了。\n- 怎么练：固定一个 K 球球形，用三档力量各打 10 杆，记录问题球停点和白球停点，找出\"刚好\"的那一档；把 K 完\"踢直了\"也算失败。\n\n**16. 跳球：跳白球正中、不带旋转、跳近一点、硬杆；跳之前先想白球落点别碰 9。**\n- 为什么：佟璐第 30 局第 2 杆；柯秉逸第 34、35 局\"跳得尽量硬杆不容易飞出去\"；第 33 局第 2 杆赵汝亮跳进 1 号却叫不上 2\"灭金\"（柯秉逸）；扎杆白球留不到下一颗就改跳（柯秉逸第 31 局第 4 杆）。\n- 本场例子：第 31 局第 4 杆郑肖淮轻跳跳进 3 号还走到位；第 19 局第 10 杆赵汝亮跳进 3 号（秦利文\"潜力是被逼出来的\"）。反例：第 30 局第 2 杆郑肖淮紧张\"力量都没用对\"。\n- 怎么练：跳球专项，先只练\"跳过去碰到\"，再练\"跳进\"，最后练\"跳进后白球停区\"。\n\n**17. 薄球和远台才是真正的失误区：40° 以内的切角基本不丢，白球到目标球超过 1.2 米、总路程超过 1.8 米时失误率 20~30%；\"近库\"（离库 2~8 厘米）比贴库还危险。**\n- 为什么：失误规律专题的数字。袋口有阴影的日子薄球别用低杆发力，高杆推目标球慢晃着也能进（佟璐、党金虎第 27 局第 2 杆）；薄球奔袋前想清厚薄，薄了不进厚了洗袋（佟璐第 21 局第 7 杆）。\n- 本场例子：第 17 局第 11 杆郑肖淮 9 号又大力又打薄；第 27 局第 2 杆 2 号袋口弹出；第 20 局第 2 杆赵汝亮长台 2 号打薄。反过来，第 11 局第 3 杆 62° 但离袋 31 厘米的薄球赵汝亮直接戳进（错题本序 49）。\n- 怎么练：长台薄球专项（白球到目标球 1.2 米以上、切角 40°~60°），只练\"轻打、不加塞、不发力\"，记进球率；离袋 40 厘米以内的薄球单独练\"敢打\"。\n\n### 第四档：心态和节奏（18~20）\n\n**18. 手紧的表现是走位偏轻偏直、低杆不敢打、脑子乱——处方是放慢节奏、回到基本动作、走最简单的路。**\n- 为什么：柯秉逸第 36 局\"越关键越差一点，低杆不敢打就先打中杆\"；秦利文第 34 局\"手能跟上，但大脑已经有点凌乱\"；柯秉逸第 32 局\"步伐变快有点危险\"；党金虎第 33 局\"小亮的节奏非常仔细，不是磨时间，是我们要学的\"；佟璐第 34 局\"该再擦一遍巧粉\"。\n- 本场例子：第 35 局郑肖淮必须赢的一局手紧但零冒险（推两库轻轻走、一库停、不碰 9、不 K）；反例：第 24 局两人连着解球犯规、自由球洗袋（薛珍麒\"平时不怎么掉的球今天都掉\"）。\n- 怎么练：练习赛加压（输了罚），要求学员每杆出杆前固定做三件事：擦粉、看一遍整盘、说一句目标。节奏固定了手紧时才有东西靠。\n\n**19. 关键球出杆要坚定，最后一颗别加花别发力过头；打了就坚决，丢了别想太多。**\n- 为什么：秦利文第 33 局\"需要一个强大的心脏和强大的基本功\"、第 34 局\"即使手不听使唤大脑也要告诉自己坚定\"；党金虎第 17 局\"打进不就完了，吃这么大劲干嘛\"；柯秉逸\"关键 9 号他们都打很大力，我们一定轻点低戳\"；薛珍麒第 17 局\"打了就得坚决，没进也没办法\"。\n- 本场例子：第 33 局第 12 杆赵汝亮关键 9 号顶住；第 36 局第 9 杆郑肖淮手紧还敢低杆拉回（佟璐\"硬啊\"）。反例：第 17 局第 11~12 杆两人连丢两个 9 号。\n- 怎么练：每次练习最后 10 杆都当\"冠军球\"打：先站直深呼吸、再趴下、出杆不许停顿；轻点低戳收 9。\n\n**20. 球台、湿度、皮头都要提前估到：台滑高低杆偏低、晚上胶边变硬要加力、库边会喷、皮头干了会滑杆。**\n- 为什么：柯秉逸第 5 局\"球滑手感要调\"；佟璐第 7 局\"打空转说明球特别滑，塞要加更强\"；秦利文第 24 局\"越晚湿度越大胶边偏硬，他判断了所有但没判断天气\"；佟璐第 18 局\"库边有点喷\"；党金虎第 9 局\"皮头干了\"滑杆。佟璐第 19 局：\"记住库边固定点加塞走哪条线，就能熟悉这张台的滑度和吃塞。\"\n- 本场例子：第 5 局赵汝亮四杆走位都偏（主播归到台滑）；第 9 局第 5 杆郑肖淮滑杆差点丢大金。\n- 怎么练：每次上陌生台先打 5 杆\"固定点加塞一库\"和 5 杆\"低杆拉回\"，对照自己平时的停点，给今天的台打补丁（和南哥\"AI 教练适应球台\"的思路一致）。\n\n---\n\n## 二、我们的 AI 教练要改的地方（对照预判错题本和三个专题）\n\n教练现状：第 5~12 局 63 杆，v1 版袋口命中 96%、攻防类型命中 95%，但白球落区只有 24%、停点差中位 51 厘米（`predict/说明.md`）。打哪颗进哪个袋基本不用改，要改的全在\"像不像职业选手想的\"。\n\n**1. 进球把握公式：距离权重要大于切角，薄球打折按离袋距离缩放，\"近库\"单独一档。**\n- 依据：失误规律专题第 1、2 条（40° 内基本不丢，白球到目标球 >1.2 米丢 30%，近库 2~8 厘米丢 17%）；错题本第 1、5、7 题（66° 薄球给 92%、贴库顺库 1.8 米给 56%、1.7 米小角度球只给 53%）；v1 遗留问题（第 11 局序 49 离袋 31 厘米的薄球被压成防守）。\n- 改法：切角 50° 起打折但离袋 <0.4 米不打折；白→球 1.2 米起、总路程 1.8 米起另打折；贴库且离袋 >1 米 ×0.5；近库（2~8 厘米）加一档难度；小角度长台把握上调（`long_pot` 只在没近袋好球时用）。\n\n**2. 走位评分：罚\"白球跑太远、停得离下一颗远\"，近球优先定杆，留角度不走直，白球停\"线\"不停\"点\"。**\n- 依据：错题本第 3、4 题（教练两库跑到台另一头去追一个\"把握 0.93 的好点\"，职业选手一个定杆 7 厘米）；本文第 7~9 条；错题本思路差异第 1 条。\n- 改法：`stay_close` 已加（离下一颗 >0.8 米 ×0.3、跑动 >1.2 米 ×0.1），还要加\"下一杆切角落在 10°~30° 加分、<5° 扣分\"、\"白球沿下一颗进球线方向过去加分\"（佟璐第 9 局）、\"角度刚好时定杆优先\"。\n\n**3. 走位误差模型按\"高杆推 < 低杆拉；一库 < 两库 < 三库；小力 < 大力\"排，低杆加\"拉多/拉少\"的方向性误差，台滑/潮时整体偏低、塞要更强。**\n- 依据：失误规律专题\"走位的飘\"一节；南哥 v0.5 不稳定性补丁口径一致；第 5、7、24 局主播对台滑和胶边的说法。\n- 改法：真人误差抽样里按杆法/库数/力量分档给不同散布；加一个\"今天的台\"参数（滑度、胶边硬度）接球台适应。\n\n**4. 加塞走位选项扩大：塞到 0.5、杆速到 2.5，让\"中杆多塞两库叫直\"进入候选。**\n- 依据：错题本第 2 题是唯一两版都没改好的题（第 7 局第 10 杆六位叫好的线教练根本想不到）；本文第 11 条。\n- 改法：动教练本体的加塞网格，并把\"中杆加塞\"和\"高杆加塞\"分开建模（佟璐第 7 局的道理：中杆横着吃库塞才发挥）。\n\n**5. K 球：三道闸 + 力量档 + 容错窗 + 距离档；\"顺便踢 9 / 顺便 K\"单独降权；问题球是下一颗且位置随机时默认防守。**\n- 依据：K 球专题\"对照工作台教练\"一节的 6 条；本文第 3、14、15 条。\n- 改法：(a) 能传/能直接打（把握 ≥ 阈值）就不 K；(b) 和翻袋/防守比期望；(c) K 完\"三不\"的概率要够；输出\"速度区间 + 碰整颗/半颗\"，用引擎抽样算太轻吊球/太重跑远两边失败率，窗太窄标红；扇形按白球到问题球距离分\"稳（0.3~0.6 米）/一般/别试\"；当前球把握 <95% 或已有走位难点时禁止叠加第二意图，只有 9 在袋口才允许传 9；接手第一杆、开球后 2 号的问题球默认防；K 完\"和问题球踢直\"算失败。\n\n**6. 攻防判断：加\"早晚得防不如现在防\"、\"犯规 +1 的价值\"、\"领先/时间紧/手紧时防守倾向\"、\"翻袋当保底不当常规\"；低把握传 9 不考虑。**\n- 依据：错题本第 1、6 题（教练进攻把握 ≥80% 就不比防守；35% 的传 9 压过 100% 明球）；本文第 1、5 条；第 19、24、28、34、35、36 局六位主播的攻防口径；翻袋本场 8 杆丢 4。\n- 改法：任何杆都算一次防守期望（含对手犯规 +1 和自由球价值）；进攻把握 <80% 时必须比；加比分/剩余局数/时限输入，领先且剩局少时防守权重上调；借球/传 9 把握 <60% 不考虑（`combo_min` 已加）；翻袋把握按本场 50% 校准，优先级低于\"贴死的防守\"。\n\n**7. 压力模型做成\"决策变贪\"而不是\"准度下降\"。**\n- 依据：失误规律专题第 4 条（胶着时进球率没掉，判断性失误集中）；本文第 18 条。\n- 改法：教练的\"压力/胶着\"状态只改两样：复合意图的把握阈值提高、走位候选优先最简单的路（一库、定杆、不碰 9）；不动进球把握。\n\n**8. 开球和开球后策略：评价用\"失机三件套\"，开球后 2 号被挡按\"解净 → 跳 → 防\"的顺序，加\"开球后球不贴库数\"指标。**\n- 依据：开球专题\"给工作台/教练的建议\"3 条；本文第 1 条和《高手同频模型》第一节。\n- 改法：开球评分 = 白球不洗袋 + 2 号可见 + 2 号可接，进几颗只做次要分；开球后第一杆的候选顺序固定；\"1 号进中袋\"的说法本场没证据，先别写进规则（要回看第 9、10、14、18、21、22、24、26、27、28、29、32 局主机位开球画面确认）。\n\n---\n\n## 三、怎么用这份东西\n- 学员分三档练：先把第一档 6 条当规矩背下来（每局开球前默念\"失机、一个意图、防要贴死、算账\"），第二档用练习球形练，第三、四档按人补短板（解球犯规多的练第 4 条，K 球力量不稳的练第 15 条，手紧的练第 18、19 条）。\n- 复盘时对着卡片看：每条要点后面的\"第 N 局第 M 杆\"都能在 `分析/卡片/` 里找到六位主播的原话，切片工坊可以直接按这个清单出片。\n- AI 教练的 8 条改法先在 `predict/` 的副本上改、重跑第 5~12 局看准确率，再合进工作台（和南哥 10-01\"隔离副本做原型，合并后集成\"的定法一致）。\n"}, {"题": "开球专题", "文": "# 专题三：开球（独牙九球决赛 郑肖淮 vs 赵汝亮，第5~36局）\n\n来源：`分析/开球表.csv`、`分析/局表.csv`（比分牌推断）、`分析/球位/第N局.json` 的\"开球者\"（画面认人，第 6~19 局有）、各局卡片的\"谁开球/开球\"字段和主播原话、`独牙九球规则_本场.md` 里核实过的轮换规则。核对后的每局表在 `专题/开球表_核对.csv`。\n\n## 一句话结论\n\n1. **开球进球率很高但\"开完能顺利接着打\"只有一半左右。** 32 次开球（第 5~36 局）：有球进 28 次（88%），1 号开球进 26 次（81%），空枪 4 次（第 7、17、31、33 局），白球洗袋犯规 3 次（第 8、15、30 局）。但开完以后\"自己能直接进攻下一颗\"的，大约 17 次（53%）；其余是 2 号被挡要解/跳（第 6、12、16、19、30 局）、2 号太难只能防/拼翻袋（第 11、14、20、23、28、29 局）、犯规换人。**主播评价开球好坏的标准不是进几颗，是\"有没有失机\"（白球不洗袋、2 号能不能看见、能不能接上）。**\n2. **赵汝亮开球更强：进球更多、空枪更少、开球局赢得更多。** 赵汝亮开 17 局（含第 30 局洗袋重开那次）：空枪 1、洗袋 2、1 号进 14、平均进 1.6 颗、开球局自己赢 9（含大金 3：第 5、22、29 局）。郑肖淮开 15 局（含第 30 局重开）：空枪 3、洗袋 1、1 号进 12、平均进 1.2 颗、开球局自己赢 6（大金 3：第 9、10、26 局）。主播印象一致：柯秉逸\"小亮连开球都没在运杆\"、\"开球太牛了下次要跟他学开球\"（说郑第 11 局），佟璐\"小淮昨天冲球就不好，今天比昨天强\"，薛珍麒\"两个人冲球运气都没有很好\"（第 19 局）。\n3. **\"开球希望 1 号进中袋\"这个说法本场证据不足，暂时不能当规律。** 六路解说全场没有一句把\"1 号\"和\"中袋\"放在一起说；开球段提到中袋的全是在说 2 号/3 号/翻袋。能看到的只有：1 号开球进了 26 次，但进的哪个袋没人说、球位文件只能告诉我们\"1 号没了\"；第 33 局佟璐说\"他一号是奔底的爱跳、一号容易出现这种效果\"（1 号往底袋走容易跳起来），**反倒说明这两位的 1 号是奔底袋（角袋）去的**。要定论得回看录像里 1 号的进袋画面（第 9、10、14、18、21、22、24、26、27、28、29、32 局主机位都录到了开球），这一步今晚没做。\n\n## 每局开球表（核对版）\n\n| 局 | 谁开（画面/卡片） | 比分牌推断 | 进了几颗 | 1号 | 开完接着打？ | 本局结果 | 备注 |\n|---|---|---|---|---|---|---|---|\n| 5 | 赵汝亮（卡片） | 赵汝亮 | 4（1、2、3、4） | 进 | 是 | 赵汝亮 大金 | 画面没录到开球；比分牌 15:4→15:14 |\n| 6 | 赵汝亮（画面） | 赵汝亮 | 2（1、4） | 进 | 2 号被挡没直线，选防守 | 郑肖淮 普胜 | |\n| 7 | 郑肖淮（画面） | 郑肖淮 | 0 | 否 | 否，1 号被挡住对手只能薄解 | 赵汝亮 小金 | \"开球没失机运气不错\"（佟璐） |\n| 8 | 赵汝亮（画面） | 郑肖淮（错） | 2（1、6） | 进 | 否，白球洗袋犯规 +1 | 郑肖淮 普胜 | 比分牌推断错了，画面对；规则文档已更正 |\n| 9 | 郑肖淮（画面） | 郑肖淮 | 2（1、7） | 进 | 是，\"大金面没难度\" | 郑肖淮 大金 | \"开球很出力、球跑得飞快\"（柯秉逸） |\n| 10 | 郑肖淮（画面） | 郑肖淮 | 1（1） | 进 | 是，\"又是个面\" | 郑肖淮 大金 | |\n| 11 | 郑肖淮（画面） | 郑肖淮 | 2（1、6） | 进 | 2 号没直线，拼翻袋没进 | 赵汝亮 普胜 | \"开球太牛了\"（柯秉逸） |\n| 12 | 赵汝亮（画面） | 赵汝亮 | 1（1） | 进 | 2 号看不见，不敢跳只能勾 | 赵汝亮 普胜 | |\n| 13 | 赵汝亮（画面） | 赵汝亮 | 1（6） | **否** | 否，1 号看不见只能解 | 郑肖淮 普胜 | 唯一一次\"进了球但 1 号没进\" |\n| 14 | 郑肖淮（画面） | 郑肖淮 | 2（1、2） | 进 | 3 号被挡只能防 | 赵汝亮 普胜+对手犯规 | \"冲球真的冲得挺好\"（薛珍麒） |\n| 15 | **郑肖淮**（画面+卡片） | 赵汝亮（错） | 2（1、7） | 进 | 否，白球洗袋犯规，赵汝亮自由球 | 赵汝亮 普胜 | 开球表.csv 写成赵汝亮开，是错的；上局赵赢却郑开 = 第 14 局的开球犯规让赵选了\"重开\"（规则文档 23:20 的解释） |\n| 16 | 赵汝亮（画面） | 赵汝亮 | 2（1、7） | 进 | 2 号看不见只能解 | 郑肖淮 普胜 | |\n| 17 | 郑肖淮（卡片） | 郑肖淮 | 0 | 否 | 否，但把对手防死（对手解球犯规） | 郑肖淮 普胜 | 画面没认出开球人 |\n| 18 | 郑肖淮（画面） | 郑肖淮 | 1（1） | 进 | 是，但\"六成清台把握\" | 郑肖淮 普胜 | |\n| 19 | 郑肖淮（画面） | 郑肖淮 | 2（1、8） | 进 | 2 号看不见要跳球 | 赵汝亮 普胜 | |\n| 20 | 赵汝亮（卡片） | 赵汝亮 | 1（1） | 进 | 2 号要翻底袋 | 郑肖淮 普胜 | |\n| 21 | 郑肖淮（卡片） | 郑肖淮 | 1（1） | 进 | 是，5、7 是问题球 | 赵汝亮 普胜 | |\n| 22 | 赵汝亮（卡片） | 赵汝亮 | 1（1） | 进 | 是，2 在袋口、3 过线没失机 | 赵汝亮 大金 | \"2 号又冲到袋口\"（柯秉逸） |\n| 23 | 赵汝亮（卡片） | 赵汝亮 | 2（1、5） | 进 | 2 号难、7-8 挤一起 | 赵汝亮 普胜+对手犯规 | |\n| 24 | 赵汝亮（卡片） | 赵汝亮 | 2（1、8） | 进 | 是，\"so easy\" | 赵汝亮 普胜 | 被迫 K3 失误丢了大金 |\n| 25 | 赵汝亮（卡片） | 赵汝亮 | 1（1） | 进 | 是，但 2 号不好叫 | 郑肖淮 普胜 | \"连开球都没在运杆\"（柯秉逸） |\n| 26 | 郑肖淮（卡片） | 郑肖淮 | 2（1、8） | 进 | 是，\"没有一个库边\" | 郑肖淮 大金 | |\n| 27 | 郑肖淮（卡片） | 郑肖淮 | 1（1） | 进 | 是，2 号偏薄 | 赵汝亮 普胜 | 2 号袋口弹出丢大金 |\n| 28 | 赵汝亮（卡片） | 赵汝亮 | 1（1） | 进 | 2 号停库边只剩翻中袋 | 赵汝亮 普胜 | \"这开球没有低杆，球都跑了\"（杨帆）；\"力道小了点\"（柯秉逸） |\n| 29 | 赵汝亮（卡片） | 赵汝亮 | 2（1、4） | 进 | 2 号极薄只有中袋 | 赵汝亮 大金 | \"小亮的冲球现在真好\"（党金虎） |\n| 30 | 赵汝亮开洗袋→**郑肖淮重开** | 赵汝亮 | 重开进 1 | 进 | 2 号被挡，跳球没进 | 赵汝亮 普胜 | 四位主播都提到\"开球洗袋，重开\" |\n| 31 | 赵汝亮（卡片） | 赵汝亮 | 0 | 否 | 否，9 颗全在给了对手小金 | 郑肖淮 小金 | \"太厚了，但没失机\"（佟璐） |\n| 32 | 郑肖淮（卡片） | 郑肖淮 | 1（1） | 进 | 2 号不好衔接，翻袋没进 | 郑肖淮 普胜 | \"手又立起来了\"（薛珍麒，手架立起来冲） |\n| 33 | 郑肖淮 | 郑肖淮 | 0 | 否 | 否 | 赵汝亮 普胜 | 没卡片；佟璐\"一号奔底的爱跳\" |\n| 34 | 赵汝亮 | 赵汝亮 | 2（1、7） | 进 | 是 | 赵汝亮 普胜 | 没卡片 |\n| 35 | 赵汝亮 | 赵汝亮 | 2（1、2） | 进 | 是 | 郑肖淮 普胜 | 没卡片 |\n| 36 | 郑肖淮 | 郑肖淮 | 1（1） | 进 | 是 | （未完） | 没卡片 |\n\n画面认人和比分牌推断不一致的两局（第 8、15 局）都以画面为准，而且都能用\"开球犯规\"解释：第 8 局赵汝亮开球进 1、6 但洗袋；第 15 局郑肖淮开球进 1、7 但洗袋，赵汝亮拿自由球打。第 30 局是\"开球洗袋→对方重开\"的实例。**轮换规则：上一局赢家开；开球犯规后对方可选重开。**\n\n## 两人开球偏好与成功率\n\n| | 赵汝亮 | 郑肖淮 |\n|---|---|---|\n| 开球次数 | 17（含第 30 局洗袋） | 15（含第 30 局重开） |\n| 有球进 | 15（88%） | 12（80%） |\n| 1 号开球进 | 14（82%） | 12（80%） |\n| 空枪（一颗没进） | 1（第 31 局） | 3（第 7、17、33 局） |\n| 白球洗袋 | 2（第 8、30 局） | 1（第 15 局） |\n| 平均进球数 | 1.6 颗 | 1.2 颗 |\n| 开完自己能顺利进攻 | 约 9/17 | 约 8/15 |\n| 开球局自己赢 | 9/17（大金 3） | 6/15（大金 3） |\n| 开球 4 颗以上 | 1 次（第 5 局 1、2、3、4） | 0 |\n| 第二颗常进什么 | 4、7、8、5、6、2 都有 | 7、8、6、2 |\n\n主播对两人开球风格的说法（都是原话，没画面测量）：\n- 赵汝亮：出杆快、不运杆（柯秉逸第 25 局）；力量偏小、\"2 号冲很快但力道小了点，肖淮比较大力\"（柯秉逸第 28 局）；\"这开球没有低杆，球都跑了\"（杨帆第 28 局）；状态起伏——第 16~19 局\"冲球运气不好\"，第 24 局起\"冲球好起来了\"（薛珍麒）、\"小亮的冲球现在真好\"（党金虎第 28、29 局）。\n- 郑肖淮：力量大（柯秉逸第 9 局\"开球很出力、球跑得飞快\"，第 14 局\"没很大力但球速很快\"，第 28 局\"肖淮比较大力\"）；手架\"立起来\"冲（薛珍麒第 32 局）；1 号打厚是他空枪的原因（第 17 局\"1 号打太厚了\"，第 31 局赵汝亮也是\"太厚了\"）；开球洗袋 1 次。\n\n两人共同点：都把开球当\"拿到球权+不失机\"打，不追求多进球——28 次有球进的开球里 22 次只进 1~2 颗。开完以后 2 号的处境才决定这局：2 号能看见能打→大金/普胜；2 号被挡→解球/跳球，多半换人。\n\n## \"开球希望 1 号进中袋\"成立到什么程度\n\n- 能证实的：1 号开球进袋 26/32，是这两位开球的主要进球（第二颗是随机的）。\n- 证实不了的：进的是中袋还是底袋。六路解说 0 次提到\"1 号进中袋\"；第 33 局佟璐\"一号奔底的爱跳\"是唯一和 1 号去向有关的话，指向底袋（角袋）。开球后球位文件只有\"1 号没了\"，不知道从哪进的。\n- 所以：**在中式台独牙九球里，\"1 号开球进袋\"是真的（81%）；\"进中袋\"是待确认**。要落实，下一步用主机位录像在开球后 1~2 秒逐帧看 1 号往哪跑（已录到开球画面的局：第 9、10、14、18、21、22、24、26、27、28、29、32），每局 1 张截图就能定。\n\n## 给工作台 / 教练的建议\n\n1. 开球评价指标用\"有没有失机\"三件套：白球不洗袋、2 号能不能看见、2 号能不能接上；\"进几颗\"只做次要指标。\n2. 开完 2 号被挡时，两位高手的选择顺序是：能解净就解（第 12、16 局）、解不净/怕出不去就跳（第 19、30 局）、2 号太薄就防（第 29 局例外选了拼）。工作台的开球后策略可以照这个顺序。\n3. 开球力量：本场两位都是中大力，\"没有低杆、球都跑了\"被主播当缺点（第 28 局），说明职业开球希望白球停台中、球不要散到库边。工作台球台适应里可以加一个\"开球后球不贴库数\"的指标。\n\n## 方法与局限\n\n- 谁开球：画面认人只有第 6~19 局（第 5、17 局没认出），其余靠卡片推断（上一局赢家 + 开完谁打 + 主播点名），第 20~36 局没有画面核；第 30 局的\"重开\"来自规则文档记录的主播说法。\n- 进了几颗/哪几颗：全部来自比分牌（开球后第一次读到的台上剩球），比分牌开球后才读到时会把开球和下一杆混在一起，所以\"1 号+另一颗\"是不是都是开球进的，第 9、11、24、26 局的卡片都标了待确认。\n- 1 号进哪个袋、白球摆哪、开球力量：没有画面测量，只有主播的话。\n- 第 33~36 局没卡片，只有比分牌。\n"}, {"题": "K球专题", "文": "# 专题二：K 球时机（独牙九球决赛 郑肖淮 vs 赵汝亮，第5~32局）\n\n来源：卡片 `K球` 字段、类型含 K、主播说 K/踢/撞开/刮/蹭/炸的杆（共 31 张卡片涉及），逐杆比分牌定结果，第 5~23 局有球位的用坐标说话（坐标 x 0~1.27 台宽、y 0~2.54 台长，单位米；这场录像里球堆在 y≈0.6 那头，9 号常年在 (0.62, 0.6) 附近）。明细表 `专题/K球清单.csv`。\n\n## 一句话结论\n\n1. **真正\"主动 K\"的只有 5 杆，两人都很克制。** 32 局、277 杆里，出杆前就打定主意用白球去撞开问题球的：第 6 局郑肖淮 5K7、第 21 局郑肖淮 4K5、第 22 局赵汝亮 6K8、第 29 局赵汝亮 2K3 和 5K7。顺路/带一下的 4 杆，被迫 K 1 杆，\"踢 9/找 9\"4 杆，主播建议 K 而选手没 K 的 3 杆，主播一致说\"别 K\"而选手听了的 2 杆。\n2. **K 成不成，八成看力量，不看准不准。** 5 杆主动 K 里：第 29 局 2K3\"完美\"（小力刹车）、第 29 局 5K7 目的达到但\"踢大了\"、第 6 局 5K7\"K到了效果一般\"、第 21 局 4K5\"K到了但踢直了\"、第 22 局 6K8\"太轻、K完吊球\"；被迫 K 的第 24 局 2K3\"力量过大、大金没了\"。六杆里四杆的毛病都是力量（太大 3、太轻 1），没有一杆是没撞到。**K 的核心训练是力量档，不是线路。**\n3. **\"踢 9 / 顺便 K\"是全场最亏的决定：4 杆全失败，直接输掉 2 局。** 第 12 局郑肖淮打 2 踢 9（9 没进、拉过头、3 打不到→解球漏→输局）、第 20 局赵汝亮打 5 找 9 又打 6 两库找 9（两次都没碰进，还留了包进的传 9→输局）、第 25 局赵汝亮打 2 想踢 9/踢 8（分心，2 都没进）。主播事后口径一致：柯秉逸\"专心打二，九的没进就算了\"，佟璐\"传不着你六号还没位，倒不如直接打完\"，秦利文\"细节决定成败，万分之一的概率\"。\n4. **赵汝亮更爱 K、K 得也更好；郑肖淮更爱\"传\"和\"闪\"。** 赵汝亮：主动 K 3 杆 + 被迫 1 + 顺路 2 + 踢 9 3，经典是第 29 局两杆 K 打出大金（当时落后 4 分、第 29 局，主播说\"只能防一杆\"他拼了）。郑肖淮：主动 K 2 杆 + 顺路 2 + 踢 9 1，但他处理问题球的首选是传球（第 13 局 5 传 9 拿 4 分、第 17 局 1 传 6 把挡袋口的 6 直接传进）和发力闪过（第 31 局 2 号发力闪 7），主播也评\"打得真聪明\"。\n5. **高手什么时候 K：问题球\"没袋 + 没替代方案 + 顺路 + 近\"四条齐了才 K；什么时候不 K：准度够直接打、能传就传、袋口会被封、K 完白球会吊住/贴库、比分胶着时别加意图。** 详见下面的规则。\n\n## 全部涉 K 的杆（按局）\n\n### A. 主动 K（出杆前就定了要撞开问题球）\n\n| 局/序 | 谁 | 打几号→K 谁 | K 前台面（球位） | 比分 | 怎么 K、多大力 | K 完结果 | 评价 |\n|---|---|---|---|---|---|---|---|\n| 6/6 | 郑肖淮 | 打5 K7 | 剩5、7、8、9。7 号贴右库 (1.21,1.07)，离库 3cm，两个角袋都没角度；替代：翻中袋（佟璐、薛珍麒都说翻中够）。白球 (0.18,1.59)，5 号 (0.54,1.76)，切角 26° | 15:14 胶着 | 5 进右上角袋，白球自然分离奔 7\"整颗踢\"（党金虎）；秦利文：\"K准就发力、K不准就轻K\"；力量中等 | 7 出来到 (1.22,0.51) 仍贴库，下一杆切角 43°、0.52m；进了但主播说\"力量过大\" | K到了、效果一般（薛珍麒）；柯秉逸\"算很倒霉，7 再出来一点就好\"；杨帆\"杆法没K好，再低一点能厚一点\" |\n| 21/4 | 郑肖淮 | 打4 K5 | 剩4~9。5 号贴右库 (1.18,1.58)，离库 4cm；白球 (0.58,1.72)，4 号 (1.06,1.21)，切角 36° | 65:43 领先22 | 高杆一点点左塞推，敲 5 半颗（薛珍麒）；秦利文\"库球你K一下得了\" | 5 出到 (0.71,1.88)，但白球 (0.58,1.72) 和 5 踢直了（切角 3.6°、0.2m），只好发力推留角度→6→7 变薄球没进 | 党金虎\"踢直了，这球不好直了吧\"；薛珍麒\"本意是想K不是想勾\"。K 到了，但没想好 K 完白球停哪 |\n| 22/6 | 赵汝亮 | 打6 K8 | 剩6、7、8、9。8 号贴顶库角袋口 (0.07,2.54)；前三杆（3、4、5）都在为\"6 号角度能 K8\"铺路（柯秉逸全程画线）。白球 (0.26,0.81)，6 号 (0.59,0.46)，切角 14° | 65:47 落后18 | 推杆，想 K 一下 8 把它弄出来、白球留能看 7 的位置 | 太轻：8 没动，白球被吊住看不到 7（\"千万不能K完吊球\"说中了），只能扎杆进 7，8 仍贴库，最后 9 打薄晃进拿大金 | 柯秉逸\"有点太轻了，这么轻就算K下去也吊球\"；后又改口\"可能他没想K8只是单叫\"。铺路三杆很好，最后一杆力量没给够 |\n| 29/2 | 赵汝亮 | 打2 K3 | 剩2、3、5~9。2 号极薄只有中袋，3 号没法叫（被自己挡）；佟璐、柯秉逸都说\"只能防一杆\" | 80:76 落后4 | 小力低杆刹车把 2 薄进中袋，白球顺势顶 3 把它顶开留叫位；力量\"很轻，因为很薄\" | 2 进、3 被顶到能打的位置，白球停住 | 柯秉逸\"完美、掌声\"；薛珍麒\"这球控得好\"；秦利文\"他的球太厉害\"。全场最好的 K |\n| 29/4 | 赵汝亮 | 打5 K7 | 剩5~9。7 号没叫位（上一杆 3 号走位时就按\"拿5踢7\"摆的角度）；党金虎：\"一定要踢整颗不要勾，一勾白球就停住了\" | 80:76 落后4 | 5 进后白球右塞先吃库再踢 7 整颗；大力（薛珍麒\"没办法轻K，轻K白球贴库往里钻 6 就失控\"） | 7 踢出来、6 有得打，但白球多走了一点，6→7 变翻袋线，下一杆低杆右塞两库补回来→大金 | 目的达到；柯秉逸、佟璐\"踢大了，再小一点正好\"；薛珍麒\"其实还可以再大力一点\"（力量档意见分歧本身说明 K 的容错窗口窄） |\n\n### B. 顺路 K / 带一下（主要意图是进球+走位，顺手撞一下）\n\n| 局/序 | 谁 | 打几号→带谁 | K 前台面 | 比分 | 方式 | 结果 | 评价 |\n|---|---|---|---|---|---|---|---|\n| 21/2 | 郑肖淮 | 打2 刮5 | 5 号贴库 (1.2,1.65)；佟璐事前说\"不能K5，两库能叫3\" | 65:43 领先22 | 低杆拉回来刮 5 | 只刮到一点，5\"稍微好打一点\"，3 号位好 | 柯秉逸\"差一点但有顶到还不错\"；党金虎\"连进带刮真厉害\" |\n| 19/11 | 赵汝亮 | 防守打4 顺带开6 | 剩4、5、6、7、9。4 号 (0.21,1.89) 没法清台，6 号 (0.02,1.96) 贴库 | 61:38 落后23 | 小力防守，4 号留原地，白球藏到 9 号后面，顺便把 6 敲开 | 对手解球打偏犯规 +1 | 柯秉逸\"还顺便把6开了，这两颗厉害\"；薛珍麒\"防守很硬\" |\n| 32/5 | 郑肖淮 | 解球打3 带K开球形 | 被赵汝亮贴死在 6 号后面 | 87:90 落后3 | 低杆（秦利文嫌该高杆一库） | 3 进了，但 4 号角度不舒服→下一杆 4 没进换人 | 党金虎\"带K打成这样纯纯牛逼\"；柯秉逸\"4号不好打\" |\n| 28/11 | 赵汝亮 | 打5 想带8 | 柯秉逸、佟璐都希望一库上来带一下 8 | 80:72 落后8 | 大低杆一库，不要太大力 | 没碰到 8，但 7 号位置还可以 | 佟璐\"没带\"；后面照样清完拿普胜 |\n\n### C. 被迫 K（白球闪不过，只能撞）\n\n| 局/序 | 谁 | 情况 | 比分 | 方式 | 结果 | 评价 |\n|---|---|---|---|---|---|---|\n| 24/2 | 赵汝亮 | 开球进 1、8 球型极好（\"so easy，怎么想失误都失误不了\"），但打 2 时白球闪不过 3 | 65:62 胶着 | 柯秉逸/佟璐：小低杆轻 K 3 到中袋位、白球留原位；秦利文：K 厚一点弹一库。实际发了大力、敲半颗 | 3 跑到打不进的位置→防守→对手翻进→…最后靠对手犯规才赢普胜，大金泡汤 | 柯秉逸\"太大力了，刚说要控制力量\"；党金虎\"判断性失误、画形错误\"；佟璐\"正常90%不会出现这种情况\" |\n\n### D. 踢 9 / 白球找 9（本质也是 K，但目标是直接赢）\n\n| 局/序 | 谁 | 情况 | 比分 | 结果 |\n|---|---|---|---|---|\n| 12/2 | 郑肖淮 | 打 2 低杆拉回去踢 9（9 在 (0.63,0.55)，3 号在 (0.39,0.75) 本来好打） | 44:25 领先19 | 9 踢薄没进，白球拉过头 3 打不到→解球漏→赵汝亮清台。柯秉逸\"太拉了\"，佟璐\"纯纯的踢九了，点背\" |\n| 20/7 | 赵汝亮 | 打 5 高杆小弧线找袋口的 9 (0.05,0.03) | 61:43 落后18 | 5 进、9 没进、6 号没位。秦利文\"线路绝对不是最完美的\"，佟璐\"最恶心的就这种效果\" |\n| 20/8 | 赵汝亮 | 6 号没位，打薄 6 白球强塞两库找 9 | 61:43 落后18 | 6 打薄没进，留给对手包进的传 9，输局。秦利文\"这局就这球输的\" |\n| 25/2 | 赵汝亮 | 打 2 同时想穿 9 / 踢 8，五位主播五种建议 | 66:67 胶着 | 2 和 9 都没进。柯秉逸\"分心了，应该专心打二\"，杨帆\"这种毛病今天犯了四五回\" |\n\n### E. 讨论过 K、最后没 K（对照组）\n\n| 局/序 | 谁 | 情况 | 选手怎么做 | 事后评价 |\n|---|---|---|---|---|\n| 10/1 | 郑肖淮 | 开球进 1，2 号附近球堆挡着中袋，杨帆/佟璐觉得他想 K | 没 K（反塞一库走位），一路清台大金 | 柯、薛、佟、党一致：\"准度够别 K，K了反而把袋封死，K完就再见了\" |\n| 17/3 | 郑肖淮 | 自由球，6 号挡着 3 号去底袋的袋口；党金虎、佟璐想 1 号 K3 | 1 传 6 把挡路球直接传进，1 留着接着打→清台 | 柯秉逸\"K3 倒霉一点弹一库起来被 2 挡住把自己防住\"；党金虎\"打得真聪明\" |\n| 18/3 | 郑肖淮 | 柯秉逸备选\"6 号不好打就 5K6\" | 单叫，没用上 | — |\n| 21/6 | 郑肖淮 | 6 叫 7 最难点，佟璐事后说该顺路 K 一下 8 | 低杆定住没粘好，7 变薄球没进 | 佟璐\"只要黑8不K正他怎么都有位\"（主播事后认为该 K） |\n| 28/4 | 赵汝亮 | 秦利文、佟璐都说打 2 该顺路蹭 4 一半，4 号跑到好叫区 | 低杆直接走位没碰 4，3 号没位→只能防 | 秦利文\"你为啥不踢四？判断失误了\"（主播认为该 K） |\n| 32/4 | 赵汝亮 | 防守时柯秉逸提一库可以顺便踢开 4 | 没踢，贴死 6 号后面 | 柯秉逸\"那是我们准度不够才想踢开，他们准度够\" |\n| 13/6 | 郑肖淮 | 4 号走小、5 号位置不好，放弃小金 | 5 传 9（9 在袋口）拿 4 分 | 薛珍麒\"四分也四分，挺好\"；党金虎一度以为 K9 算小金，比分牌证明只算普胜 |\n\n## 高手什么情况下决定 K、什么情况下宁可不 K\n\n**决定 K（5 杆主动 K 的共同点）：**\n1. 问题球**没袋**（贴库、被自己球挡、只剩翻袋）——第 6 局 7 号贴库、第 21 局 5 号贴库、第 22 局 8 号贴库角、第 29 局 3 号/7 号没叫位。\n2. **没有更稳的替代**：不能传（传球他们优先，第 13、17 局）、翻袋把握不够（本场翻袋 8 杆丢 4，50%）、防守不划算（第 29 局落后 4 分、剩 11 局，\"只能防一杆\"的局面他选了拼）。\n3. **顺路**：K 在打当前球的自然分离线上，不用为了 K 去牺牲进球（第 29 局最典型：前一杆 3 号走位就是\"奔着拿 5 踢 7 的角度\"摆的，等于南哥说的\"打前面的球时奔扇形\"）。\n4. **近 + 整颗**：白球到问题球近（0.3~0.6m），能踢整颗就不踢半颗（党金虎\"一勾白球就停住了\"）；远的、半颗的 K 效果都一般（第 6 局 7 号出来还贴库，第 21 局刮 5 只刮一点）。\n5. **K 完有\"三不\"的余地**：7 号不 K 死、不贴库、白球不贴库/不吊球（薛珍麒原话）。能满足就 K，不能满足就改防守。\n\n**宁可不 K / 先防：**\n1. **准度够就直接打**（第 10 局、第 32 局）：主播反复说\"那是我们准度不够才想踢开，他们准度够\"。K 会把袋口封死、让白球不可控。\n2. **能传球就传**（第 13、17 局）：挡袋口的球直接传进比 K 开更干净，而且 K 后弹一库容易把自己防住。\n3. **K 完白球会吊住/贴库**（第 22 局）：K 太轻就吊球、K 太重就跑远，容错窗口窄；没把握控力就改单叫。\n4. **问题球是\"下一颗\"而且位置随机（开球后 2 号/3 号）时，先防再说**（第 24 局序 3、第 25 局序 3、第 28 局）：这种时候 K 的收益小、风险大，两位都选防守。\n5. **比分胶着/领先大时别加\"顺便踢 9\"的意图**：4 杆踢 9 全失败，输 2 局。郑肖淮领先 19 分时踢 9，赵汝亮落后 18 分时找 9——一个是\"飘\"，一个是\"急\"，结果一样。\n\n**两人对比：**\n- 赵汝亮：敢 K、K 得准（第 29 局两杆是教科书），但力量档不稳（第 22 太轻、第 24 太大、第 29 稍大），而且胶着时爱加意图（第 20、25 局踢 9 三次）。\n- 郑肖淮：K 少，首选传球和发力闪过，决策更\"干净\"，但 K 到以后不管白球（第 21 局踢直）；他的问题球处理短板在解球（4 次犯规）而不在 K。\n\n## 对照工作台教练的\"被挡球要 K\"思路（docs/nange_ideas.md 10-04 最后一行）\n\n南哥的四条：①被挡球也是难点，挪开挡路球就好打的要趁早 K；②一处难点给两种 K 法；③白球停位画扇形；④打前面的球时奔扇形；并且 K 的定义是\"白球碰完 X 号后第一颗必须撞到挡路球\"。\n\n本场数据支持的：\n- ①和④完全对上：第 29 局赵汝亮 3 号走位→5 号踢 7，就是\"打前面的球时奔扇形\"的真人版；第 22 局 3、4、5 三杆给 6K8 铺路也是。**趁早**也对：第 21 局郑肖淮第二杆就刮 5、第四杆 K5，没拖到最后。\n- ②对：第 24 局 K3 柯秉逸/佟璐（轻 K 留原位）和秦利文（K 厚弹一库）就是两种 K 法，选手选了第一种却用了第二种的力量——说明两种 K 法要**连力量档一起给**。\n- \"第一颗必须撞到挡路球\"的定义对：顺路\"刮一下\"（第 21 局）效果都只是\"稍微好一点\"，真正解决问题的都是整颗撞。\n\n本场数据提示要补的（可落地规则）：\n1. **K 之前先过三道闸**：(a) 能传就传、能直接打就直接打（准度 ≥ 某阈值时不 K）；(b) 翻袋/防守的期望值比较；(c) K 完\"三不\"（问题球不贴库、不 K 死、白球不吊球不贴库）的概率要够。闸没过就不 K，去防守。\n2. **K 的输出要带力量档和容错窗**：教练给 K 建议时输出\"速度区间 + 碰整颗/半颗\"，并用物理引擎抽样算\"太轻吊球 / 太重跑远\"两边的失败率；窗太窄（比如 ±15% 速度就失败）就标红、改方案。本场 6 杆 K 有 4 杆败在力量。\n3. **扇形停位要加\"距离档\"**：南哥说 K 靠角度、远近有余地——本场看，白球到问题球 0.3~0.6m 的 K 都成了，远距离的 K 和\"两库找 9\"全失败。扇形里按距离分\"稳/一般/别试\"三环。\n4. **\"顺便踢 9 / 顺便 K\"单独降权**：当前球把握 <95% 或走位已有难点时，禁止叠加第二意图；只有 9 在袋口（第 13 局那种碰到就进）才允许\"传/踢 9\"。\n5. **问题球是\"下一颗\"且位置随机时（接手第一杆、开球后 2 号），默认选项是防守而不是 K**：本场两位高手这种局面 0 次 K，全部防守或传。\n6. **K 后必须规划白球停点**（第 21 局踢直的教训）：K 的扇形不只画问题球去哪，还要画白球落点，和 ③ 一致，但要把\"和问题球踢直\"算成失败。\n\n## 方法与局限\n\n- 涉 K 的杆靠卡片 K球 字段和主播用词（K/踢/刮/蹭/撞开）抓的，31 张卡片人工逐张看过再分类；\"选手是否真的 K 到\"只有主播眼睛和比分牌，第 24 局以后没球位没法用坐标核。\n- 第 10 局郑肖淮是否轻碰了球堆、第 25 局序 3 郑肖淮是否轻 K、第 32 局序 5 K 的是哪颗，主播没说清，都标待确认。\n- 样本小（主动 K 5 杆），\"谁 K 得更成功\"只能看个体杆，不能当概率。\n"}, {"题": "失误规律", "文": "# 专题一：职业选手的波动 / 失误规律（独牙九球决赛 郑肖淮 vs 赵汝亮，第5~32局）\n\n数据表（分组数字、失误清单、心态语录）在 `专题/失误规律_数据表.md`，每杆明细在 `专题/难度表.csv`，底表 `专题/底表.json`。\n怎么算的、哪里不准见文末\"方法与局限\"。\n\n## 一句话结论\n\n1. **顶级选手的\"失误\"几乎全出在难球上，简单球基本不丢。** 200 杆进攻（第5~32局，主播归为进攻的）只丢 11 杆（6%）。有球位能算难度的 120 杆里：切角 30° 以内丢 3/93（3%），45° 以上丢 1/7；白球到目标球 1.2 米以上丢 3/10（30%），0.8 米以内只丢 1/92；\"白球→目标球+目标球→袋\"总路程 1.8 米以上丢 4/18（22%），1.8 米以内丢 1/104（1%）。难度分（距离积/cos切角）超过 1.0 的 12 杆丢了 4 杆（33%），1.0 以下的 110 杆只丢 1 杆。**距离比切角更要命**：这两位的准度让 40° 以内的切角基本不是问题，但长台薄球（远+薄）仍是他们的失误区。\n2. **\"近库\"比\"贴库\"更危险。** 目标球离库 2~8 厘米（半贴不贴、容易吃袋角/库边）的 18 杆丢了 3 杆（17%），真正贴库的 3 杆反而全进（贴库球他们会按库边球打，有专门打法），离库 8 厘米以上的 101 杆只丢 2 杆。白球贴库 5 杆全进（样本少）。中袋 23 杆全进，角袋 99 杆丢 5。\n3. **最容易丢的是\"接手第一杆\"和\"2号球\"**：同一人本局连续打的第 1 杆丢 5/46（11%），第 2 杆以后只丢 6/154（4%）。按球号看，2 号丢 4/29（14%），其它号基本在 0~9%。原因是开球后 2 号的位置是随机的（主播反复说\"2号不好叫/2号在库边/只剩翻中袋\"），后面的球都是自己走出来的。**给我们选手的启发：练\"接手第一杆\"（陌生球形、远台、角度不自己定）比练清台中段更值。**\n4. **压力下进球率没明显下降，走位质量和决策下降了。** 比分胶着（分差 ≤4）时进攻失误 4/54（7%）、落后时 3/92（3%）、领先时 4/54（7%），区间都重叠，看不出\"胶着就手软\"。但主播提到\"紧/手凉/走神/分心\"的 70 多条语录里，前段多是\"谨慎/保守\"，第 17 局之后变成\"手紧/手凉/走神/分心\"（第 24、25、28、32 局最密），对应的失误不是\"没进\"，而是**判断性失误**：第 24 局赵汝亮 K3 力量过大（党金虎：\"判断性失误、画形错误\"）、第 24 局郑肖淮自由球想偷袋角洗袋、第 25 局赵汝亮\"又想踢球又想打二\"两头空（杨帆：\"这种毛病今天犯了四五回\"）、第 32 局赵汝亮\"看不懂是攻是防\"打厚漏球。**压力下先坏的是\"想要的太多\"，不是准度。**\n5. **按选手：两人准度一样，风格不同。** 郑肖淮丢 6/95、赵汝亮丢 5/105，有球位的部分郑 2/64、赵 3/56，差别在统计误差内。走位：赵汝亮下一杆平均切角 14°、郑肖淮 20°（赵走位更\"直\"更保守，郑爱留角度）；主播说\"走位有问题\"的比例郑 20%、赵 17%。前段（第5~13局）两人都 0 失误，中段开始丢球，后段（24 局后）郑肖淮丢 3/30、赵汝亮 2/36。\n6. **走位的飘：大力和多库最飘，低杆比高杆飘。** 主播评价\"走多/走少/走大了/不理想\"的比例：力量\"大\"的杆 41%（12/29）、\"小\"的 16%、没说的 14%；一库 10/32（31%）、两库 6/18（33%）、没说吃库的 3/21。第 5~12 局用预判器目标区量的\"实际停点离目标区中心\"：反推 0 库 0.43 米、1 库 0.30 米、2 库 0.81 米、3 库 0.73 米；杆速慢（<1.5）0.34 米、中 0.49 米、快（>2.5）0.64 米。杆法：带低杆的组合 20~40% 被说走位有问题，纯高杆/推杆只有 6%（1/17）——和南哥\"中力最稳、复杂杆法更飘\"的口径一致，补一条：**这两位高手高杆推的走位比低杆拉的稳得多，低杆的失误多在\"拉多了/拉少了\"。**\n\n## 失误清单（第5~32局全部 11 杆进攻失误，按局）\n\n| 局 | 谁 | 球 | 球位难度 | 局势 | 怎么丢的（主播） |\n|---|---|---|---|---|---|\n| 17 | 郑肖淮 | 9 | 切角32°，白→球1.29m，球→袋1.16m，难度1.76 | 领先15 | 又大力又打薄，还留了闭眼能进的9（薛珍麒：有压力；杨帆：绝对紧张了） |\n| 18 | 郑肖淮 | 6 | 切角17°，0.49m/0.87m，难度0.44 | 领先19 | 打空心了居然没进（袋口小）；根源是5号没走好 |\n| 20 | 赵汝亮 | 2 | 切角7°，白→球1.98m，难度1.55 | 落后18 | 长台不够低、打薄，2和9都没进 |\n| 20 | 赵汝亮 | 6 | 切角1°，1.23m/1.24m，难度1.52 | 落后18 | 6打薄想两库找9，没进还留了包进的传9（这局就这球输的） |\n| 21 | 郑肖淮 | 7 | 薄球（无球位） | 领先22 | 差一点点，打薄了；前一杆6号低杆没粘住留成薄球 |\n| 23 | 赵汝亮 | 2 | 切角47°，1.14m/0.79m，难度1.34 | 落后8 | 软塞往里搓打不进（翻/薄二选一拼了） |\n| 24 | 郑肖淮 | 4 | 自由球边库球（无球位） | 胶着+4 | 想偷一点袋角走位，白球洗袋（四位主播：两人都手紧了） |\n| 25 | 赵汝亮 | 2 | 无球位 | 胶着+1 | 想打2顺便踢9/踢8，分心，两个都没进 |\n| 27 | 郑肖淮 | 2 | 薄球（无球位） | 领先13 | 袋口弹出来，丢了大金（薛珍麒：看表情有压力） |\n| 32 | 郑肖淮 | 4 | 无球位 | 胶着-3 | 判断失误/打薄了，给对手留了往里打的球 |\n| 32 | 赵汝亮 | 5 | 无球位 | 胶着+3 | 攻防不定想了很久，打厚漏了，塞又刹车 |\n\n11 杆里：远台/薄球 6 杆（17、20×2、21、23、27），\"想要的太多\"3 杆（20 的找 9、24 的偷袋角、25 的踢 9/8），走位没走好留下的难球 2 杆（18、21）。**没有一杆是中近台、角度小、目标明确的球。**\n\n另算的：翻袋 8 杆丢 4（50%）、跳球 3 杆丢 2、解球 16 杆有 5 次犯规（赵汝亮第 17、24 局；郑肖淮第 19、23、28 局）——解球犯规是郑肖淮更明显的短板（佟璐第 32 局：\"小淮今天解球失误太多了\"）。\n\n## 走位偏差的规律（细一点）\n\n- **力量**：主播说\"大/发力\"的 29 杆进球里 12 杆被说走位有问题（41%）；\"小/轻\"的 25 杆只有 4 杆（16%）。大力走位不好的典型：第 6 局郑肖淮 7 号（\"力量过大\"）、第 24 局赵汝亮 K3（\"怎么能发那么大力\"）、第 29 局 K7（\"又太大力了\"）。\n- **吃库**：第 5~12 局反推杆法的吃库数 vs 停点偏差（离预判目标区中心）：0 库 0.43m（13 杆）、1 库 0.30m（13 杆，5 杆落在区内）、2 库 0.81m（17 杆，4 杆在区内）、3 库以上 0.7m+。一库最稳、两库开始飘，和南哥\"吃库越多越飘\"一致。注意这里的\"目标区\"是预判器自己想的，不是选手想的，只能看趋势。\n- **杆法**：纯高杆/推杆 17 杆只有 1 杆被说走位差；含低杆的各组合 20%~40%。低杆走位差的说法集中在\"拉多了\"（第 8 局 5 号、第 12 局 2 号拉过头踢 9 失败、第 18 局 4 号多走一颗）和\"没粘住\"（第 21 局 6 号）。\n- **切角**：本杆切角 30° 以内 vs 30~50°，下一杆平均难度分一样（0.49），看不出切角大走位更飘；但 50° 以上只有 3 杆，不够说话。\n- **局段**：前段（5~13 局）走位被挑毛病的比例 28%、中段 16%、后段 13%——不是越打越差，而是前段赵汝亮\"紧\"（薛珍麒第 5 局：\"看得出来紧，真紧\"，党金虎：\"没敢发力\"）走位偏保守偏小，第 13 局郑肖淮\"几杆没调回来\"。\n\n## 给工作台 / 教练的可落地建议\n\n1. 难度模型里**距离权重要大于切角权重**：这两位 40° 内切角几乎不丢，但白球到目标球 >1.2m 或总路程 >1.8m 失误率飙到 20~30%。现在教练的\"薄球打折（50° 起）\"方向对，但还应加\"长台打折（白→球 1.2m 起，总路程 1.8m 起）\"。\n2. \"近库\"（离库 2~8cm）单独算一档难度，比贴库更危险；贴库球按库边球处理反而稳。\n3. 走位误差模型：高杆推 < 低杆拉；一库 < 两库 < 三库；小力 < 大力；用这个顺序排优先级和南哥 v0.5 不稳定性补丁一致，再补\"低杆拉多/拉少\"这个方向性误差。\n4. 心态/压力不用做成\"准度下降\"，做成\"决策变贪\"：胶着时 AI 教练应把\"顺便踢 9 / 顺便 K\"这类复合意图的把握阈值提高（第 12、20、25 局三次踢 9 全失败）。\n\n## 方法与局限\n\n- 数据来源：`分析/逐杆_带掌声.json`（结果、比分、台上剩）、`分析/卡片/第5~32局.json`（类型、杆法、力量、评价、心态）、`分析/球位/第5~23局.json`（每杆出杆前坐标；第 24 局以后还在生成，跑一遍 `build.py` 会自动带上）、`predict/逐杆预判.json`（第 5~12 局的白球实际停点与预判目标区）。\n- 对账：卡片和逐杆按\"局 + 谁打 + 打几号\"顺序贪心对上（248/292 行对上；没对上的是第 33 局以后没卡片的行和\"进X换人\"合并行的第二杆）。比分牌一行有时含两杆（\"进2，换人\"），我拆成\"进了一杆 + 没进一杆\"，第二杆没有球位。\n- 难度：目标球 = 台上最小号（传球按卡片写的号）；袋口 = 卡片/预判文件写的袋，没写就挑切角最小且不被挡的袋；切角按假想球算；贴库 = 球心离库 <2cm，近库 <8cm；难度分 = 白→球距离 × 球→袋距离 / cos(切角)，再乘贴库系数。球位置信 0.4~1.0，大部分 ≥0.8，坐标误差大约 2~5cm，切角误差大约 ±3°。\n- 样本小：进攻失误总共 11 杆，分到各组每格只有 0~4 杆，所以每张表都给了 95% 区间，区间重叠的差别不要当结论。\"压力下有没有变化\"只能说进球率看不出、决策看得出。\n- 第 33 局以后没卡片，分不清攻防，没进统计（39 杆，换人 14 次）。\n- \"走位目标区\"只有预判器的（第 5~12 局），选手真实想停哪只有主播的话，用了\"主播评价含走多/走少/不理想\"这个粗抓法，会漏也会误抓。\n"}, {"题": "预判对答案：预判错题本", "文": "# 预判错题本（第 5~12 局，2026-10-04 独牙九球决赛 郑肖淮 vs 赵汝亮）\n\n训练法：每杆出杆前，用九球 AI 教练副本（阿杰v0.5，`engine/clearance/nine_coach.py` 的拷贝）预判\"职业选手会怎么打\"，出杆后和实际对答案。只用出杆前的球位。\n偏差三类：①一样 ②不一样但也合理（引擎真人误差下两条线都行、主播也没说差）③离谱（想法差很远）。\n离谱的进这里：局面图、选手当时怎么想（主播怎么说）、我们缺了什么、怎么改；改完在副本上真改（`presets.json` 里的 v1 规则，代码在 `predict_core.py: install_rules`），重跑看准确率。\n\n图：`对比图/v0/序NNN_第N局_谁.png`（青色=预判线路和白球落区，黄色虚线=按球位反推的选手线路，星=白球实际停点）；原始画面 `../分析/球位/检查图/第N局_序NNN.jpg`。\n\n---\n\n## 第 1 题　第 6 局 序 6 赵汝亮 打 2 号：66° 薄球，职业选手选防守，教练直接进攻\n- 图：`对比图/v0/序006_第6局_赵汝亮.png`　画面：`../分析/球位/检查图/第6局_序006.jpg`\n- 预判（v0）：打 2 号进左下角袋，低杆中大力，几何把握 92%，\"把握够高不用考虑防守\"。\n- 选手怎么想：薛珍麒\"2 号没直线进球路，轻轻薄一下做防守，让郑肖淮看不到 2 号\"；党金虎\"防得太好\"；秦利文\"合理性极高\"。（柯秉逸看成二传八，杨帆赛后说没防好——分歧，但没人认为该直接进攻。）\n- 我们缺了什么：教练的进球把握公式只在 70° 以上才打折，66.6° 的薄球还给 92%；职业选手把 60° 以上、还要滚 0.9 米的薄球当\"没线\"。而且进攻把握 ≥80% 时教练根本不比较防守。\n- 怎么改：`thin_cut`——切角超过 50° 开始打折（66° → ×0.47），打折量按目标球离袋距离缩放（离袋近的薄球职业选手照打，见第 11 局序 49）；真人误差世界里薄球的方向误差也放大，不然引擎世界 66° 薄球还能进 7 成、抽样后照样进攻。\n- 改后（v1）：预判变成\"轻碰 2 号薄擦防守\"，和选手一样。\n\n## 第 2 题　第 7 局 序 22 赵汝亮 打 7 号：多塞两库把 8 号叫直，教练只会一库停在原地\n- 图：`对比图/v0/序022_第7局_赵汝亮.png`　画面：`../分析/球位/检查图/第7局_序022.jpg`\n- 预判（v0）：7 号进右上角袋中杆中大力，白球一库停在右上角附近（离 8 号 1.6 米的长台，下一杆把握 0.69）。\n- 选手怎么想：薛珍麒\"中杆多一塞两库\"、秦利文\"两库加左塞\"、佟璐\"中杆塞要多\"、柯秉逸\"推杆两库或小顿推\"——7 号有点直又远，一库得发大力，两库靠加塞走到台中把 8 叫直。进了全场叫好（秦利文\"真牛逼\"、杨帆\"这个球是牛逼的\"）。\n- 我们缺了什么：教练只在\"走位已经很差\"时才试加塞，而且塞只到 0.3、加塞杆速只到 1.8；\"多塞两库叫直\"这种线路根本不在它的选项里。引擎复打：选手那条线下一杆把握 0.97、期望胜率 0.91，预判的 0.69/0.69。\n- 怎么改：`side_always` 让加塞走位一直参与比较——**没用**，选项库还是太窄（塞量、杆速档位不够）。要真改得扩教练的加塞网格（塞到 0.5、杆速到 2.5），这轮没动教练本体，留着。\n- 改后（v1）：还是离谱（唯一一道两版都没过的题）。\n\n## 第 3 题　第 8 局 序 25 郑肖淮 自由球打 2 号：职业选手抓两库回台中，教练三库跑到角落\n- 图：`对比图/v0/序025_第8局_郑肖淮.png`　画面：`../分析/球位/检查图/第8局_序025.jpg`\n- 预判（v0）：2 号左下角袋高杆中大力，白球三库跑到右下角（离 3 号 2 米）。\n- 选手怎么想：佟璐、薛珍麒\"自由球摆在一条离得远但线路顺的进球线上，进 2 后小低杆抓两库，白球从 5 号和 9 号中间弹起来叫 3 号中袋\"；佟璐\"这个小位置走的合理\"。\n- 我们缺了什么：教练的\"好位置地图\"只看那个点打下一颗的把握，不罚\"离下一颗远\"和\"白球跑太远\"（原来每多跑 1 米只扣 0.04）；它觉得右下角打 3 号把握也有 0.93，就不在乎 2 米的距离。职业选手的原则是停得离下一颗近、角度小。\n- 怎么改：`stay_close`——白球停点离下一颗超过 0.8 米的部分 ×0.3 罚分，白球跑动超过 1.2 米的部分 ×0.1。\n- 改后（v1）：预判变成低杆两库（和选手同类），但停点还差 89 厘米——选手穿 5、9 中间回台中那条线更精，教练停在右侧。记合理。\n\n## 第 4 题　第 9 局 序 34 郑肖淮 打 4 号：近直球一个定杆就够，教练两库跑到台另一头\n- 图：`对比图/v0/序034_第9局_郑肖淮.png`　画面：`../分析/球位/检查图/第9局_序034.jpg`\n- 预判（v0）：4 号右中袋中杆中大力，白球两库跑到左上角（161 厘米外）叫 5 号。\n- 选手怎么想：六位主播一致——薛珍麒、秦利文\"小低杆点住/稍微拉一点点\"、柯秉逸\"定杆横移一点点，不要太大力，大力容易失误\"、杨帆\"一进一个定\"。郑肖淮就是一个小力定杆，白球动了 7 厘米。\n- 我们缺了什么：同第 3 题，教练不罚跑动；而且它在候选里把 1.5 米外的右上角袋也当成好选择（几何把握 0.85）。\n- 怎么改：`stay_close`；另外 `long_pot`（长台加把握，第 7 题）第一版让它改打右上角袋，又错了——改成\"只在没有近袋好球时才加把握\"（近袋优先）。\n- 改后（v1）：回到右中袋低杆中力，和选手袋一样；但还走了 80 厘米，\"能定就定\"没完全学会。记合理。\n\n## 第 5 题　第 11 局 序 47 郑肖淮 打 2 号：贴库球 1.8 米顺库，职业选手说没线，教练给 56%\n- 图：`对比图/v0/序047_第11局_郑肖淮.png`　画面：`../分析/球位/检查图/第11局_序047.jpg`\n- 预判（v0）：2 号顺库打右上角袋，中杆中大力，几何把握 56%，真人误差抽样 11/16 进。\n- 选手怎么想：主播都说\"开完 2 号没直接线路\"；柯秉逸\"手感正热、防也不好防，干脆拼翻袋\"；薛珍麒\"轻轻翻\"、党金虎\"要下反塞\"、佟璐\"一库不够翻得两库\"。翻薄了没进，但 2 号贴库了赵汝亮也没球。\n- 我们缺了什么：引擎的物理对贴库球顺库长台太宽容（22/30 进），职业选手把\"贴库 + 离袋 1 米以上\"当没线。\n- 怎么改：`rail_long`——目标球贴库（离库边 <2 厘米）且离袋 >1 米，把握 ×0.5。\n- 改后（v1）：预判改成轻碰防守。选手是翻袋，主播自己也分两派，记合理。\n\n## 第 6 题　第 12 局 序 59 赵汝亮 打 4 号：15° 明球放着不打，教练去赌 35% 的 4 传 9\n- 图：`对比图/v0/序059_第12局_赵汝亮.png`　画面：`../分析/球位/检查图/第12局_序059.jpg`\n- 预判（v0）：\"借球：碰 4 号把 9 号撞进左下角袋（进了就赢）\"，把握 35%。\n- 选手怎么想：秦利文\"高杆推带点右塞过去留 5 号\"、薛珍麒\"轻轻一推顶一下七号\"——就是打 4 号走位，没人提传 9（佟璐说劲大了一点、薛珍麒说走多了，那是执行）。\n- 我们缺了什么：教练给\"进了就赢\"的价值 1.2，35%×1.2=0.42 压过了 4 号明球（100%）× 走位价值；职业选手在有稳的清台路线时根本不赌低把握的传 9（独牙还有自由球不能直接进 9 的规矩，更不鼓励赌）。\n- 怎么改：`combo_min`——借球/组合进 9 的把握低于 60% 不考虑。\n- 改后（v1）：预判打 4 号进左下角袋，和选手一样；走位一库停左下、选手推过去留 5 号，记合理。\n\n## 第 7 题　第 12 局 序 60 赵汝亮 打 5 号：1.7 米长台小角度球，教练给 53% 去防守，选手推一库打进\n- 图：`对比图/v0/序060_第12局_赵汝亮.png`　画面：`../分析/球位/检查图/第12局_序060.jpg`\n- 预判（v0）：\"最好的进攻抽样期望只有 50%（进球 3/8 次），防守的期望胜率 82% 更高——轻碰 5 号薄擦\"。\n- 选手怎么想：薛珍麒\"推一库起来留 6 号\"、秦利文\"带点右塞推进\"、柯秉逸\"轻点一下\"，评价好球——没人觉得这球难。\n- 我们缺了什么：引擎的进球把握公式里，目标球离袋越远误差越大（1.69 米、11° 只给 53%），真人误差世界里也只进一半；职业选手对长台小角度球的把握远高于此（这台他们 1.7 米直线球基本不丢）。\n- 怎么改：`long_pot`——切角 <25°、离袋超过 1 米的部分每米 ×0.8 加把握，封顶 0.85，而且只在没有近袋好球时用（第 4 题的教训）。\n- 改后（v1）：预判打 5 号左下角袋低杆中大力（选手推一库），停点差 44 厘米，记合理。\n\n---\n\n## 改模型前后对比（第 5~12 局，63 杆，去掉 3 杆无法比）\n\n| 版本 | 袋口命中 | 类型命中 | 白球落区 | 停点差中位 | 一样 | 合理 | 离谱 |\n|---|---|---|---|---|---|---|---|\n| v0 原版教练 | 96%（47 杆） | 93%（60 杆） | 29%（51 杆） | 55 厘米 | 22 | 31 | 7 |\n| v1 加 6 条规则 | 96%（47 杆） | 95%（60 杆） | 24%（51 杆） | 51 厘米 | 21 | 37 | 2 |\n\n- 7 道离谱题改好 6 道（第 2 题\"多塞两库叫直\"没改好，要扩教练的加塞选项）。\n- v1 新出 1 道离谱：第 11 局序 49 赵汝亮打 3 号——62° 薄球但离袋只有 31 厘米，赵汝亮直接低杆戳进（薛珍麒：挺好），薄球打折把把握压到 0.65，教练比了一下选了防守。说明薄球打折按离袋距离缩放还不够，挂在袋口附近的薄球职业选手照打；下一轮把 `dop0` 再调小或按\"离袋 <0.4 米不打折\"处理。\n- 白球落区率反而掉了 5 个点：走位罚分改了教练选的杆速/高低杆档位，引擎真打的停点飘得更散（第 11 局序 51 同一杆 v0 差 16 厘米、v1 差 93 厘米）。白球停点本来就是最弱的一环（见 说明.md 已知问题）。\n\n## 学到的最重要的 3 条思路差异（职业选手 vs 我们的教练）\n1. **走位先看距离和角度，不看\"地图分\"**：近球能定杆就定杆，走位要停到离下一颗近、角度小的地方；为了一个\"把握 0.93 的好点\"跑两库到台另一头，职业选手不干（第 3、4 题）。\n2. **什么球算\"有线\"的口径不一样**：60° 以上还要滚一米的薄球、贴库球顺库 1.8 米——职业选手当没线，宁可防守/翻袋（第 1、5 题）；反过来 1.7 米的小角度直线球、挂袋口附近的薄球，他们当明球照打（第 7 题、序 49）。引擎的把握公式对\"远\"太悲观、对\"薄\"太乐观。\n3. **有稳的清台路线就不赌**：35% 的传 9 不如 100% 的明球加走位（第 6 题）；但走位里他们敢用\"多塞两库叫直\"这种我们的教练根本不会想的线（第 2 题）。\n"}, {"题": "比赛台测量：说明", "文": "# 独牙比赛台 物理测量 说明（2026-10-04 独牙九球200万决赛 郑肖淮 vs 赵汝亮）\n\n目录：`~/pool-live-rec/物理/`。代码在 `lib/`，中间结果在 `scan/ 轨迹/ 拟合/`，交付：`独牙比赛台.json`（球台档案）、`加塞对照表.md`、`颗星解球.md`、`图/`。\n只读了录像（秦利文那路，缺的时候退到杨帆），没动别人的目录；`vision/` 的单应换算、认球代码是复制到 `lib/` 里用的，没改原文件；没写进工作台。\n\n## 一句话结果\n\n| 参数 | 独牙台 | 误差（中位数 68% 区间） | 用了多少 | 乔氏台 | 巴彦淖尔台 | 工作台默认 |\n|---|---|---|---|---|---|---|\n| 台呢滚动阻力 u_r | **0.0080** | 0.0077 ~ 0.0081 | 175 条纯滚段 | 0.0073 | 0.0082 | 0.010 |\n| 滑动摩擦 u_s | **0.16**（粗） | 段间分布 0.12 ~ 0.28 | 11 条目标球起步段 | 0.2（没校出） | 0.2（没校出） | 0.20 |\n| 库边弹性 e_c（引擎参数） | **0.94** | 0.935 ~ 0.945（9 次撞库） | 9 次可靠 / 17 次 | 0.93 | 0.967 | 0.80 |\n| 库边摩擦 f_c | 0.2（存疑） | 0.1 ~ 0.3 | 和 e_c 一起反推，分不开 | 0.2 | 0.203 | 0.20 |\n| 球碰球弹性 | 0.95（默认） | — | 没量 | 0.95 | 0.95 | 0.95 |\n| 杆头效率 | 0.57（默认） | — | 画面量不到 | 0.57 | 0.57 | 0.57 |\n\n\"滑不滑\"：\n- 滚动阻力 0.0080，比工作台默认台（0.010）快 20%，跟巴彦淖尔台（0.0082）几乎一样，比乔氏台（0.0073）慢一点。也就是说这张台台呢确实偏快，但在比赛台里属于正常偏快，不是特别滑。\n- 滑动摩擦粗量 0.16，比默认 0.20 低——白球出杆后要多滑一会儿才变纯滚（主播说\"高低杆都偏低\"，和这个方向一致：台呢抓不住球，旋转\"吃\"进去慢）。这个数只有 11 段、每段只有 3~6 个有效画面，误差大，档案里标 measured 但 note 写明粗。\n- 库边弹性 0.94，和乔氏台一个档次（0.93），比巴彦淖尔（0.967）死一点，比工作台默认（0.80）活很多。所以用默认台练出来的手感，到这张台上库边会明显\"弹\"。\n- 库边角度：目标球（肯定没塞、自然滚动）撞库 13 次（≥0.4 m/s）：出角−入角 中位 −1.6°，散在 −8°~+9°。引擎按测出的参数算：小力（0.5 m/s）出角比入角大 1~4°（偏长），中力接近镜面，大力（2~3 m/s）出角比入角小 3~5°（偏短）——和南哥\"小力无塞≈镜面、大力无塞反射角<入射角\"一致。\n\n## 怎么做的\n\n1. **第一遍扫描**（`lib/scan.py`）：每杆窗口 [开始−1 秒, 结束+1 秒]，4 帧/秒半分辨率看三件事：是不是主机位（绿色台面轮廓和缓存相机的 IoU≥0.6）、台面上有没有东西在动（相邻帧灰度差）、有没有人趴进来。全场 289 杆、约 5 小时录像，两进程 15 分钟扫完。\n2. **第二遍逐帧追球**（`lib/track.py`、`lib/track_all.py`）：只在\"主机位 + 有动静\"的区间里，从区间第一帧用认球帮手的 `balls.detect` 认出球位，然后 60 帧连续解码（ffmpeg nice 15、2 线程、-ss 在 -i 前、同时 2 个），每颗球在预测位置附近找非台呢块定球心（单球取质心；粘连用距离变换峰），像素→台面坐标用 `homocam.HomoCam.unproject`（单应矩阵 + 球心高度补偿，复用 vision/ 的）。镜头一切走（IoU<0.6）就停，球动过之后全部静止 1 秒也停。共 995 个片段。\n3. **去补帧**（`lib/fit.py: unique_frames`）：发现这路流是 **25 帧源补成 60 帧**（2,3,2,3,2 周期，偶尔漂一帧），补的帧只有编码噪声。按相邻帧差自适应阈值挑出\"新画面\"，时间用 60 帧槽位做 13 点局部线性回归，去掉 ±7 毫秒抖动。实际时间分辨率 0.04 秒。\n4. **切段拟合**（`lib/fit.py`）：每颗球按事件（方向变 >15°、快慢比超 1.5 倍、低速 Δv>0.3）切成自由滚动段；每段主方向投影做 s(t)=s0+v0 t+a t²/2，9 点滑窗得局部加速度；滑动→纯滚用\"两段加速度、位置速度连续\"的折线模型网格搜转折点 tc。撞库：相邻两段断点在库边 6 厘米内、法向速度反向；撞库前后各 0.28 秒二次拟合外推到接触瞬间得进出速度向量。\n5. **参数**（`lib/summarize.py`、`lib/make_profile.py`）：\n   - u_r：每段去掉开头滑动段（tc+0.1 秒之后），局部加速度窗取中位 → 每段一个 u_r=−a/g；175 段取中位数，误差用自助法（段为单位重抽 2000 次）68% 区间。\n   - u_s：目标球被撞后从静止起步的第一段，滑动期减速度 a1=−u_s·g；只用起速 ≥0.8 m/s 的（慢球滑动段只有 2~3 个新画面）。\n   - e_c、f_c：目标球（自然滚动、无塞，撞库前已滚 ≥0.25 米）撞库，用工作台引擎（pooltool legacy，和 clearance.core.simulate 同一套）从撞库前状态真撞一次，和录像里撞库后 0.03~0.36 秒的速度序列比，e_c 从 0.6 扫到 0.98、f_c 0.1~0.3，误差最小的就是这次的参数；接触时刻 ±10 毫秒也一起搜。17 次里引擎残差 <0.08 m/s 的 9 次可靠，取中位。\n6. **档案**：`独牙比赛台.json`，格式照工作台 `clearance/table_profiles.json` 一条档案（value/status/err/n/note），id `duya20261004`。只放在这里，没写进工作台。\n\n## 准确度怎么验的、哪里不行\n\n- 球位绝对误差继承认球帮手的单应换算（约 1~1.5 厘米）；但滚阻、弹性都只用速度和加速度（位置差分），常数偏差抵消。静止球位置重复误差 <1 毫米，滚动中的球二次拟合残差中位 0.5~1 毫米。\n- u_r 分速度：0.1~0.3 m/s 103 段 0.0079，0.3~0.6 m/s 60 段 0.0080，0.6~1.0 m/s 11 段 0.0101（高速段少、带滑动残留，不作数）。白球 59 段 0.0079、目标球 116 段 0.0080，两边一致，说明没把白球的旋转余量混进来。\n- e_c：引擎残差曲线在 0.9~0.98 之间比较平（慢速撞库对 e_c 不敏感），所以 68% 区间窄（0.935~0.945）是中位数的统计区间，真实系统误差大概 ±0.02。f_c 在 0.1~0.3 之间分不出来，标存疑。\n- **最大的坑：转播在出杆那一下几乎都切近景**。主机位能看到的多是\"切回来时球还在滚\"的后半段，所以：白球从静止出杆到停全程拍到的只有 20 杆；白球撞库只追到 10 次；23 杆解球里 6 杆有主机位片段、能量到第一库撞点的只有 2 杆；主播说了塞又追到白球撞库的只有 1 杆。这不是算法问题，是镜头没给。要补这块得用近景/侧机位（相机没标定）。\n- 25 帧有效帧率：滑动段 0.1~0.3 秒只有 3~7 个点，u_s 和白球\"多久变纯滚\"都粗。\n- 没量球碰球弹性（要碰撞瞬间两球速度，25 帧不够）、杆头效率（要杆速）。\n\n## 滑动段（出杆后多久变纯滚）\n\n白球从静止出杆、全程拍到且折线拟合可靠的 7 杆：起速 0.5~1.9 m/s，转纯滚 tc 0.10~0.31 秒，中位 0.12 秒；滑动期减速度 −1.5~−2.6 m/s²（相当于 u_s 0.15~0.26，带低杆/定杆的杆更大）。目标球被撞后：起速 0.5~2.1 m/s，tc 0.12~0.32 秒，和 tc=2v0/(7·u_s·g) 的预测同量级。明细在 `参数汇总.json` 的 `白球滑动段`、`目标球滑动段`。\n\n## 文件\n\n- `独牙比赛台.json` 球台档案（接工作台 table_adapt 用的格式）；`参数汇总.json` 全部数字和明细；`汇总.json` 每段/每次撞库原始拟合。\n- `加塞对照表.md` + `加塞对照.json`：看线路判塞。\n- `颗星解球.md` + `颗星解球.json` + `图/解球_第N局_卡k.png`、`图/修正表_角五法_独牙台.png`。\n- `轨迹/第N局_序k_i.json` 每片段每颗球逐帧 (帧, 片内秒, u, v, x, y, 状态)；`拟合/` 同名拟合结果；`图/traj_*.png` 俯视轨迹。\n- 重跑：`cd 物理/lib; PY=~/Documents/Codex/2026-09-27/new-chat/work/pool-env/bin/python; $PY scan.py 5 36; $PY track_all.py 5 36; $PY fit.py; $PY summarize.py; $PY make_profile.py; $PY kick.py; $PY spin_table.py`（scan/track 各 15 分钟，其余几分钟）。\n"}, {"题": "比赛台测量：加塞对照表", "文": "# 看线路判塞 对照表（独牙九球决赛 2026-10-04）\n\n怎么做的：主播卡片里说了\"左塞/右塞/反塞/顺塞/不加塞\"的杆，找主机位里追到的白球轨迹，取白球第一次吃库的进库角和出库角（都从库边法线量），左/右塞按白球去库的方向换成顺塞/逆塞（左塞=俯视顺时针；白球沿库边的速度分量和旋转同向就是顺塞）。南哥口径：小力无塞≈镜面；逆塞/大力无塞 出角<入角；顺塞 出角>入角。\"Δ\"=出角−入角，|Δ|≤3° 算镜面；撞库速度≥1.2 m/s 算大力。\n\n## 总结\n\n- 主播说了塞、且追到了白球吃库的杆：1 杆；线路和南哥口径一致的 1 杆（100%）。\n- 逆塞：1 杆，一致 1（100%），Δ 中位 -7.6°\n\n## 主播说了塞的杆（逐杆）\n\n| 局 | 序 | 谁打 | 打 | 类型 | 主播原话(节选) | 说法 | 判定 | 库 | 撞库速度 m/s | 入角° | 出角° | Δ° | 预期 | 符合 |\n|---|---|---|---|---|---|---|---|---|---|---|---|---|---|---|\n| 18 | 116 | 郑肖淮 | 8 | 进攻 | 轻推+一点点反塞（薛珍麒）；秦利文：发力一 | reverse | 逆塞 | left | 0.94 | 28.5 | 20.9 | -7.6 | - | ✓ |\n\n## 看线路判塞（查表）\n\n| 线路特征 | 判 |\n|---|---|\n| 出角 − 入角 > +3° | 顺塞 |\n| 出角 − 入角 < −3°，撞库慢（<1.2 m/s） | 逆塞 |\n| 出角 − 入角 < −3°，撞库快（≥1.2 m/s） | 逆塞 或 大力无塞（看目标球那张\"无塞基准表\"里同速度的 Δ 再定） |\n| |Δ| ≤ 3° | 无塞/很少塞 |\n\n## 主播没说塞的杆，用表判\n\n| 局 | 序 | 谁打 | 打 | 类型 | 库 | 撞库速度 | 入角° | 出角° | Δ° | 表判 |\n|---|---|---|---|---|---|---|---|---|---|---|\n| 15 | 82 | 赵汝亮 | 3 | 进攻 | bottom | 0.16 | 16.2 | 25.5 | +9.2 | 顺塞 |\n| 16 | 89 | 赵汝亮 | 2 | 解球 | right | 1.39 | 60.6 | 60.1 | -0.5 | 镜面 |\n| 21 | 141 | 郑肖淮 | 5 | 进攻 | left | 0.68 | 22.1 | 21.5 | -0.6 | 无塞(小力) |\n| 22 | 150 | 赵汝亮 | 4 | 进攻 | right | 0.49 | 39.9 | 29.1 | -10.8 | 逆塞 |\n| 25 | 184 | 郑肖淮 | 6 | 进攻 | left | 0.69 | 23.3 | 35.6 | +12.4 | 顺塞 |\n| 28 | 206 | 郑肖淮 | 2 | 解球 | left | 2.77 | 85.6 | 83.9 | -1.7 | 镜面 |\n| 30 | 226 | 赵汝亮 | 2 | 进攻 | right | 0.37 | 3.7 | 10.6 | +6.9 | 顺塞 |\n\n## 引擎参考表（按测出的独牙台参数真打：入射角 × 速度 × 塞 → 出角−入角 Δ°）\n\n塞按\"侧旋表面速度/球速\"=0.5（约半个皮头）给；顺塞=旋转方向和白球沿库边走的方向一致。自然滚动撞库。出角>95° 说明没正常弹回（撞到袋角），记 —。\n\n| 入射角 | 速度 m/s | 逆塞 Δ | 无塞 Δ | 顺塞 Δ |\n|---|---|---|---|---|\n| 20° | 0.5 | -0.2 | +1.2 | +2.7 |\n| 20° | 1.0 | -7.9 | -2.2 | +4.9 |\n| 20° | 2.0 | -9.9 | -3.8 | +4.1 |\n| 40° | 0.5 | +7.4 | +7.4 | +7.4 |\n| 40° | 1.0 | -0.8 | +0.9 | +4.0 |\n| 40° | 2.0 | -4.8 | -2.6 | +1.4 |\n| 60° | 0.5 | +12.3 | +12.3 | +12.3 |\n| 60° | 1.0 | +7.9 | +7.9 | +7.8 |\n| 60° | 2.0 | +3.1 | +3.1 | +3.3 |\n"}, {"题": "比赛台测量：颗星解球", "文": "# 颗星解球（独牙九球决赛 2026-10-04）\n\n星点口径：长库每边 7 颗星（8 格），短库 3 颗（4 格），一格 = 0.3175 米；长库的星从画面近端角袋数 0，短库从左角袋数 0。角从库边法线量。\n\n## 一、真实解球杆\n\n卡片类型含\"解球\"的杆，共 23 杆；主机位有白球轨迹的 6 杆，其中从静止出杆到走库全拍到的 5 杆（其余出杆时镜头切到了近景，主机位切回来时球已在滚；扎杆弧线不走库）。\n\"镜像第一库星\"=把目标球沿第一库照镜子、从白球出发瞄过去该撞的那颗星；\"实际第一库星\"=追到的撞点；差>0 说明他打得比镜像更靠远端/右边。\"引擎回放\"=用追到的出发速度方向，在引擎里按独牙台参数无塞/带塞各打一遍，列每库撞点和离目标球最近距离（米）。\n\n| 局 | 序 | 谁打 | 解 | 打法 | 主播说的线路/杆法 | 出发 | 吃库(库:星,速度,入角→出角) | 先碰 | 镜像第一库星 | 实际 | 差 | 引擎无塞(独牙) 库/离目标 | 评价 |\n|---|---|---|---|---|---|---|---|---|---|---|---|---|---|\n| 6 | 7 | 郑肖淮 | 2 | 扎杆 | 扎杆弧线（秦利文、薛珍麒、党金虎）；带强左塞让白球吃过去刮半颗（薛珍麒预判）；佟璐说勾着打、要发大力带右塞6号才能进 | (1.07,0.92) | （没撞库就碰球/没追到撞库） | 2 | — | — | — | [('left', 7.16), ('top', 0.64), ('right', 3.64)] 离0.305 | 好球加运气：碰到2号且6号进袋，主播齐赞太牛了、嘎嘎硬、帅，但都承认运气不错；杨帆认为这是冲动、运气 |\n| 7 | 16 | 赵汝亮 | 1 | 扎杆 | 扎杆小弧线（佟璐；党金虎：下了个弧线；柯秉逸：他扎杆）；薛珍麒：打得到就打薄球，不行就跳一下；下一点点塞（党金虎） | — | 主机位没拍到白球走库（出杆时镜头切到了近景） | | | | | | 碰到了没犯规，效果还可以、起码没直接漏（薛珍麒），但留给郑肖淮一个正角翻袋（薛珍麒、柯秉逸、佟璐、杨 |\n| 12 | 55 | 赵汝亮 | 2 | 走库 | 一库勾（具体路线待确认） | — | 主机位没拍到白球走库（出杆时镜头切到了近景） | | | | | | 一般/没防住：解到了2号没犯规，6号差点进袋、白球差点进中袋，2号跑出来给郑肖淮打了（佟璐：比我画的 |\n| 12 | 57 | 郑肖淮 | 3 | 走库 | 一库勾 | — | 主机位没拍到白球走库（出杆时镜头切到了近景） | | | | | | 失误：解太正了（薛珍麒），3号留给赵汝亮明球，党金虎：漏了；佟璐：三到八没有难球，这盘打完了 |\n| 13 | 65 | 赵汝亮 | 1 | 走库 | 往缝里解半颗、轻一点（薛珍麒看出来的）；柯秉逸看的是解这边一库；杨帆主张大劲一打；佟璐说别用太高杆容易洗袋 | — | 主机位没拍到白球走库（出杆时镜头切到了近景） | | | | | | 失误：解薄了，漏球，给对手小金机会（杨帆：这不是球运太差，是勾的方位不对） |\n| 14 | 74 | 赵汝亮 | 4 | 走库 | 扎一点点、右塞（薛珍麒）；中高杆推、小力（佟璐）；柯秉逸：一库就好，看着像解了三库还来了个小弧线 | — | 主机位没拍到白球走库（出杆时镜头切到了近景） | | | | | | 分歧：薛珍麒说解薄了漏了；柯秉逸说解得太完美；佟璐说三库解得挺好但他想的应该是直接勾、没勾着；结果4 |\n| 16 | 89 | 赵汝亮 | 2 | 走库 | 吃库解球，走“解2带4”线路（柯秉逸、佟璐）；佟璐：2号应该打更厚一点白球才会往那边走 | (0.72,1.83) | right:2.6星 1.39m/s 61°→60° | 2 | 2.65 | 2.59 | -0.06 | [('right', 2.62),
